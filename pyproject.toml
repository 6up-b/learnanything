    "learnloop.attempts.attempts -> learnloop.diagnosis.error_taxonomy",
    "learnloop.attempts.attempts -> learnloop.diagnosis.error_taxonomy_map",
    "learnloop.attempts.attempts -> learnloop.diagnosis.probe_episodes",
    "learnloop.attempts.attempts -> learnloop.diagnosis.remediation",
    "learnloop.attempts.attempts -> learnloop.scheduling.fsrs",
    "learnloop.attempts.coldness_receipt -> learnloop.diagnosis.remediation",
    "learnloop.attempts.effective_observation -> learnloop.diagnosis.robust_composition",
    "learnloop.attempts.grader_calibration -> learnloop.diagnosis.probe_families",
    "learnloop.attempts.grading -> learnloop.diagnosis.causal_attribution",
    "learnloop.attempts.grading -> learnloop.diagnosis.discrimination_profiles",
    "learnloop.attempts.grading -> learnloop.diagnosis.error_hunt",
    "learnloop.attempts.grading -> learnloop.diagnosis.error_taxonomy_map",
    "learnloop.attempts.grading -> learnloop.diagnosis.repair_splice",
    "learnloop.attempts.post_attempt -> learnloop.diagnosis.followups",
