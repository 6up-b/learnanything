    "learnloop.content",
    "learnloop.reader",
    "learnloop.tutor",
    "learnloop.ops",
    "learnloop.params",
    "learnloop.sim",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "entry-points-are-independent"
name = "CLI, TUI, and sidecar do not depend on one another"
type = "forbidden"
source_modules = ["learnloop.cli"]
forbidden_modules = ["learnloop.tui", "learnloop_sidecar"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "tui-is-independent"
name = "TUI does not depend on other adapters"
type = "forbidden"
source_modules = ["learnloop.tui"]
forbidden_modules = ["learnloop.cli", "learnloop_sidecar"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "sidecar-is-independent"
name = "Sidecar does not depend on other adapters"
type = "forbidden"
source_modules = ["learnloop_sidecar"]
forbidden_modules = ["learnloop.cli", "learnloop.tui"]
allow_indirect_imports = true

