[[tool.importlinter.contracts]]
id = "frozen-cross-package-cycles"
name = "Existing deferred cross-package cycles are frozen"
type = "acyclic_siblings"
ancestors = ["learnloop"]
depth = 0
ignore_imports = [
    # Composition-root registration of the field's sole DERIVED-table owner.
    "learnloop.substrate.rebuild_orchestrator -> learnloop.field.outcomes",
    # Learner field F2: placement consumes the field's two pure leaf modules,
    # the LearnerPredictor contract (field.types) and the shared fast-track
    # blocking rule (field.signals). Both import only the standard library and
    # field.types, except that field.signals also imports the stuck prompt's
    # leaf attempts.stuck (pydantic, ai.schemas, algorithm_versions and
    # attempt_types at module level; its judgment-ledger store import is
    # function-local), and field/__init__ imports only field.types, so these
    # edges cannot form a runtime cycle with the scheduling/substrate consumers.
    "learnloop.placement.* -> learnloop.field.types",
    "learnloop.placement.signals -> learnloop.field.signals",
    # Learner field F2 review fix (F3): placement reads the existing
    # independence rule (attempts.reveal_ledger.production_admissibility over
    # reveal_events) rather than a copy of it. reveal_ledger imports only clock
    # and db.repositories at module level (its diagnosis.remediation import is
    # function-local and already exempt), so this cannot cycle at import time;
    # tutor.tutor_qa reads the same module under the same exemption.
    "learnloop.placement.state -> learnloop.attempts.reveal_ledger",
    "learnloop.attempts.attempts -> learnloop.diagnosis.causal_activity_policy",
    "learnloop.attempts.attempts -> learnloop.diagnosis.causal_attribution",
    "learnloop.attempts.attempts -> learnloop.diagnosis.diagnostic_augmentation",
    "learnloop.attempts.attempts -> learnloop.diagnosis.discrimination_profiles",
