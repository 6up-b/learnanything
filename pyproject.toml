    "learnloop.curriculum.golden_path_run -> learnloop.diagnosis.probe_episodes",
    "learnloop.db.repositories -> learnloop.ai.usage",
    "learnloop.db.repositories -> learnloop.ingest.ir",
    "learnloop.goals.certification_cold_probe -> learnloop.attempts.coldness_receipt",
    "learnloop.goals.certification_cold_probe -> learnloop.diagnosis.causal_activity_policy",
