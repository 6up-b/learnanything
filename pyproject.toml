[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "learnloop"
version = "0.1.0"
description = "Local adaptive learning vault with deterministic scheduling and routed AI-assisted authoring."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "ruamel.yaml>=0.18",
  "textual>=8.2.7",
  "typer>=0.12",
  "trafilatura>=2,<3",
  "beautifulsoup4>=4.12",
  "lxml==5.3.0",
  "youtube-transcript-api>=0.6",
  "openai>=1.0",
  "numpy>=2.1",
  "pypdf>=6.14.2",
  "sympy>=1.14",
  "tomlkit>=0.12",
  "manim>=0.19.1",
  "pyyaml>=6.0",
  "Pillow>=10.4",
]

[project.optional-dependencies]
mobile = [
  "starlette==1.7.0",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "qrcode==8.2",
]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.6",
  # The MCP adapter's tests run in every gate (no silent skips, unlike the
  # mobile extra): dev carries the same pinned SDK as the mcp extra.
  "mcp==2.3.0",
]
# High-fidelity PDF extraction (headings, tables, LaTeX math, OCR) for
# canonical source ingestion; heavy (pulls in torch). Without it, PDF
# ingestion falls back to plain pypdf text extraction.
pdf = [
  "marker-pdf>=1.10",
]
# What LearnLoop needs to drive a self-hosted GLM-OCR service: pypdfium2
# renders PDF pages into the images `python -m glmocr.server` reads. Hosted
# GLM-OCR (z.ai) needs no install, only a key. The glmocr SDK itself runs in
# its own environment (docs/reviews/glm-ocr-ingest.md): glmocr requires
# Pillow>=12 and transformers>=5 while marker-pdf pins Pillow<11, and the
# model is served by vLLM, SGLang or Ollama in any case.
glm-ocr = ["pypdfium2>=4"]
# The chat frontend over MCP (spec_mcp_frontend_c1): the official MCP Python
# SDK at the version the M0 probe verified with ChatGPT and Claude. Only
# learnloop_mcp imports it; `learnloop mcp serve` asks for it when missing.
mcp = [
  "mcp==2.3.0",
]

[project.scripts]
learnloop = "learnloop.cli:app"
learnloop-mobile = "learnloop_mobile.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/learnloop", "src/learnloop_sidecar", "src/learnloop_mobile", "src/learnloop_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers"]
markers = [
  "durability: use production SQLite durability and fresh vault construction for the test and every fixture it first builds",
]

[dependency-groups]
dev = [
    "import-linter>=2.13",
]

[tool.importlinter]
root_packages = ["learnloop", "learnloop_sidecar", "learnloop_mobile", "learnloop_mcp"]
include_external_packages = false

[[tool.importlinter.contracts]]
id = "infrastructure-does-not-import-domains"
name = "Persistence and AI stay below domain policy"
type = "forbidden"
source_modules = [
    "learnloop.config",
    "learnloop.vault",
    "learnloop.db",
    "learnloop.ingest",
    "learnloop.ai",
]
forbidden_modules = [
    "learnloop.attempts",
    "learnloop.learner",
    "learnloop.scheduling",
    "learnloop.goals",
    "learnloop.diagnosis",
    "learnloop.curriculum",
    "learnloop.substrate",
    "learnloop.content",
    "learnloop.reader",
    "learnloop.tutor",
    "learnloop.ops",
    "learnloop.params",
    "learnloop.sim",
    "learnloop.projects",
    "learnloop.router",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "router-log-is-a-leaf"
name = "Router R1 logging and outcomes stay a leaf below scheduling and substrate"
type = "forbidden"
source_modules = ["learnloop.router"]
forbidden_modules = [
    "learnloop.attempts",
    "learnloop.learner",
    "learnloop.scheduling",
    "learnloop.goals",
    "learnloop.diagnosis",
    "learnloop.curriculum",
    "learnloop.substrate",
    "learnloop.content",
    "learnloop.reader",
    "learnloop.tutor",
    "learnloop.ops",
    "learnloop.params",
    "learnloop.sim",
    "learnloop.projects",
    "learnloop.ai",
    "learnloop.cli",
    "learnloop_sidecar",
]
# Router R2b: the request builder constructs the Decider's typed questions
# (pure dataclasses in learnloop.ai.decisions) and bases the LLM's answer
# models on the wire base the structured transports require (pure pydantic,
# learnloop.ai.schemas.WireModel), and nothing else from learnloop.ai; no
# router module reaches a client, so replay still never can.
ignore_imports = [
    "learnloop.router.requests -> learnloop.ai.decisions",
    "learnloop.router.requests -> learnloop.ai.schemas",
]
allow_indirect_imports = true

