[[tool.importlinter.contracts]]
id = "field-predictors-are-pure"
name = "Learner predictors cannot access stores, models, graphs or evidence writers"
type = "forbidden"
source_modules = [
    "learnloop.field.predictors",
    "learnloop.field.memory",
    "learnloop.field.success_head",
    # Router R0: the llm_probability arms read only their prepared cache.
    "learnloop.field.probability_arms",
]
forbidden_modules = [
    "learnloop.db",
    "learnloop.ai",
    "learnloop.attempts",
    "learnloop.substrate",
    "learnloop.scheduling",
    "learnloop.diagnosis",
    "learnloop.learner.recall_coverage",
]
# The incumbent adapter reuses only mastery.py's pure arithmetic. A symbol-level
# test restricts that import, whose module also contains historical DB helpers.
# PF-a memory arms reuse only the pure FSRS fold and FSRS-6 default weights
# (scheduling.fsrs imports nothing but learnloop.numeric).
ignore_imports = [
    "learnloop.field.predictors -> learnloop.learner.mastery",
    "learnloop.field.memory -> learnloop.scheduling.family_memory_model",
    "learnloop.field.memory -> learnloop.scheduling.fsrs",
]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
id = "field-consumers-use-interface"
name = "Placement and map consumers do not import predictor implementations"
type = "forbidden"
source_modules = [
    "learnloop_sidecar.handlers.knowledge_map",
    "learnloop_sidecar.handlers.placement",
    "learnloop.diagnosis.calibration_sessions",
    "learnloop.diagnosis.quick_check",
    "learnloop.placement",
