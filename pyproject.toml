[[tool.importlinter.contracts]]
id = "router-log-is-a-leaf"
name = "Router R1 logging and outcomes stay a leaf below scheduling and substrate"
type = "forbidden"
source_modules = ["learnloop.router"]
forbidden_modules = [
    "learnloop.attempts",
    "learnloop.learner",
    "learnloop.scheduling",
    "learnloop.goals",
    "learnloop.diagnosis",
    "learnloop.curriculum",
    "learnloop.substrate",
    "learnloop.content",
    "learnloop.reader",
    "learnloop.tutor",
    "learnloop.ops",
    "learnloop.params",
    "learnloop.sim",
    "learnloop.projects",
    "learnloop.ai",
    "learnloop.cli",
    "learnloop_sidecar",
]
# Router R2b: the request builder constructs the Decider's typed questions
# (pure dataclasses in learnloop.ai.decisions) and bases the LLM's answer
# models on the wire base the structured transports require (pure pydantic,
# learnloop.ai.schemas.WireModel), and nothing else from learnloop.ai; no
# router module reaches a client, so replay still never can.
ignore_imports = [
    "learnloop.router.requests -> learnloop.ai.decisions",
    "learnloop.router.requests -> learnloop.ai.schemas",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "hints-never-write-evidence"
name = "Adaptive hints are help, never evidence: learnloop.hints imports no evidence writer (G-H13)"
type = "forbidden"
source_modules = ["learnloop.hints"]
# The modules that record attempts, reveals, mastery, FSRS, certification,
# placement, the learner field and replay. Hints reach evidence only through
# the attempt's hints_used / primed and reveal_events with their existing
# meaning (spec_adaptive_hints_v1 §5), which the submit path owns; a later
# phase that needs a read from one of these names it here with its reason.
forbidden_modules = [
    "learnloop.attempts",
    "learnloop.learner",
    "learnloop.scheduling",
    "learnloop.goals",
    "learnloop.diagnosis",
    "learnloop.curriculum",
    "learnloop.substrate",
    "learnloop.placement",
    "learnloop.field",
    "learnloop.router",
    "learnloop.daily_plan",
    "learnloop.cli",
    "learnloop_sidecar",
]
# Adaptive hints H1's pure reads (each writes nothing and records nothing):
# the deterministic answer comparison the map validator checks a goal with
# (the exact key, spec §4.3), and the PF-c valid-alternative read the map
# seeds take the learner's own correct solutions from (§4.3 item 3).
# Adaptive hints H2a's pure reads (H0 friction note 3): the hint state reads
# the LO's placement intent and the live predictor's P(success) for the item
# (spec §4.5's state; both read, neither records anything), and the
# discriminating questions are ranked by the existing instrument EIG, a pure
# function over the compiled candidates (§4.2; it moves no posterior and
# writes no probe observation).
ignore_imports = [
    "learnloop.hints.maps -> learnloop.attempts.answer_check",
    "learnloop.hints.map_seeds -> learnloop.placement.state",
    "learnloop.hints.state -> learnloop.placement.state",
    "learnloop.hints.state -> learnloop.placement.predictor",
    "learnloop.hints.discriminating -> learnloop.diagnosis.probe_families",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "adaptive-difficulty-never-writes-evidence"
name = "Adaptive difficulty is a predictor, never evidence: learnloop.adaptive_difficulty imports no evidence writer (spec A2, A12, §11.3)"
type = "forbidden"
source_modules = ["learnloop.adaptive_difficulty"]
# The modules that record attempts, grading evidence, mastery, facet recall,
# FSRS, certification and the canonical projection, and the adapters. AD1
# writes only its own receipts, forecast_receipts, judgment_ledger and
# practice_item_snapshots (db stores); it reads the learner field's pure
# replay rows and placement's live incumbent adapter, which write nothing.
forbidden_modules = [
    "learnloop.attempts",
    "learnloop.substrate",
    "learnloop.goals",
    "learnloop.curriculum",
    "learnloop.diagnosis",
    "learnloop.tutor",
    "learnloop.daily_plan",
    "learnloop.router",
    "learnloop.cli",
    "learnloop_sidecar",
]
# AD2+AD3's pure reads (each writes nothing and records nothing): the
# reading-signal firewall's carve-out (the only path from the reading receipt
# to AD's state, spec §5.11 and A12, with its allowlist, which AD1's sweep
# reads too), and the default trajectory's waypoints (the entry points e_k and
# the depth envelope of the ladders, spec §9.1; constants).
ignore_imports = [
    "learnloop.adaptive_difficulty.reading -> learnloop.attempts.salience_firewall",
    "learnloop.adaptive_difficulty.replay -> learnloop.attempts.salience_firewall",
    "learnloop.adaptive_difficulty.selection -> learnloop.curriculum.depth_rungs",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "graders-never-read-approach-maps"
name = "The grader and the diagnoser never see an approach map (hints spec H2, G-H4; H1's boundary)"
type = "forbidden"
# Every grading and diagnosis prompt builder lives in these packages. An
# approach map contains the solution and its routes: it reaches the learner
# only through hints (H2) and never a grading or diagnosis prompt.
source_modules = ["learnloop.attempts", "learnloop.diagnosis"]
forbidden_modules = ["learnloop.hints", "learnloop.db.stores.approach_maps"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "graders-never-read-confidence-events"
name = "The grader never reads the learner's confidence tap or hedge-read events (teacher TE0, blind-split S1)"
type = "forbidden"
# Teacher TE0 (spec_teacher_v1 §15.2): the confidence events go to the
# history-aware diagnoser, the hint writer, the tutor and the router card,
# never to a grader. Every grading prompt builder lives in learnloop.attempts.
source_modules = ["learnloop.attempts"]
forbidden_modules = ["learnloop.confidence_events"]
allow_indirect_imports = true

