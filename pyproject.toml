[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "learnloop"
version = "0.1.0"
description = "Local adaptive learning vault with deterministic scheduling and routed AI-assisted authoring."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "ruamel.yaml>=0.18",
  "textual>=8.2.7",
  "typer>=0.12",
  "trafilatura>=2,<3",
  "beautifulsoup4>=4.12",
  "lxml==5.3.0",
  "youtube-transcript-api>=0.6",
  "openai>=1.0",
  "numpy>=2.1",
  "pypdf>=6.14.2",
  "sympy>=1.14",
  "tomlkit>=0.12",
  "manim>=0.19.1",
  "pyyaml>=6.0",
  "Pillow>=10.4",
]

[project.optional-dependencies]
mobile = [
  "starlette==1.7.0",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "qrcode==8.2",
]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.6",
]
# High-fidelity PDF extraction (headings, tables, LaTeX math, OCR) for
# canonical source ingestion; heavy (pulls in torch). Without it, PDF
# ingestion falls back to plain pypdf text extraction.
pdf = [
  "marker-pdf>=1.10",
]

[project.scripts]
learnloop = "learnloop.cli:app"
learnloop-mobile = "learnloop_mobile.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/learnloop", "src/learnloop_sidecar", "src/learnloop_mobile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers"]
markers = [
  "durability: use production SQLite durability and fresh vault construction for the test and every fixture it first builds",
]

[dependency-groups]
dev = [
    "import-linter>=2.13",
]

[tool.importlinter]
root_packages = ["learnloop", "learnloop_sidecar", "learnloop_mobile"]
include_external_packages = false

[[tool.importlinter.contracts]]
id = "infrastructure-does-not-import-domains"
name = "Persistence and AI stay below domain policy"
type = "forbidden"
source_modules = [
