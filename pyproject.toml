[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "learnloop"
version = "0.1.0"
description = "Local adaptive learning vault with deterministic scheduling and routed AI-assisted authoring."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "ruamel.yaml>=0.18",
  "textual>=8.2.7",
  "typer>=0.12",
  "trafilatura>=2,<3",
  "beautifulsoup4>=4.12",
  "lxml==5.3.0",
  "youtube-transcript-api>=0.6",
  "openai>=1.0",
  "pypdf>=6.14.2",
  "sympy>=1.14",
  "tomlkit>=0.12",
  "manim>=0.19.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
# High-fidelity PDF extraction (headings, tables, LaTeX math, OCR) for
# canonical source ingestion; heavy (pulls in torch). Without it, PDF
# ingestion falls back to plain pypdf text extraction.
pdf = [
  "marker-pdf>=1.10",
]
# AI-generated Manim explainer animations (concept inspector). The renderer is
# runtime-detected; without this extra the feature reports "manim missing".
animation = [
  "manim>=0.18",
]

[project.scripts]
learnloop = "learnloop.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/learnloop", "src/learnloop_sidecar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "import-linter>=2.13",
]

[tool.importlinter]
root_packages = ["learnloop", "learnloop_sidecar"]
include_external_packages = false

[[tool.importlinter.contracts]]
id = "infrastructure-does-not-import-domains"
name = "Persistence and AI stay below domain policy"
type = "forbidden"
source_modules = [
    "learnloop.config",
    "learnloop.vault",
    "learnloop.db",
    "learnloop.ingest",
    "learnloop.ai",
]
forbidden_modules = [
    "learnloop.attempts",
    "learnloop.learner",
    "learnloop.scheduling",
    "learnloop.goals",
    "learnloop.diagnosis",
    "learnloop.curriculum",
    "learnloop.substrate",
    "learnloop.content",
    "learnloop.reader",
    "learnloop.tutor",
    "learnloop.ops",
    "learnloop.params",
    "learnloop.sim",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "primitives-have-no-internal-dependencies"
name = "Primitive modules stay dependency free"
type = "forbidden"
source_modules = [
    "learnloop.clock",
    "learnloop.ids",
    "learnloop.numeric",
    "learnloop.attempt_types",
]
forbidden_modules = [
    "learnloop.config",
    "learnloop.vault",
    "learnloop.db",
    "learnloop.ingest",
    "learnloop.ai",
    "learnloop.attempts",
    "learnloop.learner",
    "learnloop.scheduling",
