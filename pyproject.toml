[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "learnloop"
version = "0.1.0"
description = "Local adaptive learning vault with deterministic scheduling and routed AI-assisted authoring."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "ruamel.yaml>=0.18",
  "textual>=8.2.7",
  "typer>=0.12",
  "trafilatura>=2,<3",
  "beautifulsoup4>=4.12",
  "lxml==5.3.0",
  "youtube-transcript-api>=0.6",
  "openai>=1.0",
  "numpy>=2.1",
  "pypdf>=6.14.2",
  "sympy>=1.14",
  "tomlkit>=0.12",
  "manim>=0.19.1",
  "pyyaml>=6.0",
  "Pillow>=10.4",
  "lark>=1.3.1",
]

[project.optional-dependencies]
mobile = [
  "starlette==1.7.0",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "qrcode==8.2",
]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.6",
  # The MCP adapter's tests run in every gate (no silent skips, unlike the
  # mobile extra): dev carries the same pinned SDK as the mcp extra.
  "mcp==2.3.0",
]
# High-fidelity PDF extraction (headings, tables, LaTeX math, OCR) for
# canonical source ingestion; heavy (pulls in torch). Without it, PDF
# ingestion falls back to plain pypdf text extraction.
pdf = [
  "marker-pdf>=1.10",
]
# What LearnLoop needs to drive a self-hosted GLM-OCR service: pypdfium2
# renders PDF pages into the images `python -m glmocr.server` reads. Hosted
# GLM-OCR (z.ai) needs no install, only a key. The glmocr SDK itself runs in
# its own environment (docs/reviews/glm-ocr-ingest.md): glmocr requires
# Pillow>=12 and transformers>=5 while marker-pdf pins Pillow<11, and the
# model is served by vLLM, SGLang or Ollama in any case.
glm-ocr = ["pypdfium2>=4"]
# The chat frontend over MCP (spec_mcp_frontend_c1): the official MCP Python
# SDK at the version the M0 probe verified with ChatGPT and Claude. Only
# learnloop_mcp imports it; `learnloop mcp serve` asks for it when missing.
mcp = [
  "mcp==2.3.0",
]

[project.scripts]
learnloop = "learnloop.cli:app"
learnloop-mobile = "learnloop_mobile.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/learnloop", "src/learnloop_sidecar", "src/learnloop_mobile", "src/learnloop_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers"]
markers = [
  "durability: use production SQLite durability and fresh vault construction for the test and every fixture it first builds",
  "owner_vaults: reads backup-API copies of the owner's vaults that S0 removed from fixtures/; skipped unless LEARNLOOP_OWNER_VAULTS names their directory (tests/owner_vaults.py)",
]

[dependency-groups]
dev = [
    "import-linter>=2.13",
]

[tool.importlinter]
root_packages = ["learnloop", "learnloop_sidecar", "learnloop_mobile", "learnloop_mcp"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "codex-sdk-only-in-its-provider"
name = "Only the Codex provider imports the Codex SDK and its bundled CLI (security stage codex-tool-lockdown)"
type = "forbidden"
# Every Codex turn must run the locked-down profile, which only
# learnloop.ai.providers.codex puts in force (approvals deny_all, the decline
# handler, the verified launch overrides). A second importer of the SDK could
# start a thread or an app server without them.
source_modules = ["learnloop", "learnloop_sidecar", "learnloop_mobile", "learnloop_mcp"]
forbidden_modules = ["openai_codex", "codex_cli_bin"]
ignore_imports = [
    "learnloop.ai.providers.codex -> openai_codex",
    "learnloop.ai.providers.codex -> codex_cli_bin",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "ad-slot-facts-schema-is-neutral"
name = "AD's slot facts schema imports nothing of LearnLoop (the final round: inversion)"
type = "forbidden"
# The wire between the plan and adaptive difficulty: dataclasses and the codec only.
source_modules = ["learnloop.daily_plan.slot_facts_schema"]
forbidden_modules = ["learnloop.adaptive_difficulty", "learnloop.daily_plan.engine", "learnloop.daily_plan.ad_slot",
                     "learnloop.daily_plan.slot_facts", "learnloop.scheduling", "learnloop.db"]

[[tool.importlinter.contracts]]
id = "ad-slot-facts-are-the-incumbents"
name = "The plan's slot facts never import adaptive difficulty (the final round: inversion)"
type = "forbidden"
# Phase 2 is the incumbent's own code: it runs with no AD operation open and no AD frame on the stack.
source_modules = ["learnloop.daily_plan.slot_facts"]
forbidden_modules = ["learnloop.adaptive_difficulty", "learnloop.daily_plan.ad_slot"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "ad-slot-never-imports-the-plan"
name = "AD's slot phases never import the plan's internals (the final round: inversion)"
type = "forbidden"
# AD receives the plan's facts as a JSON record, never the plan's objects or code.
source_modules = ["learnloop.daily_plan.ad_slot"]
forbidden_modules = ["learnloop.daily_plan.engine", "learnloop.daily_plan.slot_facts",
                     "learnloop.daily_plan.staged_frame", "learnloop.scheduling.scheduler",
                     "learnloop.scheduling.serving_exclusions", "learnloop.scheduling.intent"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "infrastructure-does-not-import-domains"
name = "Persistence and AI stay below domain policy"
type = "forbidden"
source_modules = [
