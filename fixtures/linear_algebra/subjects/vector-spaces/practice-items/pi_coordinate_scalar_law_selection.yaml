teach_back_source:
prompt: You plan a coordinate proof of (a+b)x=ax+bx in Fⁿ. Write the single 
  scalar equality that should be the proof's decisive move, name the scalar law 
  it uses, and briefly explain why that law—not merely commutativity or 
  associativity—matches the vector identity.
expected_answer: The decisive coordinate equality is (a+b)xₖ=axₖ+bxₖ. It uses 
  distributivity of scalar multiplication over scalar addition in F. The vector 
  identity asks to expand a sum multiplied by xₖ, which is precisely the 
  structural pattern of distributivity.
