teach_back_source:
prompt: 'You need to prove (−a)x=−(ax) for every a∈F and x∈Fⁿ. Give a compact proof
  route: identify what coordinate to compare, write the decisive scalar equality,
  and state the final fact that turns the coordinate calculation into a vector equality.
  Do not appeal to a picture or test a numerical vector.'
expected_answer: Let k be arbitrary. By coordinatewise scalar multiplication, 
  ((−a)x)ₖ=(−a)xₖ. The scalar identity (−a)xₖ=−(axₖ) gives 
  ((−a)x)ₖ=−(axₖ)=(−(ax))ₖ. This holds for every k=1,…,n, so the two vectors 
  have equal corresponding coordinates and therefore (−a)x=−(ax).
