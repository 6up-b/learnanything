teach_back_source:
prompt: 'Let M₂(R) denote the set of 2×2 real matrices. A text says that ordinary
  matrix addition is the addition on this set. Explain this statement as a function:
  identify what one input to the function consists of, where its output must lie,
  and why ordinary matrix addition has the required type.'
expected_answer: One input is an ordered pair (A,B) of matrices from M₂(R). The 
  addition function has type M₂(R)×M₂(R)→M₂(R), sending (A,B) to A+B. Entrywise 
  addition of two 2×2 real matrices produces another 2×2 real matrix, so the 
  output lies in the stated set.
