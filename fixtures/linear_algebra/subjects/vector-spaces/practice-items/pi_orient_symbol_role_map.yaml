teach_back_source:
prompt: In a proof, the line “take u,v∈V and a∈F; then compare u+v with au” 
  appears. Explain the role of every object in this line. In particular, say 
  which operation forms each expression, what inputs it consumes, and where each
  result lives.
expected_answer: The objects u and v are vectors, meaning elements of V, while a
  is a scalar in F. The expression u+v uses vector addition V×V→V and therefore 
  lies in V. The expression au uses scalar multiplication F×V→V and also lies in
  V. The line relies on the vector-space structure consisting of the set V 
  together with these two operations over F.
