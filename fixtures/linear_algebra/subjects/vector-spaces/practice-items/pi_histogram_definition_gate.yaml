teach_back_source:
prompt: 'Let H be the set of all length-n probability histograms: entries are nonnegative
  and sum to 1. A modeler proposes ordinary coordinatewise addition as the addition
  on H and ordinary real scaling as scalar multiplication. Before checking commutativity
  or associativity, what definition-level test should you run first? Give a general
  witness that settles it.'
expected_answer: First test whether the proposed addition really has type H×H→H.
  If p,q∈H, then the coordinates of p+q sum to 2 rather than 1, so p+q∉H. Thus 
  ordinary addition is not an addition on H in the required sense, and the 
  proposal already fails.
