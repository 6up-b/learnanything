teach_back_source:
prompt: 'Let H be the set of length-three probability vectors: triples of nonnegative
  real numbers whose entries sum to 1. A modeler proposes p⊕q=(p+q)/2 and says scalar
  multiplication will be specified later. Choose a definition-driven audit sequence
  for this proposal. State what should be checked first about ⊕, then identify one
  decisive addition axiom to test next and explain why failure there settles the vector-space
  claim.'
expected_answer: 'First check that ⊕ is a total map H×H→H. It is: averaging two probability
  vectors preserves nonnegative entries and total sum 1. Next test for an additive
  identity. If e∈H satisfied p⊕e=p for every p∈H, then (p+e)/2=p, so e=p for every
  p, which is impossible because H has more than one element. Thus ⊕ cannot be vector
  addition for a vector-space structure on H. Specifying scalar multiplication later
  cannot repair this failed addition axiom.'
