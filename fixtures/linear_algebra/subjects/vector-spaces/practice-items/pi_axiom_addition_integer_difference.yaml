variant_contract:
teach_back_source:
prompt: 'On V=Z, define m⊕n=m−n. Interpret this rule as proposed addition: state its
  domain and codomain, decide whether it really assigns an element of V to every ordered
  pair from V, and explain whether that fact alone makes it valid vector-space addition.'
expected_answer: 'The rule has type Z×Z→Z because m−n is an integer whenever m,n are
  integers, so it satisfies the required closure/input-output condition for an addition
  on Z. That fact alone does not make it vector-space addition: the remaining axioms
  must also hold, and this rule is not commutative in general.'
