teach_back_source:
prompt: On the set V of real-valued functions, keep ordinary pointwise addition 
  but define (a⊙f)(t)=a f(t)+(1−a)f(t). Without checking every axiom, identify a
  single vector-space requirement that gives a quick decisive test, and provide 
  the function and scalar you would use.
expected_answer: The formula simplifies to (a⊙f)(t)=f(t), so scalar 
  multiplication ignores a. Test the required identity 0⊙f=0_V using any nonzero
  function, for example f(t)=1. Then 0⊙f=f, which is not the zero function. This
  one witness disproves that the proposed operations make V a vector space.
