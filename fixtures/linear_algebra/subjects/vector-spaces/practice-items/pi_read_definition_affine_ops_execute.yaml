teach_back_source:
prompt: Let V=P₁(R). Two operations are specified by p⊕q=p+q+1 and a⊙p=ap+(a−1),
  where p,q∈V and a∈R. For p(t)=t, q(t)=1−t, and a=−2, compute p⊕q and a⊙p. Then
  label which rule is the proposed vector addition and which is the proposed 
  scalar multiplication, including the input type of each rule.
expected_answer: p⊕q=t+(1−t)+1=2, which is in P₁(R). Also, 
  (−2)⊙p=−2t+(−2−1)=−2t−3, which is in P₁(R). The rule ⊕ is the proposed 
  addition V×V→V because it takes two polynomials from V. The rule ⊙ is the 
  proposed scalar multiplication R×V→V because it takes a real scalar and a 
  polynomial from V.
