teach_back_source:
prompt: On the positive real numbers, define x⊕y=xy and a⊙x=xᵃ for a∈R. Without 
  carrying out a full axiom proof, state a concise strategy for deciding whether
  these rules make the set a real vector space. Explain why merely observing 
  that both formulas produce positive real outputs is insufficient.
expected_answer: 'First recognize that the rules have the required types V×V→V and
  R×V→V, but closure alone does not establish a vector space. One should check the
  vector-space axioms for these rules. An efficient strategy is to use the change
  of variables L(x)=ln x: it turns x⊕y into L(x)+L(y) and a⊙x into aL(x), reducing
  the checks to the familiar real vector-space laws.'
