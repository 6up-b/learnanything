teach_back_source:
prompt: Let V be the real sequences that are eventually zero, and define 
  (x⊕y)ₖ=xₖ+yₖ. Give the shortest audit that establishes both that this rule is 
  genuinely an addition on V and that its order and grouping behavior meet the 
  vector-addition checklist. State the witness or equation used for each part.
expected_answer: First verify the mapping V×V→V. If xₖ=0 for k>N and yₖ=0 for 
  k>M, then (x⊕y)ₖ=0 for k>max(N,M), so x⊕y is eventually zero. For order, 
  (x⊕y)ₖ=xₖ+yₖ=yₖ+xₖ=(y⊕x)ₖ for every k. For grouping, 
  ((x⊕y)⊕z)ₖ=(xₖ+yₖ)+zₖ=xₖ+(yₖ+zₖ)=(x⊕(y⊕z))ₖ for every k. Thus the operation is
  closed, commutative, and associative.
