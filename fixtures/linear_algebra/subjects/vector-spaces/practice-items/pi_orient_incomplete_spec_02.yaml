variant_contract:
teach_back_source:
prompt: Someone writes, “Take the set S of all real-valued functions and the 
  scalar field R; therefore S is now a vector space.” Explain why this 
  description is incomplete and what must be added before the claim can be 
  assessed.
expected_answer: Naming S and R is not enough. One must specify an addition 
  S×S→S and scalar multiplication R×S→S, then verify that these operations 
  satisfy the vector-space axioms. Pointwise operations are a possible choice, 
  but they were not stated.
