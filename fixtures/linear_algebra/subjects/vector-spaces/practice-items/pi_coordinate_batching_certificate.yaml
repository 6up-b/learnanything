teach_back_source:
prompt: 'A batching routine over F^n, with F=R or C, replaces (a+b)(x+y) by ax+ay+bx+by.
  Give a compact certificate for this rewrite: state the proof method, write the decisive
  equality for an arbitrary coordinate k, and name the scalar law that makes the equality
  work.'
expected_answer: Use a coordinate proof. For arbitrary k, 
  [(a+b)(x+y)]_k=(a+b)(x_k+y_k)=ax_k+ay_k+bx_k+by_k=[ax+ay+bx+by]_k. The 
  expansion uses distributivity of scalar multiplication over scalar addition 
  (applied as the distributive laws in R or C), with associativity/commutativity
  used only to regroup the four scalar terms. Since the kth coordinates agree 
  for every k, the vectors are equal.
