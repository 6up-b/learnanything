teach_back_source:
prompt: "Let V=R and let the scalar field be R. Two vector-space structures are proposed
  on this same set.\n\nPackage A: x⊕y=x+y and a⊙x=ax.\nPackage B: x⊞y=x+y+1 and a⊛x=ax+a−1.\n\
  \nShow your work in this order:\n1. Compute 1⊕2 and 1⊞2.\n2. Compute 3⊙2 and 3⊛2.\n\
  3. Use your results to explain why Packages A and B specify different structures
  on the same underlying set."
expected_answer: "1. Under Package A, 1⊕2=1+2=3. Under Package B, 1⊞2=1+2+1=4.\n2.
  Under Package A, 3⊙2=3·2=6. Under Package B, 3⊛2=3·2+3−1=8.\n3. Both packages use
  the same set V=R and field R, but their addition rules give different sums and their
  scalar-multiplication rules give different scalar multiples for the displayed inputs.
  Since the operations are part of a vector-space structure, the two operation packages
  specify different structures."
