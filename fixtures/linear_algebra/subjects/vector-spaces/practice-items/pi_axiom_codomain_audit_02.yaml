teach_back_source:
prompt: On V=Z, someone proposes u◇v=(u+v)/2 as vector addition. Explain the 
  input-output promise made by the phrase “addition on V,” then use a concrete 
  input pair to decide whether ◇ keeps that promise.
expected_answer: 'The phrase requires a function V×V→V: every pair of integers must
  be assigned an integer. For example, 0◇1=1/2, which is not in Z. Hence ◇ is not
  an addition on Z because its outputs are not always in V.'
