teach_back_source:
prompt: Let V=R with u⊕v=u−v and a⊙u=au. You want the shortest decisive audit of
  whether this specified structure is a real vector space. Name the 
  vector-addition law you would test first, give a concrete calculation using 
  three elements that settles it, and state the resulting verdict.
expected_answer: Test associativity of vector addition. For example, 
  (0⊕0)⊕1=0⊕1=−1, whereas 0⊕(0⊕1)=0⊕(−1)=1. These are unequal, so ⊕ is not 
  associative. Therefore the specified operations do not make R a vector space 
  over R.
