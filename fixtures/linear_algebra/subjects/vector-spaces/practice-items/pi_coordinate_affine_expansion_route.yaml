teach_back_source:
prompt: 'You must prove (a+b)(x+y)=ax+ay+bx+by for arbitrary a,b∈F and x,y∈F^n, where
  F is R or C. Give a compact proof plan: state the arbitrary coordinate comparison
  you would make, name the scalar laws that perform the decisive rewrite, and state
  the final fact that converts the coordinate calculation into vector equality. Do
  not carry out unrelated vector-space axiom checks.'
expected_answer: 'Fix an arbitrary k. Compare the kth coordinates: the left side has
  coordinate (a+b)(x_k+y_k), while the right side has coordinate ax_k+ay_k+bx_k+by_k.
  Apply scalar distributivity over addition twice, then use associativity and commutativity
  of scalar addition to regroup the four terms into the displayed right-hand coordinate.
  Because the kth coordinates agree for every k=1,…,n, equality of ordered coordinate
  lists gives (a+b)(x+y)=ax+ay+bx+by in F^n.'
