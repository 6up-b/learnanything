prompt: You must prove that swapping two signals x,y∈Cⁿ does not change their 
  coordinatewise sum. Name the single scalar law that should drive the proof, 
  and write the generic kth-coordinate equation showing why that law is the 
  right choice.
expected_answer: Use commutativity of addition in C. For an arbitrary k, 
  (x+y)_k=x_k+y_k=y_k+x_k=(y+x)_k.
