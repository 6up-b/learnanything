variant_contract:
teach_back_source:
prompt: A set U has rules U×U→U and F×U→U. Explain what these rules represent 
  and why their stated input-output types alone do not yet prove that U is a 
  vector space over F.
expected_answer: The rules are candidate vector addition and scalar 
  multiplication, and their types state closure in U. U is a vector space only 
  if these operations also satisfy every vector-space axiom, including the 
  addition, identity, inverse, distributive, and scalar compatibility laws.
