teach_back_source:
prompt: 'A paper begins: “Regard P₃ as a vector space over R with ordinary polynomial
  addition and scalar multiplication.” Unpack this sentence into its mathematical
  data. Identify the underlying set, scalar field, the two kinds of inputs each operation
  receives, and the kind of output each must return.'
expected_answer: The underlying set P₃ consists of real polynomials of degree at
  most 3, and the scalar field is R. Addition receives two polynomials from P₃ 
  and returns a polynomial in P₃. Scalar multiplication receives a real scalar 
  and a polynomial from P₃ and returns a polynomial in P₃. The declaration 
  therefore specifies a set together with addition and scalar multiplication.
