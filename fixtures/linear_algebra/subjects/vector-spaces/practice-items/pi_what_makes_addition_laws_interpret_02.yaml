teach_back_source:
prompt: Write the commutative and associative laws required of vector addition 
  on V, then explain in words the different feature of a sum that each law 
  allows you to change.
expected_answer: For all u,v,w∈V, u+v=v+u and (u+v)+w=u+(v+w). Commutativity 
  changes the order of addends; associativity changes their grouping without 
  changing their order.
