teach_back_source:
prompt: 'Prepare a dependency-labeled proof of (x+y)+z=x+(y+z) for arbitrary x,y,z∈Fⁿ.
  Your answer must contain three labeled lines: “coordinate rule used,” “scalar law
  selected,” and “vector conclusion.” Each later line should explicitly use the result
  of the preceding line.'
expected_answer: 'Coordinate rule used: for arbitrary k, ((x+y)+z)ₖ=(xₖ+yₖ)+zₖ and
  (x+(y+z))ₖ=xₖ+(yₖ+zₖ), by coordinatewise addition. Scalar law selected: associativity
  of addition in R or C gives (xₖ+yₖ)+zₖ=xₖ+(yₖ+zₖ). Vector conclusion: the corresponding
  coordinates are equal for every k, so (x+y)+z=x+(y+z) in Fⁿ.'
