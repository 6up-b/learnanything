teach_back_source:
prompt: Let x=(x₁,…,xₙ) and y=(y₁,…,yₙ) be arbitrary elements of Fⁿ, where F is 
  R or C. Write a structured coordinate proof that x+y=y+x. Your proof must 
  begin with an arbitrary coordinate and end with equality of the vectors.
expected_answer: Fix an arbitrary k∈{1,…,n}. By coordinatewise addition, 
  (x+y)_k=x_k+y_k. Commutativity of scalar addition in F gives x_k+y_k=y_k+x_k. 
  Again by coordinatewise addition, y_k+x_k=(y+x)_k. Thus (x+y)_k=(y+x)_k for 
  every k, so x+y=y+x because vectors in Fⁿ are equal when all corresponding 
  coordinates are equal.
