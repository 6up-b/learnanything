variant_contract:
teach_back_source:
prompt: The polynomial space P₂(R) has been declared a vector space over R, and 
  p(t)=1−3t belongs to P₂(R). Explain why p may be called a vector, identify 
  what its scalars are, and clarify why this terminology does not require p to 
  be drawn as an arrow.
expected_answer: A vector is any element of a vector space, so p is a vector 
  because p∈P₂(R). The scalars are the real numbers because the scalar field is 
  R. Calling p a vector refers to its membership and the vector-space structure;
  it does not require the element to be a geometric arrow.
