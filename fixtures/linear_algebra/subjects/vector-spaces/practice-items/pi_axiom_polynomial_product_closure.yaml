teach_back_source:
prompt: Let P₂ be the real polynomials of degree at most 2. A proposed operation
  is p⊕q=pq. Interpret what would have to be true for this to be an addition on 
  P₂, then settle the question with a specific input pair and its output.
expected_answer: For ⊕ to be an addition on P₂, it must define a map P₂×P₂→P₂. 
  Take p(t)=q(t)=t². Both inputs lie in P₂, but p⊕q=t⁴ does not. Thus the 
  proposed rule is not closed in P₂ and is not even an addition on this set.
