variant_contract:
teach_back_source:
prompt: A proof of (a+b)x=ax+bx in Fⁿ has already been reduced to comparing one 
  arbitrary coordinate k. State the single scalar equality that is the proof's 
  bottleneck, name the law it uses over F=R or C, and explain why proving that 
  equality for every k finishes the vector identity.
expected_answer: The decisive scalar equality is (a+b)xₖ=axₖ+bxₖ. It is 
  distributivity of scalar multiplication over scalar addition in R or C. Once 
  this equality holds for every k, the two vectors have equal corresponding 
  coordinates, so (a+b)x=ax+bx in Fⁿ.
