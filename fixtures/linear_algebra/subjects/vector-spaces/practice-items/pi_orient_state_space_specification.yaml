teach_back_source:
prompt: A lab report says, “Let S be the collection of all temperature profiles 
  on a metal rod, and use real scalars.” Explain precisely what additional 
  mathematical data must be specified before S can even be proposed as a real 
  vector space. Include the input-output type of each required rule; do not 
  check the axioms.
expected_answer: The report must specify an addition rule S×S→S assigning a 
  temperature profile to each ordered pair of profiles, and a 
  scalar-multiplication rule R×S→S assigning a profile to each real number and 
  profile. Together with the underlying set S and scalar field R, these are the 
  data whose axioms could then be checked.
