prompt: 'A student records the operations for a vector space V over F as “addition:
  F×V→V” and “scalar multiplication: V×V→V.” Diagnose the structural mix-up and rewrite
  both signatures correctly, explaining the role of F in each.'
expected_answer: The student has exchanged the input types. Vector addition 
  takes two vectors, so it is V×V→V. Scalar multiplication takes a scalar and a 
  vector, so it is F×V→V. The field F supplies the scalar input only for scalar 
  multiplication.
