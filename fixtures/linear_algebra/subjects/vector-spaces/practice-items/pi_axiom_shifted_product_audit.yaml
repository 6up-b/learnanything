teach_back_source:
prompt: On V=R, proposed vector addition is u⊙v=u+v+uv. Give a compact audit 
  plan that first addresses whether ⊙ is genuinely an addition V×V→V and then 
  names an efficient way to test both the order and grouping laws. State what 
  each proposed check would establish; you need not write every algebraic line.
expected_answer: 'First observe that every ordered pair of real numbers produces the
  real number u+v+uv, so ⊙ is a total map R×R→R. Commutativity can be checked from
  the symmetry u+v+uv=v+u+vu. For associativity, compare the two expansions: (u⊙v)⊙w
  and u⊙(v⊙w) both simplify to u+v+w+uv+uw+vw+uvw. These checks establish closure/totality,
  commutativity, and associativity for the proposed addition, though they do not by
  themselves prove every vector-space axiom.'
