teach_back_source:
prompt: An audio engineer defines S to be the collection of all continuous 
  real-valued volume envelopes on the time interval [0,10] and writes, “Use real
  scalars, so S is a vector space.” Interpret this declaration as a proposed 
  mathematical structure. Explain precisely what data are still missing, give 
  the input-output form of each missing rule, and say what would remain to be 
  verified after those rules were supplied.
expected_answer: The collection S and the scalar field R have been named, but 
  that alone does not specify a vector space. One must define an addition map 
  S×S→S that combines two envelopes and a scalar-multiplication map R×S→S. After
  the two rules are supplied, one must verify that they are well defined on S 
  and satisfy all vector-space axioms. Pointwise formulas would be a natural 
  proposal, but they are not part of the original declaration unless explicitly 
  stated.
