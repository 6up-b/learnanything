variant_contract:
teach_back_source:
prompt: A researcher writes, “A color signal is a triple (r,g,b) of real-valued 
  functions on time. Let V be all such triples, and use R as the scalars.” 
  Explain what additional mathematical data must be fixed before this sentence 
  specifies a candidate vector-space structure. Give the input-output form of 
  each missing rule, describe what its inputs mean in this setting, and 
  distinguish specifying the candidate structure from proving that it is a 
  vector space.
expected_answer: One must specify an addition V×V→V that combines two 
  color-signal triples and a scalar multiplication R×V→V that combines a real 
  scalar with one signal triple. For example, the rules could be pointwise 
  componentwise addition and pointwise scaling, but those rules must be stated 
  rather than inferred from the set alone. Once V, R, and both operations are 
  fixed, a candidate structure has been specified; it becomes a vector space 
  only after the vector-space axioms are verified.
