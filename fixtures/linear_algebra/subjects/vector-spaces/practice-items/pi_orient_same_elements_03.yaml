teach_back_source:
prompt: Two mathematical objects have exactly the same underlying elements and 
  use the same scalar field, but the symbol “+” is assigned a different rule in 
  each object. Explain why the underlying set alone does not tell you whether 
  these are the same vector-space structure or whether either one satisfies the 
  vector-space axioms.
expected_answer: A vector space is not just its underlying set; its specified 
  vector addition and scalar multiplication are part of the structure. Changing 
  the addition rule can produce a different structure even when the elements and
  field are unchanged. Each specified pair of operations must separately be 
  checked against the vector-space axioms.
