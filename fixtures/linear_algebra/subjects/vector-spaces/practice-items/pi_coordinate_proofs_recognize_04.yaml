prompt: In a coordinate proof in F^n, you have shown that the kth coordinates of
  vectors p and q are equal for every k. Which conclusion completes the proof? 
  A. p and q have the same first coordinate only. B. p=q because all 
  corresponding coordinates agree. C. The sums of the coordinates of p and q 
  agree. Reply with the letter.
expected_answer: B
