teach_back_source:
prompt: Two authors use the same underlying set V and the same field F, but 
  define different rules for adding elements and multiplying them by scalars. 
  Explain why they are discussing different candidate vector-space structures 
  even though the elements of V are unchanged.
expected_answer: A vector-space structure consists of the set together with its 
  addition and scalar multiplication. Changing either operation changes the 
  structure because sums, scalar multiples, and whether the axioms hold can 
  change. The shared underlying set alone does not make the two candidates the 
  same vector space structure.
