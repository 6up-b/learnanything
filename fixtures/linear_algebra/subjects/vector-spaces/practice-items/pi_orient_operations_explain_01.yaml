teach_back_source:
prompt: A text says, “Let W be a vector space over F,” and then uses f+g and af.
  Explain what mathematical data this phrase commits us to having, including 
  what kind of inputs and outputs the two operations use.
expected_answer: It commits us to a set W, a scalar field F, an addition W×W→W, 
  and a scalar multiplication F×W→W. Thus f+g is again in W for f,g∈W, and af is
  in W for a∈F and f∈W; the operations must also satisfy the vector-space 
  axioms.
