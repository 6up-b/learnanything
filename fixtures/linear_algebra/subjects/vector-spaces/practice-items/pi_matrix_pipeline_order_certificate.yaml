variant_contract:
teach_back_source:
prompt: A graphics pipeline uses V=M_2(R), declares A⊕B=AB as its proposed 
  vector addition, and keeps ordinary real scalar multiplication. You need a 
  one-test certificate deciding whether this is a real vector space. State the 
  best axiom to test and exhibit matrices that make the decision immediate.
expected_answer: Test commutativity of the proposed addition. Take 
  A=[[1,1],[0,1]] and B=[[1,0],[1,1]]. Then AB=[[2,1],[1,1]], whereas 
  BA=[[1,1],[1,2]]. Hence A⊕B≠B⊕A, so the proposed addition is not commutative 
  and the specified structure is not a real vector space.
