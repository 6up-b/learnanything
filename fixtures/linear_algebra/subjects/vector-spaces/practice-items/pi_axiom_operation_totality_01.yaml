variant_contract:
teach_back_source:
prompt: Let V=R². A proposed “addition” is defined by (a,b)⋆(c,d)=(a+c,b/d), but
  only when d≠0. Interpret what an addition on V is required to do, and explain 
  precisely whether ⋆ supplies that data on all of V.
expected_answer: An addition on V must be a function V×V→V, so it must assign 
  one element of V to every ordered pair of elements of V. The rule ⋆ is 
  undefined whenever the second input has d=0. Therefore it is not a function 
  V×V→V and does not define an addition on all of V.
