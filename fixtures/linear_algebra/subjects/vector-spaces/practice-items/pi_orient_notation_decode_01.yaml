teach_back_source:
prompt: A proof begins, “Let W be a vector space over F,” and later writes f+g 
  and af for f,g∈W and a∈F. Explain what two pieces of mathematical data make 
  these expressions meaningful and state the input-output pattern of each.
expected_answer: The structure includes vector addition, a rule W×W→W that 
  assigns f+g, and scalar multiplication, a rule F×W→W that assigns af. The set 
  W and field F alone do not determine these operations.
