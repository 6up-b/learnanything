teach_back_source:
prompt: Find $x \in R^4$ such that $(4, -3, 1,7) + 2x = (5,9,-6,8).$
expected_answer: "Subtract $(4,-3,1,7)$ from both sides:\n\n$$2x=(5,9,-6,8)-(4,-3,1,7)=(1,12,-7,1).$$\n\
  \nNow multiply each coordinate by $\\frac12$:\n\n$$x=\\frac12(1,12,-7,1)=\\left(\\\
  frac12,6,-\\frac72,\\frac12\\right).$$\n\nIndeed,\n\n$$(4,-3,1,7)+2\\left(\\frac12,6,-\\\
  frac72,\\frac12\\right)=(4,-3,1,7)+(1,12,-7,1)=(5,9,-6,8).$$"
difficulty: 0.25
difficulty_source: llm_estimate
tags: []
hints:
  - Isolate the term containing $x$ by moving the known vector to the other 
    side.
  - Subtract the vectors coordinate by coordinate before dividing by the scalar 
    coefficient.
  - Once you have $2x$, multiply every coordinate by $\frac12$, then substitute 
    your vector into the original equation to check it.
