teach_back_source:
prompt: Suppose C[0,1], the set of continuous real-valued functions on [0,1], 
  has been declared a vector space with the usual operations. A classmate says 
  f(t)=t² cannot be a vector because it is a function rather than an arrow. 
  Interpret the word “vector” in this declaration and explain precisely what 
  object is the vector and what objects are merely its values.
expected_answer: In an abstract vector space, every element of the underlying 
  set is called a vector. The function f itself is an element of C[0,1], so f is
  a vector. For each t, the number f(t)=t² is a scalar value produced by that 
  vector-function, not the vector itself.
