teach_back_source:
prompt: Let X={1,2,3} and let V be the set of all bijections X→X. Someone 
  proposes f⊕g=f∘g as vector addition and promises to choose scalar 
  multiplication later. Select the most efficient order-or-grouping axiom to 
  test if your goal is to reject this proposal quickly. Give explicit bijections
  witnessing your conclusion and explain why the result settles the vector-space
  question.
expected_answer: Test commutativity rather than associativity, because function 
  composition is associative but need not commute. Let f swap 1 and 2 and fix 3,
  and let g swap 2 and 3 and fix 1. Then, using right-to-left composition, 
  (f∘g)(1)=2 whereas (g∘f)(1)=3, so f⊕g≠g⊕f. Vector addition must be 
  commutative, so this proposed addition cannot be part of a vector-space 
  structure, regardless of how scalar multiplication is later defined.
