variant_contract:
teach_back_source:
prompt: Let V be the positive real numbers, with x⊕y=xy and a⊙x=xᵃ for a∈R. You 
  want to establish the commutative and associative laws for ⊕ without expanding
  separate chains for every axiom. Name a transformation that makes the 
  structure familiar, and write the two identities showing why it is the useful 
  proof method.
expected_answer: Use the transformation L(x)=log x from the positive reals to R.
  It satisfies L(x⊕y)=log(xy)=log x+log y=L(x)+L(y) and L(a⊙x)=log(xᵃ)=a log 
  x=aL(x). Thus L transports the proposed operations to ordinary addition and 
  scalar multiplication on R; in particular, commutativity and associativity of 
  ⊕ follow from those laws for real addition.
