teach_back_source:
prompt: Let S¹={z∈C:|z|=1}. Someone proposes a real vector-space structure by 
  declaring z⊕w=zw and a⊙z=zᵃ for a∈R. Give the shortest decisive audit of this 
  proposal. Your response must distinguish the input-output data required of 
  both operations from the commutative and associative laws for the proposed 
  addition; do not attempt a full axiom checklist.
expected_answer: 'The proposed addition has the required type S¹×S¹→S¹ because |zw|=1
  when |z|=|w|=1, and it is commutative and associative because complex multiplication
  is. The decisive problem is the proposed scalar multiplication: the notation zᵃ
  does not by itself define a single-valued output for every pair (a,z)∈R×S¹ without
  an additional branch or angle convention. Thus a well-defined map R×S¹→S¹ has not
  been specified, so the proposal does not yet supply the basic data of a real vector-space
  structure, even though the proposed addition has the required order and grouping
  laws.'
