teach_back_source:
prompt: Let V be the set of nonempty finite subsets of Z, and propose A⊕B=A△B, 
  the symmetric difference. Before testing commutativity, identities, or 
  inverses, name the definition-level check that should be performed first and 
  give one decisive calculation.
expected_answer: 'First check whether ⊕ really defines an addition V×V→V: every ordered
  pair of elements of V must produce another element of V. It fails, because for any
  A∈V, A△A=∅, while ∅∉V. Therefore this rule is not an addition on V as stated.'
