teach_back_source:
prompt: On V=R, proposed vector addition is u⊕v=u+2v. You want the shortest 
  decisive audit rather than a full checklist. Name the addition law you would 
  test first and give one concrete calculation that settles whether this can be 
  vector addition in a real vector space.
expected_answer: Test commutativity first. For example, 0⊕1=2, while 1⊕0=1. Thus
  0⊕1≠1⊕0, so the proposed addition is not commutative and cannot be the 
  addition of a real vector space.
