teach_back_source:
prompt: Let x,y∈Fⁿ and a∈F, where F is R or C. Prove a(x+y)=ax+ay by comparing 
  an arbitrary kth coordinate. Write the coordinate chain, name the scalar law 
  used at its decisive step, and state why the coordinate result proves the 
  vector equality.
expected_answer: Fix arbitrary k∈{1,…,n}. Then 
  [a(x+y)]ₖ=a(xₖ+yₖ)=axₖ+ayₖ=[ax+ay]ₖ, where the middle equality is 
  distributivity in F. Since the kth coordinates agree for every k, the two 
  vectors in Fⁿ are equal.
