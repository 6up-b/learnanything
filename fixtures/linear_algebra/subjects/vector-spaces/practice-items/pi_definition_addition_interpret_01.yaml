teach_back_source:
prompt: 'Let V=M₂(R). A definition says that ⊕ is an addition on V. Unpack this statement
  without assuming the usual matrix formula: describe the permitted inputs, the required
  output, and what must be true for every input pair.'
expected_answer: The statement means ⊕ is a function V×V→V. It takes any ordered
  pair of 2×2 real matrices and assigns exactly one 2×2 real matrix. In 
  particular, it must be defined for every pair and its output must remain in 
  M₂(R).
