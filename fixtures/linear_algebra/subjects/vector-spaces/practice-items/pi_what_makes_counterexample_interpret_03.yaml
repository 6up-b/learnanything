variant_contract:
teach_back_source:
prompt: A candidate structure on a set V has closed operations ⊕:V×V→V and 
  ⊙:F×V→V. For particular p,q∈V, calculation gives p⊕q≠q⊕p. Explain exactly what
  this witness proves about the candidate and why checking the remaining axioms 
  cannot rescue it.
expected_answer: The witness proves that ⊕ is not commutative, so a required 
  vector-addition axiom fails. A vector space must have the specified operations
  and satisfy every axiom; therefore this candidate is not a vector space, 
  regardless of whether its other axioms hold.
