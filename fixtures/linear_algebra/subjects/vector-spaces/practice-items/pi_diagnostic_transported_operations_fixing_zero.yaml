variant_contract:
teach_back_source:
prompt: "On the set V=R², let T(x,y)=(x,y+x³), so T⁻¹(a,b)=(a,b-a³). Define\n\nv⊕w=T⁻¹(T(v)+T(w)), c⊙v=T⁻¹(cT(v)).\n\
  \nWithout checking every vector-space axiom:\n1. Determine the additive identity
  for ⊕.\n2. Compare (1,0)⊕(1,0) with the ordinary sum (1,0)+(1,0).\n3. Decide whether
  the transported structure is literally the usual vector-space structure, merely
  isomorphic to it via T, or neither. Explain why the zero-vector comparison alone
  would or would not settle that decision."
expected_answer: "Because T(0,0)=(0,0), the additive identity for ⊕ is T⁻¹(0,0)=(0,0),
  the same element as the usual zero. However, T(1,0)=(1,1), so\n(1,0)⊕(1,0)=T⁻¹((1,1)+(1,1))=T⁻¹(2,2)=(2,2-2³)=(2,-6),\n\
  whereas the ordinary sum is (2,0). Thus the operation packages are not literally
  the same. The transported structure is nevertheless isomorphic to the usual vector
  space via the bijection T, since the operations were defined by transporting the
  usual operations through T. Agreement of the zero vectors does not establish equality
  of structures; equality requires the two addition rules and the two scalar-multiplication
  rules to agree on every valid input, while one differing output is enough to prove
  they are distinct."
