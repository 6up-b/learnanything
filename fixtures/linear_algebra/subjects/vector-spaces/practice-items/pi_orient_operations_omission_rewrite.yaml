teach_back_source:
prompt: Rewrite the incomplete claim “R² is a vector space over C” as a 
  mathematically complete proposal that could actually be checked. Your rewrite 
  need not make the proposal true, but it must expose every piece of structural 
  data that a checker would need before testing axioms.
expected_answer: 'A complete proposal must name the underlying set R², the scalar
  field C, an explicit addition rule R²×R²→R², and an explicit scalar-multiplication
  rule C×R²→R². For example: “On R², propose (x,y)⊕(u,v)=(x+u,y+v), and specify a
  rule C×R²→R² for scalar multiplication; then test closure and all vector-space axioms.”
  Without the second explicit rule, the claim cannot yet be checked.'
