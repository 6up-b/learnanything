teach_back_source:
prompt: 'Let V be the real-valued functions on [0,1], with pointwise addition and
  pointwise scalar multiplication. Let f(t)=t² and g(t)=1−t². Write a compact three-row
  record containing: the addition mapping type and (f+g)(t); the scalar-multiplication
  mapping type and ((−3)f)(t); and the standard name for f as an element of V, with
  one sentence explaining why that name does not assert that f is an arrow.'
expected_answer: 'Addition: V×V→V, and (f+g)(t)=f(t)+g(t)=1. Scalar multiplication:
  R×V→V, and ((−3)f)(t)=−3t². Since f∈V and V is a vector space, f is called a vector;
  here “vector” means an element of the vector space and does not require a geometric
  arrow.'
