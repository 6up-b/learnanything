schema_version: 1
concepts:
  concept_event:
    title: Event
    type: concept
    aliases:
      - event subset
    description: A subset of a sample space whose occurrence is determined by 
      whether the actual outcome belongs to that subset.
    tags: []
    created_at: '2026-07-28T17:34:30Z'
    updated_at: '2026-07-28T17:34:30Z'
    id: concept_event
  concept_event_operations:
    title: Event Operations
    type: concept
    aliases:
      - event algebra
      - compound events
    description: Union, intersection, and complement as set operations for 
      constructing and interpreting compound events.
    tags: []
    created_at: '2026-07-28T17:34:30Z'
    updated_at: '2026-07-28T17:34:30Z'
    id: concept_event_operations
  concept_finite_outcome_counting:
    title: Finite Outcome Counting
    type: skill
    aliases:
      - finite sample-space enumeration
      - event counting
    description: Representing structured finite outcomes and counting outcomes 
      or event subsets without omission or duplication.
    tags: []
    created_at: '2026-07-28T17:34:30Z'
    updated_at: '2026-07-28T17:34:30Z'
    id: concept_finite_outcome_counting
  concept_sample_space:
    title: Sample Space
    type: concept
    aliases:
      - outcome space
    description: The set of all possible outcomes of an experiment, represented 
      at a level of detail sufficient for the questions being asked.
    tags: []
    created_at: '2026-07-28T17:34:30Z'
    updated_at: '2026-07-28T17:34:30Z'
    id: concept_sample_space
  concept_equal_counts_imply_equal_probabilities:
    title: Equal Counts Imply Equal Probabilities
    type: misconception
    aliases:
      - any count is a probability denominator
    description: The mistaken belief that merely listing or counting aggregate 
      outcomes makes those outcomes equally likely.
    tags: []
    created_at: '2026-07-28T17:34:30Z'
    updated_at: '2026-07-28T17:34:30Z'
    id: concept_equal_counts_imply_equal_probabilities
  concept_inclusion_exclusion:
    title: Inclusion-Exclusion
    type: procedure
    aliases:
      - inclusion-exclusion principle
      - finite union formula
      - Inclusion–Exclusion
      - principle of inclusion–exclusion
    description: Calculate a finite union probability by alternating sums over 
      intersections, with symmetry used to group terms when available.
    tags: []
    created_at: '2026-07-28T17:34:30Z'
    updated_at: '2026-07-28T17:34:30Z'
    id: concept_inclusion_exclusion
  concept_outcome_modeling_for_counting_probability:
    title: Outcome Modeling for Counting Probability
    type: skill
    aliases:
      - counting for probability
      - equally likely outcome model
    description: Represent outcomes precisely and verify finiteness and equal 
      likelihood before using a ratio of favorable to total outcomes.
    tags: []
    created_at: '2026-07-28T17:34:30Z'
    updated_at: '2026-07-28T17:34:30Z'
    id: concept_outcome_modeling_for_counting_probability
  concept_uniform_overcounting_and_binomial_coefficients:
    title: Uniform Overcounting and Binomial Coefficients
    type: procedure
    aliases:
      - count and divide
      - n choose k
    description: Count unordered selections by correcting a uniformly 
      overcounted ordered representation.
    tags: []
    created_at: '2026-07-28T17:34:30Z'
    updated_at: '2026-07-28T17:34:30Z'
    id: concept_uniform_overcounting_and_binomial_coefficients
  concept_probability_axioms_and_derived_rules:
    title: Probability Axioms and Derived Rules
    type: concept
    aliases:
      - axiomatic probability
      - probability space
    description: Use normalization, nonnegativity, and disjoint additivity to 
      derive and apply basic probability rules.
    tags: []
    created_at: '2026-07-28T17:34:30Z'
    updated_at: '2026-07-28T17:34:30Z'
    id: concept_probability_axioms_and_derived_rules
  concept_monte_carlo_probability_simulation:
    title: Monte Carlo Probability Simulation
    type: procedure
    aliases:
      - simulation by replication
      - empirical probability estimation
    description: Estimate probabilities by repeatedly generating outcomes from 
      the intended probability model and aggregating event indicators.
    tags: []
    created_at: '2026-07-28T17:34:30Z'
    updated_at: '2026-07-28T17:34:30Z'
    id: concept_monte_carlo_probability_simulation
  concept_multiplication_rule_and_ordered_sampling:
    title: Multiplication Rule and Ordered Sampling
    type: procedure
    aliases:
      - product rule
      - ordered sampling
    description: Count compound outcomes by multiplying uniform stage counts, 
      with replacement and order handled explicitly.
    tags: []
    created_at: '2026-07-28T17:34:30Z'
    updated_at: '2026-07-28T17:34:30Z'
    id: concept_multiplication_rule_and_ordered_sampling
  concept_stars_and_bars:
    title: Stars and Bars
    type: procedure
    aliases:
      - unordered sampling with replacement
      - dots and bars
      - combinations with repetition
      - Bose–Einstein counting
    description: Count unordered selections with repetition by encoding 
      multiplicities as nonnegative integer solutions.
    tags: []
    created_at: '2026-07-28T17:34:30Z'
    updated_at: '2026-07-28T17:34:30Z'
    id: concept_stars_and_bars
  concept_combinatorial_story_proofs:
    title: Combinatorial Story Proofs
    type: skill
    aliases:
      - proof by interpretation
      - double counting
      - combinatorial proofs
      - double-counting proofs
    description: Prove an identity by showing that both expressions count the 
      same finite collection.
    tags: []
    created_at: '2026-07-28T17:34:30Z'
    updated_at: '2026-07-28T17:34:30Z'
    id: concept_combinatorial_story_proofs
  concept_bootstrap_sampling:
    title: Bootstrap Sampling
    type: concept
    aliases:
      - sampling with replacement
    description: Sampling with replacement to produce an ordered sequence, with 
      unordered multiplicity outcomes weighted by their numbers of realizing 
      sequences.
    tags: []
    created_at: '2026-07-28T17:34:30Z'
    updated_at: '2026-07-28T17:34:30Z'
    id: concept_bootstrap_sampling
  concept_nonuniform_birthday_collisions:
    title: Nonuniform Birthday Collisions
    type: concept
    aliases:
      - nonuniform birthday problem
    description: Collision probabilities when possible birthdays have unequal 
      probabilities, including their expression through elementary symmetric 
      polynomials and comparison under probability equalization.
    tags: []
    created_at: '2026-07-28T17:34:30Z'
    updated_at: '2026-07-28T17:34:30Z'
    id: concept_nonuniform_birthday_collisions
  concept_random_time_sampling_and_first_arrival_bias:
    title: Random-Time Sampling and First-Arrival Bias
    type: concept
    aliases:
      - first-arrival sampling
      - inspection-time sampling
      - non-uniform interval sampling
    description: How observing the next event after arriving at a random time 
      can produce probabilities governed by unequal time intervals rather than 
      by raw event counts.
    tags: []
    created_at: '2026-07-28T20:06:34Z'
    updated_at: '2026-07-28T20:06:34Z'
    id: concept_random_time_sampling_and_first_arrival_bias
