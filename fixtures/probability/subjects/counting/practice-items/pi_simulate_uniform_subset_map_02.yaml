teach_back_source:
prompt: 'A simple random sample selects two people from {A,B,C,D}, so all two-person
  subsets must be equally likely. Build a simulation using a uniform random integer
  from 1 through 6: give a one-to-one mapping from the six integers to the six subsets,
  explain why this represents the intended sample space, and write the hit-count procedure
  for estimating the probability that A is selected. Apply your mapping to the integer
  stream 1, 6, 2, 3, 6, 5 and report the estimate.'
expected_answer: One valid map is 1→{A,B}, 2→{A,C}, 3→{A,D}, 4→{B,C}, 5→{B,D}, 
  6→{C,D}. Each subset receives exactly one of six equally likely integers, so 
  the simulated subsets are equally likely as required. Set hits=0; for each 
  generated integer, map it to a subset and increment hits if that subset 
  contains A; return hits/N. In the stream, 1, 2, and 3 are hits, so the 
  estimate is 3/6=1/2.
