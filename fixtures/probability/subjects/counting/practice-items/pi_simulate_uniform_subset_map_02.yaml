      quote: "For the complements of the events just considered,\n$$P_{\\text{naive}}(A^c)
        = \\frac{4}{9}, \\ P_{\\text{naive}}(B^c) = \\frac{5}{9}, \\ P_{\\text{naive}}((A
        \\cup B)^c) = \\frac{1}{9}, \\ P_{\\text{naive}}((A \\cap B)^c) = \\frac{8}{9}.$$\n\
        In general,\n$$P_{\\text{naive}}(A^c) = \\frac{|A^c|}{|S|} = \\frac{|S| -
        |A|}{|S|} = 1 - \\frac{|A|}{|S|} = 1 - P_{\\text{naive}}(A).$$\nIn Section
        1.6, we will see that this result about complements always holds for probability,
        even when we go beyond the naive definition. A good strategy when trying to
        find the probability of an event is to start by thinking about whether it
        will be easier to find the probability of the event or the probability of
        its complement. De Morgan's laws are especially useful in this context, since
        it may be easier to work with an intersection than a union, or vice versa.\n\
        The naive definition is very restrictive in that it requires S to be finite,
        with equal mass for each pebble. It has often been misapplied by people who
        assume equally likely outcomes without justification and make arguments to
        the effect of \"either it will happen or it won't, and we don't know which,
        so it's 50-50\". In addition to sometimes giving absurd probabilities, this
        type of reasoning isn't even internally consistent. For example, it would
        say that the probability of life on Mars is 1/2 (\"either there is or there
        isn't life there\"), but it would also say that the probability of intelligent
        life on Mars is 1/2, and it is clear intuitively—and by the properties of
        probability developed in Section 1.6— that the latter should have strictly
        lower probability than the former. But there are several important types of
        problems where the naive definition is applicable:\nwhen there is symmetry
        in the problem that makes outcomes equally likely. It is common to assume
        that a coin has a 50% chance of landing Heads when tossed, due to the physical
        symmetry of the coin. 1 For a standard, well-shuffled deck of cards, it is
        reasonable to assume that all orders are equally likely. There aren't certain
        overeager cards that especially like to be near the top of the deck; any particular
        location in the deck is equally likely to house any of the 52 cards. when
        the outcomes are equally likely by design. For example, consider conducting
        a survey of n people in a population of N people. A common goal is to obtain
        a simple random sample, which means that the n people are chosen randomly
        with all subsets of size n being equally likely. If successful, this ensures
        that the naive definition is applicable, but in practice this may be hard
        to accomplish because of various complications, such as not having a complete,
        accurate list of contact information for everyone in the population.\n1 See
        Diaconis, Holmes, and Montgomery [7] for a physical argument that the chance
        of a tossed coin coming up the way it started is about 0.51 (close to but
        slightly more than 1/2), and Gelman and Nolan [11] for an explanation of why
        the probability of Heads is close to 1/2 even for a coin that is manufactured
        to have different weights on the two sides (for standard coin-tossing; allowing
        the coin to spin is a different matter)."
