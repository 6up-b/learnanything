teach_back_source:
prompt: 'A bootstrap sample of size four is drawn with replacement and equal probabilities
  from four distinct source values a,b,c,d, after which order is discarded. Compare
  the unordered outcome {a,a,b,c} with {a,a,a,a}: count the ordered sequences represented
  by each, compute each probability, and give their probability ratio.'
expected_answer: The multiset {a,a,b,c} has multiplicities (2,1,1,0), so it 
  represents 4!/2!=12 ordered sequences. The multiset {a,a,a,a} represents one 
  ordered sequence. Since all 4^4 ordered samples are equally likely, the 
  probabilities are 12/4^4=3/64 and 1/4^4=1/256. Their ratio is 12.
