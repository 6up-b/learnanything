teach_back_source:
prompt: Derive P(A∪B)=P(A)+P(B)-P(A∩B) using only disjoint decompositions and 
  probability additivity. Identify each disjoint decomposition explicitly.
expected_answer: First decompose A∪B as the disjoint union A and B∩A^c, so 
  P(A∪B)=P(A)+P(B∩A^c). Next decompose B as the disjoint union A∩B and B∩A^c, so
  P(B)=P(A∩B)+P(B∩A^c). Thus P(B∩A^c)=P(B)-P(A∩B); substitution yields the 
  addition rule.
