teach_back_source:
prompt: "While analyzing and optimizing a nonuniform birthday collision probability
  for three independent people, suppose two day probabilities are initially \\(a\\
  ) and \\(a\\). They are perturbed to \\(a+d\\) and \\(a-d\\), where \\(0<d<a\\);
  all other day probabilities remain unchanged. Let \\(S\\) denote the sum of those
  unchanged probabilities.\n\nUsing \\(e_3\\), determine how this perturbation changes
  the probability of at least one birthday match. Give the change as an expression
  in \\(d\\) and \\(S\\), and identify the decisive term in the symmetric-polynomial
  comparison."
expected_answer: "For three independent birthdays, \\(P(\\text{no match})=3!e_3=6e_3\\
  ). Holding the other coordinates fixed, the terms involving exactly one of the selected
  coordinates are unchanged because their sum remains \\(2a\\). The decisive term
  is their product times \\(e_1\\) of the remaining coordinates:\n\\[\n(a+d)(a-d)S=(a^2-d^2)S,\n\
  \\]\nwhich is \\(d^2S\\) smaller than \\(a^2S\\). Hence the no-match probability
  decreases by \\(6d^2S\\), so the probability of at least one match increases by
  \\(6d^2S\\)."
