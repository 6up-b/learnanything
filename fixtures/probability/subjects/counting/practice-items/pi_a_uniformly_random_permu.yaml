teach_back_source:
prompt: A uniformly random permutation of n labeled cards is placed into n 
  labeled positions. Let A_i be the event that card i is in position i. Derive 
  the inclusion-exclusion expression for the probability of at least one match. 
  Explain how symmetry groups the r-way intersections and state the limit as n 
  grows.
expected_answer: Winning is the union of A_1,…,A_n. For any r specified 
  positions, fixing those cards leaves (n-r)! permutations, so the intersection 
  probability is (n-r)!/n!. There are binom(n,r) such intersections. 
  Inclusion-exclusion therefore gives sum from r=1 to n of 
  (-1)^(r+1)binom(n,r)(n-r)!/n!=sum from r=1 to n of 
  (-1)^(r+1)/r!=1-1/2!+1/3!-⋯+(-1)^(n+1)/n!. As n grows this approaches 1-1/e.
