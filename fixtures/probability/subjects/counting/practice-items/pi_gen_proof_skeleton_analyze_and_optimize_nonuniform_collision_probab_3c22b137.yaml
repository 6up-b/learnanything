teach_back_source:
prompt: Consider the problem “Analyze and Optimize Nonuniform Collision 
  Probability” for a calendar with \(m\) possible birthday dates and probability
  vector \(q=(q_1,\ldots,q_m)\). There are \(k\) independent people, where 
  \(2\le k\le m\). Build an ordered proof skeleton that identifies which 
  probability vectors minimize the chance of at least one birthday match. Your 
  skeleton must state the quantity being optimized, express it using an 
  elementary symmetric polynomial, analyze one pairwise equalization step, 
  justify the relevant inequality, and explain how repeated steps settle the 
  optimizer and any equality conditions. Do not merely state the optimizing 
  vector.
expected_answer: "1. For the no-match event \\(N\\), independence and the \\(k!\\\
  ) orders of each selected set of dates give\n\\[\nP(N\\mid q)=k!e_k(q),\\qquad P(\\
  text{match}\\mid q)=1-k!e_k(q).\n\\]\nThus minimizing matches is equivalent to maximizing
  \\(e_k(q)\\).\n2. For two coordinates \\(x,y\\) and remaining vector \\(z\\),\n\\\
  [\ne_k(x,y,z)=xye_{k-2}(z)+(x+y)e_{k-1}(z)+e_k(z).\n\\]\n3. Replacing \\(x,y\\)
  by \\(s/2,s/2\\), where \\(s=x+y\\), fixes the last two terms and changes the first
  through the product. Since \\(xy\\le s^2/4\\), equalization weakly increases \\\
  (e_k\\), so it weakly decreases the match probability.\n4. Repeatedly equalizing
  unequal coordinates leads to \\(q_i=1/m\\) for every \\(i\\), which therefore maximizes
  the no-match probability and minimizes the match probability.\n5. With \\(2\\le
  k\\le m\\), an unequal pair can be chosen with \\(e_{k-2}(z)>0\\) unless the distribution
  is already uniform at the optimum; the AM-GM step is then strict. Hence the uniform
  vector is the unique minimizer."
