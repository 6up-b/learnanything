teach_back_source:
prompt: Four labeled cards are shuffled uniformly into four labeled positions. 
  Let A_i be the event that card i lands in position i. Build a four-row table 
  for k=1,2,3,4. In row k, state (i) how many distinct k-event intersections 
  occur in inclusion-exclusion, (ii) the probability of any one such 
  intersection, and (iii) that row's signed contribution to P(A_1 ∪ A_2 ∪ A_3 ∪ 
  A_4). Then add the contributions and give the probability that at least one 
  card matches its position as a reduced fraction.
expected_answer: 'For each k, there are C(4,k) intersections, and fixing the selected
  k cards leaves (4-k)! of the 4! permutations possible, so each intersection has
  probability (4-k)!/4! = 1/[4·3·...·(4-k+1)]. The rows are: k=1: 4 intersections,
  probability 1/4 each, signed contribution +1; k=2: 6 intersections, probability
  1/12 each, signed contribution -1/2; k=3: 4 intersections, probability 1/24 each,
  signed contribution +1/6; k=4: 1 intersection, probability 1/24, signed contribution
  -1/24. Thus P(A_1∪A_2∪A_3∪A_4)=1-1/2+1/6-1/24=15/24=5/8.'
