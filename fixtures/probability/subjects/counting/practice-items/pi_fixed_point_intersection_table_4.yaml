      quote: "deck and allow the remaining n-2 cards to be in any order, so (n-2)!
        out of n! possibilities are favorable to $A_i \\cap A_j$. Similarly,\n$$P(A_i
        \\cap A_j \\cap A_k) = \\frac{1}{n(n-1)(n-2)},$$\nand the pattern continues
        for intersections of 4 events, etc.\nIn the inclusion-exclusion formula, there
        are n terms involving one event, $\\binom{n}{2}$ terms involving two events,
        $\\binom{n}{3}$ terms involving three events, and so forth. By the symmetry
        of the problem, all n terms of the form $P(A_i)$ are equal, all $\\binom{n}{2}$
        terms of the form $P(A_i \\cap A_j)$ are equal, and the whole expression simplifies
        considerably:\n$$P\\left(\\bigcup_{i=1}^{n} A_i\\right) = \\frac{n}{n} - \\
        frac{\\binom{n}{2}}{n(n-1)} + \\frac{\\binom{n}{3}}{n(n-1)(n-2)} - \\dots
        + (-1)^{n+1} \\cdot \\frac{1}{n!}$$$$= 1 - \\frac{1}{2!} + \\frac{1}{3!} -
        \\dots + (-1)^{n+1} \\cdot \\frac{1}{n!}.$$\nComparing this to the Taylor
        series for 1/e (see Section A.8 of the math appendix),\n$$e^{-1} = 1 - \\\
        frac{1}{1!} + \\frac{1}{2!} - \\frac{1}{3!} + \\dots,$$\nwe see that for large
        n, the probability of winning the game is extremely close to 1 - 1/e, or about
        0.63. Interestingly, as n grows, the probability of winning approaches 1 -
        1/e instead of going to 0 or 1. With a lot of cards in the deck, the number
        of possible locations for matching cards increases while the probability of
        any particular match decreases, and these two forces offset each other and
        balance to give a probability of about 1 - 1/e.\nInclusion-exclusion is a
        very general formula for the probability of a union of events, but it helps
        us the most when there is symmetry among the events $A_j$; otherwise the sum
        can be extremely tedious. In general, when symmetry is lacking, we should
        try to use other tools before turning to inclusion-exclusion as a last resort.\n\
        1.7 Recap\nProbability allows us to quantify uncertainty and randomness in
        a principled way. Probabilities arise when we perform an experiment: the set
        of all possible outcomes of the experiment is called the sample space, and
        a subset of the sample space is called an event. It is useful to be able to
        go back and forth between describing events in English and writing them down
        mathematically as sets (often using unions, intersections, and complements).\n\
        Pebble World can help us visualize sample spaces and events when the sample
        space is finite. In Pebble World, each outcome is a pebble, and an event is
        a set of pebbles. If all the pebbles have the same mass (i.e., are equally
        likely), we can apply the naive definition of probability, which lets us calculate
        probabilities by counting.\nTo this end, we discussed several tools for counting.
        When counting the number of possibilities, we often use the multiplication
        rule. For example, there are n! permutations of the numbers 1, 2, . . . ,
        n and there are 2 n subsets of a set with n elements. If we can't directly
        use the multiplication rule, we can sometimes count each possibility exactly
        c times for some c, and then divide by c to get the actual number of possibilities.
        For example, this strategy is useful for finding an expression for binomial
        coefficients in terms of factorials.\nAn important pitfall to avoid is misapplying
        the naive definition of probability, implicitly or explicitly assuming equally
        likely outcomes without justification. One technique to help avoid this is
        to give objects labels, for precision and so that we are not tempted to treat
        them as indistinguishable."
