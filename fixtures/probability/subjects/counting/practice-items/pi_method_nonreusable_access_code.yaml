prompt: A museum stores an ordered three-symbol access code using six distinct 
  symbols. A symbol may not be reused. State the counting method and the 
  expression for the number of possible codes; justify the factors in one 
  sentence.
expected_answer: Use the multiplication rule without replacement. The successive
  positions have six, five, and four available symbols, so the count is 
  6·5·4=120.
