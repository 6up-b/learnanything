teach_back_source:
prompt: Give a story proof of binom(m+n,k)=sum from j=0 to k of 
  binom(m,j)binom(n,k-j). Your response must name the common collection, explain
  the direct count, and explain why the indexed cases are exhaustive and 
  disjoint.
expected_answer: Consider k-person committees chosen from m juniors and n 
  seniors. Directly, there are binom(m+n,k) committees. Alternatively, classify 
  a committee by its unique number j of juniors. Choose those juniors in 
  binom(m,j) ways and the remaining k-j seniors in binom(n,k-j) ways, then sum 
  over j. Every committee has exactly one value of j, so the cases are 
  exhaustive and disjoint and the two counts are equal.
