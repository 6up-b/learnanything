teach_back_source:
prompt: A customer chooses five pastries from three labeled types; repeats are 
  allowed and purchase order is ignored. Define count variables, translate the 
  purchase into a nonnegative-integer equation, encode it with stars and bars, 
  and compute the number of purchases.
expected_answer: Let xi be the number of pastries of type i. Then x1+x2+x3=5 
  with xi≥0. Each solution is encoded by five stars and two bars, so choose the 
  five star positions among seven positions. The count is C(7,5)=C(7,2)=21.
