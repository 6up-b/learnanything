      quote: "for some c, then we can adjust by dividing by c. For example, if we
        have exactly double-counted each possibility, we can divide by 2 to get the
        correct count. We call this adjusting for overcounting .\nExample 1.4.13 (Committees
        and teams). Consider a group of four people.\n(a) How many ways are there
        to choose a two-person committee? (b) How many ways are there to break the
        people into two teams of two? Solution: (a) One way to count the possibilities
        is by listing them out: labeling the people as 1, 2, 3, 4, the possibilities
        are 12, 13, 14, 23, 24, 34.\nAnother approach is to use the multiplication
        rule with an adjustment for overcounting. By the multiplication rule, there
        are 4 ways to choose the first person on the committee and 3 ways to choose
        the second person on the committee, but this counts each possibility twice,
        since picking 1 and 2 to be on the committee is the same as picking 2 and
        1 to be on the committee. Since we have overcounted by a factor of 2, the
        number of possibilities is $(4 \\cdot 3)/2 = 6$.\n(b) Here are 3 ways to see
        that there are 3 ways to form the teams. Labeling the people as 1, 2, 3, 4,
        we can directly list out the possibilities: 12 34, 13 24, and 14 23. Listing
        out all possibilities would quickly become tedious or infeasible with more
        people though. Another approach is to note that it suffices to specify person
        1's teammate (and then the other team is determined). A third way is to use
        (a) to see that there are 6 ways to choose one team. This overcounts by a
        factor of 2, since picking 1 and 2 to be a team is equivalent to picking 3
        and 4 to be a team. So again the answer is 6/2 = 3.\nA binomial coefficient
        counts the number of subsets of a certain size for a set, such as the number
        of ways to choose a committee of size k from a set of n people. Sets and subsets
        are by definition unordered, e.g., $\\{3,1,4\\} = \\{4,1,3\\}$, so we are
        counting the number of ways to choose k objects out of n, without replacement
        and without distinguishing between the different orders in which they could
        be chosen.\nDefinition 1.4.14 (Binomial coefficient). For any nonnegative
        integers k and n, the binomial coefficient $\\binom{n}{k}$, read as \"n choose
        k\", is the number of subsets of size k for a set of size n.\nFor example,
        $\\binom{4}{2} = 6$, as shown in Example 1.4.13. The binomial coefficient
        $\\binom{n}{k}$ is sometimes called a combination , but we do not use that
        terminology here since \"combination\" is such a useful general-purpose word.
        Algebraically, binomial coefficients can be computed as follows.\nTheorem
        1.4.15 (Binomial coefficient formula). For $k \\leq n$, we have\n$$\\binom{n}{k}
        = \\frac{n(n-1)\\cdots(n-k+1)}{k!} = \\frac{n!}{(n-k)!k!}.$$\nFor k > n, we
        have $\\binom{n}{k} = 0$.\nProof. Let A be a set with |A| = n. Any subset
        of A has size at most n, so $\\binom{n}{k} = 0$ for k > n. Now let $k \\le
        n$. By Theorem 1.4.8, there are $n(n-1)\\cdots(n-k+1)$ ways to make an ordered
        choice of k elements without replacement. This overcounts each subset of interest
        by a factor of k! (since we don't care how these elements are ordered), so
        we can get the correct count by dividing by k!.\n4.4.16. The binomial coefficient
        $\\binom{n}{k}$ is often defined in terms of factorials, but keep in mind
        that $\\binom{n}{k}$ is 0 if k > n, even though the factorial of a negative
        number is undefined. Also, the middle expression in Theorem 1.4.15 is often
        better for computation than the expression with factorials, since factorials
        grow extremely fast. For example,\n$$\\binom{100}{2} = \\frac{100 \\cdot 99}{2}
        = 4950$$\ncan even be done by hand, whereas computing $\\binom{100}{2} = 100!/(98!
        \\cdot 2!)$ by first calculating 100! and 98! would be wasteful and possibly
        dangerous because of the extremely large numbers involved $(100! \\approx
        9.33 \\times 10^{157})$.\nExample 1.4.17 (Club officers). In a club with n
        people, there are n(n-1)(n-2) ways to choose a president, vice president,
        and treasurer, and there are\n$$\\binom{n}{3} = \\frac{n(n-1)(n-2)}{3!}$$"
