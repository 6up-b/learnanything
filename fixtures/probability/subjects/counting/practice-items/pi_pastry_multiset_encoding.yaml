      quote: "Newton arrived at the correct answer using similar calculations. Newton
        also provided Pepys with an intuitive argument for why A was the most likely
        of the three; however, his intuition was invalid. As explained in Stigler
        [24], using loaded dice could result in a different ordering of A, B, C, but
        Newton's intuitive argument did not depend on the dice being fair.\nIn this
        book, we care about counting not for its own sake, but because it sometimes
        helps us to find probabilities. Here is an example of a neat but treacherous
        counting problem; the solution is elegant, but it is rare that the result
        can be used with the naive definition of probability.\nExample 1.4.22 (Bose-Einstein).
        How many ways are there to choose k times from a set of n objects with replacement,
        if order doesn't matter (we only care about how many times each object was
        chosen, not the order in which they were chosen)?\nSolution:\nWhen order does
        matter, the answer is $n^k$ by the multiplication rule, but this problem is
        much harder. We will solve it by solving an isomorphic problem (the same problem
        in a different guise).\nLet us find the number of ways to put k indistinguishable
        particles into n distinguishable boxes. That is, swapping the particles in
        any way is not considered a separate\npossibility: all that matters are the
        counts for how many particles are in each box. This scenario is known as a
        Bose-Einstein problem, since the physicists Satyendra Nath Bose and Albert
        Einstein studied related problems about indistinguishable particles in the
        1920s, using their ideas to successfully predict the existence of a strange
        state of matter known as a Bose-Einstein condensate.\nAny configuration can
        be encoded as a sequence of |'s and $\\bullet$'s in a natural way, as illustrated
        in Figure 1.6.\n\nFIGURE 1.6\nBose-Einstein encoding: putting k=7 indistinguishable
        particles into n=4 distinguishable boxes can be expressed as a sequence of
        |'s and $\\bullet$'s, where | denotes a wall and $\\bullet$ denotes a particle.\n\
        To be valid, a sequence must start and end with a |, and have exactly n-1
        |'s and exactly k $\\blacksquare$'s in between the starting and ending |'s;
        conversely, any such sequence is a valid encoding for some configuration of
        particles in boxes. Imagine that we have written down the starting and ending
        |'s, which represent the outer walls, and in between there are n+k-1 fill-in-the-blank
        slots in between the outer walls. We need only choose where to put the k $\\\
        blacksquare$'s (since then where the n+k-1 interior |'s go is completely determined).
        So the number of possibilities is $\\binom{n+k-1}{k}$. This counting method
        is sometimes called the stars and bars argument, where here we have dots in
        place of stars.\nTo relate this result back to the original question, we can
        let each box correspond to one of the n objects and use the particles as \"\
        check marks\" to tally how many times each object is selected. For example,
        if a certain box contains exactly 3 particles, that means the object corresponding
        to that box was chosen exactly 3 times. The particles being indistinguishable
        corresponds to the fact that we don't care about the order in which the objects
        are chosen. Thus, the answer to the original question is also $\\binom{n+k-1}{k}$.\n\
        Another isomorphic problem is to count the number of solutions $(x_1, \\ldots,
        x_n)$ to the equation $x_1 + x_2 + \\cdots + x_n = k$, where the $x_i$ are
        nonnegative integers. This is equivalent since we can think of $x_i$ as the
        number of particles in the i th box.\n$\\bigstar$ 1.4.23. The Bose-Einstein
        result should not be used in the naive definition of probability except in
        very special circumstances. For example, consider a survey where a sample
        of size k is collected by choosing people from a population of size n"
