teach_back_source:
prompt: A length-6 string is formed from the alphabet {A,B,C,D}. How many 
  strings contain every letter at least once? Define the bad events and use 
  inclusion–exclusion; do not give only an unevaluated union.
expected_answer: Let Ei be the event that letter i is absent. There are 4^6 
  total strings. Inclusion–exclusion gives 
  4^6-4·3^6+binom(4,2)·2^6-binom(4,3)·1^6=1560.
