teach_back_source:
prompt: Construct a story proof of k·C(n,k)=n·C(n-1,k-1) for 1≤k≤n. Name one 
  collection of objects with enough detail that both sides count exactly that 
  collection. Then describe the two counting procedures factor by factor and 
  state why their equality follows.
expected_answer: Count pairs (K,c) where K is a k-person committee chosen from n
  people and c is a designated captain belonging to K. First choose K in C(n,k) 
  ways and then its captain in k ways, giving kC(n,k). Alternatively, choose the
  captain first in n ways and then choose the other k-1 committee members from 
  the remaining n-1 people in C(n-1,k-1) ways, giving nC(n-1,k-1). Both 
  expressions count every captained committee exactly once, so they are equal.
