teach_back_source:
prompt: An organization has n+1 people, one designated as president. The common 
  collection is the set of k-person committees, partitioned into committees that
  exclude the president and committees that include the president. Complete the 
  story proof by counting each part, establishing that the parts are disjoint 
  and exhaustive, and writing the resulting identity.
expected_answer: Committees excluding the president choose all k members from 
  the other n people, so there are C(n,k). Committees including the president 
  choose their remaining k-1 members from the other n people, so there are 
  C(n,k-1). The cases are disjoint and every k-person committee is in exactly 
  one case. Therefore C(n,k)+C(n,k-1)=C(n+1,k).
