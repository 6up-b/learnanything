      quote: "Hint: How many players need to be eliminated?\n6. There are 20 people
        at a chess club on a certain day. They each find opponents and start playing.
        How many possibilities are there for how they are matched up, assuming that
        in each game it does matter who has the white pieces (in a chess game, one
        player has the white pieces and the other player has the black pieces)?\n\
        7. Two chess players, A and B, are going to play 7 games. Each game has three
        possible outcomes: a win for A (which is a loss for B), a draw (tie), and
        a loss for A (which is a win for B). A win is worth 1 point, a draw is worth
        0.5 points, and a loss is worth 0 points. (a) How many possible outcomes for
        the individual games are there, such that overall player A ends up with 3
        wins, 2 draws, and 2 losses? (b) How many possible outcomes for the individual
        games are there, such that A ends up with 4 points and B ends up with 3 points?
        (c) Now assume that they are playing a best-of-7 match, where the match will
        end when either player has 4 points or when 7 games have been played, whichever
        is first. For example, if after 6 games the score is 4 to 2 in favor of A,
        then A wins the match and they don't play a 7th game. How many possible outcomes
        for the individual games are there, such that the match lasts for 7 games
        and A wins by a score of 4 to 3? 8. s (a) How many ways are there to split
        a dozen people into 3 teams, where one team has 2 people, and the other two
        teams have 5 people each? (b) How many ways are there to split a dozen people
        into 3 teams, where each team has 4 people? 9. s (a) How many paths are there
        from the point (0, 0) to the point (110, 111) in the plane such that each
        step either consists of going one unit up or one unit to the right? (b) How
        many paths are there from (0, 0) to (210, 211), where each step consists of
        going one unit up or one unit to the right, and the path has to go through
        (110, 111)? 10. To fulfill the requirements for a certain degree, a student
        can choose to take any 7 out of a list of 20 courses, with the constraint
        that at least 1 of the 7 courses must be a statistics course. Suppose that
        5 of the 20 courses are statistics courses. (a) How many choices are there
        for which 7 courses to take? (b) Explain intuitively why the answer to (a)
        is not 5 1 · 19 6 . 11. Let A and B be sets with |A| = n, |B| = m. (a) How
        many functions are there from A to B (i.e., functions with domain A, assigning
        an element of B to each element of A)? (b) How many one-to-one functions are
        there from A to B? (See Section A.2.1 of the math appendix for information
        about one-to-one functions.) 12. Four players, named A, B, C, and D, are playing
        a card game. A standard, well-shuffled deck of cards is dealt to the players
        (so each player receives a 13-card hand). (a) How many possibilities are there
        for the hand that player A will get? (Within a hand, the order in which cards
        were received doesn't matter.) (b) How many possibilities are there overall
        for what hands everyone will get, assuming that it matters which player gets
        which hand, but not the order of cards within a hand? (c) Explain intuitively
        why the answer to Part (b) is not the fourth power of the answer to Part (a).
        13. A certain casino uses 10 standard decks of cards mixed together into one
        big deck, which we will call a superdeck. Thus, the superdeck has 52 · 10
        = 520 cards, with 10 copies of each card. How many different 10-card hands
        can be dealt from the superdeck? The order of the cards does not matter, nor
        does it matter which of the original 10 decks the cards came from. Express
        your answer as a binomial coefficient.\nHint: Bose-Einstein.\n14. You are
        ordering two pizzas. A pizza can be small, medium, large, or extra large,
        with any combination of 8 possible toppings (getting no toppings is allowed,
        as is getting all 8). How many possibilities are there for your two pizzas?\n\
        Story proofs\n15. (S) Give a story proof that $\\sum_{k=0}^{n} {n \\choose
        k} = 2^n$. 16. (§) Show that for all positive integers n and k with $n \\\
        ge k$,\n$$\\binom{n}{k} + \\binom{n}{k-1} = \\binom{n+1}{k},$$\ndoing this
        in two ways: (a) algebraically and (b) with a story, giving an interpretation
        for why both sides count the same thing.\nHint for the story proof: Imagine
        an organization consisting of n+1 people, with one of them pre-designated
        as the president of the organization.\n17. Give a story proof that\n$$\\sum_{k=0}^{n}
        \\binom{n}{k}^2 = \\binom{2n}{n},$$\nfor all positive integers n.\n18. Give
        a story proof that"
