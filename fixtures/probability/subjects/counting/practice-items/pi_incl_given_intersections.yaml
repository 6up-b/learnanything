prompt: A random permutation of four labeled cards is placed in four labeled 
  positions. For i=1,2,3, let A_i mean that card i is in position i. You are 
  given P(A_i)=1/4 for each i, P(A_i∩A_j)=1/12 for each pair, and 
  P(A_1∩A_2∩A_3)=1/24. Compute P(A_1∪A_2∪A_3). Write the inclusion-exclusion 
  line and simplify it.
expected_answer: P(A_1∪A_2∪A_3)=3(1/4)-3(1/12)+1/24=13/24.
