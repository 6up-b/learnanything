teach_back_source:
prompt: An elevator passes a floor once going up and once going down during 
  every cycle. A randomly arriving observer nevertheless reports that the next 
  elevator is usually going down. Does this contradict the equal directional 
  counts? Explain using the observer's sampling protocol.
expected_answer: No. Equal counts describe a long-run record of every passage, 
  while the observer records only the first passage after arriving at a random 
  time. If downward travel is the next event during a larger portion of the 
  cycle, a downward first arrival is more probable despite equal counts.
