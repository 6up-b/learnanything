teach_back_source:
prompt: An organization has n+1 people, one designated as president. Construct a
  story proof of C(n,k)+C(n,k-1)=C(n+1,k). Your response must specify one common
  collection, devise a partition of that collection, establish that the parts 
  are disjoint and exhaustive, and count the same collection in both ways.
expected_answer: Let the common collection be all k-person committees chosen 
  from the n+1 people. Partition it according to whether the president is absent
  or present. The absent case contributes C(n,k); the present case contributes 
  C(n,k-1), since only the other k-1 members remain to be chosen. The cases are 
  disjoint and exhaustive, while the whole collection has size C(n+1,k), proving
  the identity.
