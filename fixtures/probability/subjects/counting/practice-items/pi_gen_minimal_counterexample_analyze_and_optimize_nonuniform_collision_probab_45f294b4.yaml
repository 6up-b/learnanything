teach_back_source:
prompt: In “Analyze and Optimize Nonuniform Collision Probability,” pairwise 
  averaging is used to compare collision probabilities for independent 
  birthdays. Find the smallest example, in numbers of people and birthday 
  categories, where averaging two unequal category probabilities does not 
  strictly lower the probability of at least one match. Give the probabilities 
  before and after averaging and the decisive reason strict improvement fails.
expected_answer: Three people and two categories suffice. For example, average 
  the unequal probabilities `(0.8, 0.2)` to obtain `(0.5, 0.5)`. With three 
  people but only two categories, a match is certain by the pigeonhole principle
  under both distributions, so the collision probability remains `1`; strict 
  improvement fails because an all-distinct outcome is impossible.
