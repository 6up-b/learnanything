teach_back_source:
prompt: Two fair six-sided dice are rolled. A learner proposes the unordered 
  sums {2,3,…,12} as 11 equally likely outcomes and concludes 
  P(sum=11)=P(sum=12)=1/11. Diagnose the model and compute both probabilities 
  using an appropriate elementary sample space.
expected_answer: The sums are not equally likely. Label the dice and use the 36 
  equally likely ordered pairs. Sum 11 has (5,6) and (6,5), so its probability 
  is 2/36=1/18. Sum 12 has only (6,6), so its probability is 1/36.
