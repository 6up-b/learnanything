variant_contract:
teach_back_source:
prompt: There are n balls in a jar, labeled with the numbers $1 , 2 , \dots , n$
  . A total of $k$ balls are drawn, one by one with replacement , to obtain a 
  sequence of numbers. (a) What is the probability that the sequence obtained is
  strictly increasing? (b) What is the probability that the sequence obtained is
  increasing (but not necessarily strictly increasing, i.e., there can be 
  repetitions)?
expected_answer: "Each ordered sequence of $k$ draws is an element of $\\{1,2,\\dots,n\\
  }^k$. Since the draws are independent and uniform, there are $n^k$ equally likely
  sequences.\n\n(a) A strictly increasing sequence is determined uniquely by choosing
  $k$ distinct labels from the $n$ labels: once the labels are chosen, they have only
  one strictly increasing ordering. Thus there are $\\binom{n}{k}$ favorable sequences,
  so\n\n$$P(\\text{strictly increasing})=\\frac{\\binom{n}{k}}{n^k}.$$\n\nThis is
  $0$ when $k>n$, using the convention $\\binom{n}{k}=0$.\n\n(b) A weakly increasing
  sequence is determined uniquely by the multiplicities $x_1,\\dots,x_n$ of the labels,
  where\n\n$$x_1+\\cdots+x_n=k,\\qquad x_i\\ge 0.$$\n\nConversely, every solution
  gives exactly one weakly increasing sequence containing $x_i$ copies of label $i$.
  By stars and bars, the number of such solutions is\n\n$$\\binom{n+k-1}{k}.$$\n\n\
  Therefore\n\n$$P(\\text{increasing})=\\frac{\\binom{n+k-1}{k}}{n^k}.$$\n\nHere “increasing”
  in part (b) means nondecreasing."
difficulty: 0.55
difficulty_source: llm_estimate
tags: []
hints:
  - Begin by identifying the equally likely complete outcomes of the $k$ 
    successive draws and counting them.
  - For part (a), ask how many choices of $k$ distinct labels can produce an 
    increasing sequence once their order is fixed.
  - For part (b), describe a nondecreasing sequence by recording how many times 
    each of the $n$ labels occurs.
  - Translate those multiplicities into a nonnegative integer equation and apply
    stars and bars before dividing by the size of the ordered sample space.
