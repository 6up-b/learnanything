variant_contract:
teach_back_source:
prompt: There are n balls in a jar, labeled with the numbers 1, 2, . . . , n. A 
  total of k balls are drawn, one by one with replacement, to obtain a sequence 
  of numbers. (a) What is the probability that the sequence obtained is strictly
  increasing? (b) What is the probability that the sequence obtained is 
  increasing (but not necessarily strictly increasing, i.e., there can be 
  repetitions)?
expected_answer: "Each of the $k$ draws has $n$ possible results, and the draws are
  ordered, so there are $n^k$ equally likely sequences in total.\n\nFor (a), a strictly
  increasing sequence cannot repeat a label, so it exists only when $k\\le n$. Choose
  the $k$ distinct labels that appear. Once they are chosen, there is exactly one
  ordering of them that is strictly increasing. Hence there are $\\binom{n}{k}$ favorable
  sequences when $k\\le n$, and none when $k>n$. Therefore\n$$P(\\text{strictly increasing})=\\
  begin{cases}\\dfrac{\\binom{n}{k}}{n^k},&k\\le n,\\\\[4pt]0,&k>n.\\end{cases}$$\n\
  \nFor (b), every weakly increasing sequence is uniquely determined by the multiplicities
  $x_1,\\ldots,x_n$ of the labels $1,\\ldots,n$. These multiplicities satisfy\n$$x_1+\\
  cdots+x_n=k,\\qquad x_i\\ge 0.$$\nBy stars and bars, the number of such multiplicity
  vectors, and therefore the number of weakly increasing sequences, is\n$$\\binom{n+k-1}{k}.$$\n\
  Thus\n$$P(\\text{increasing})=\\frac{\\binom{n+k-1}{k}}{n^k}.$$"
difficulty: 0.6
difficulty_source: llm_estimate
tags: []
hints:
  - Start by counting all possible ordered sequences of $k$ draws.
  - For strict increase, first choose which distinct labels occur; ask how many 
    increasing orders those chosen labels have.
  - For weak increase, record how many times each of the $n$ labels occurs and 
    translate the condition into a nonnegative integer equation.
  - After counting the favorable sequences in each part, divide by the number of
    equally likely ordered sequences.
