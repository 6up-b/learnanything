teach_back_source:
prompt: 'Four draws with replacement are made uniformly from three distinct source
  values x,y,z. Order is then discarded. An analyst records only the multiplicity
  histogram. Compare histogram (2,2,0) with histogram (3,1,0) for two specified occupied
  values: derive the number of ordered samples behind each, their probabilities, and
  the ratio of the first probability to the second.'
expected_answer: For specified occupied values, histogram (2,2,0) represents 
  4!/(2!2!)=6 ordered samples, while histogram (3,1,0) represents 4!/(3!1!)=4. 
  There are 3^4 equally likely ordered samples, so the probabilities are 
  6/81=2/27 and 4/81. The first-to-second ratio is 6/4=3/2.
