teach_back_source:
prompt: "Let A and B be events. The symmetric difference $A \\triangle B$ is defined
  to be the set of all elements that are in A or B but not both. In logic and engineering,
  this event is also called the XOR ( exclusive or ) of A and B . Show that\n\n$$P(A
  \\triangle B) = P(A) + P(B) - 2P(A \\cap B),$$\n\ndirectly using the axioms of probability."
expected_answer: "By definition,\n\n$$A\\triangle B=(A\\setminus B)\\cup(B\\setminus
  A).$$\n\nThe two events on the right are disjoint, so finite additivity gives\n\n\
  $$P(A\\triangle B)=P(A\\setminus B)+P(B\\setminus A).$$\n\nAlso,\n\n$$A=(A\\setminus
  B)\\cup(A\\cap B),$$\n\nwhere the union is disjoint. Therefore,\n\n$$P(A)=P(A\\\
  setminus B)+P(A\\cap B),$$\n\nand hence\n\n$$P(A\\setminus B)=P(A)-P(A\\cap B).$$\n\
  \nSimilarly, the disjoint decomposition\n\n$$B=(B\\setminus A)\\cup(A\\cap B)$$\n\
  \ngives\n\n$$P(B\\setminus A)=P(B)-P(A\\cap B).$$\n\nSubstituting these two expressions
  into the probability of the symmetric difference yields\n\n$$\\begin{aligned}\n\
  P(A\\triangle B)\n&=P(A)-P(A\\cap B)+P(B)-P(A\\cap B)\\\\\n&=P(A)+P(B)-2P(A\\cap
  B).\n\\end{aligned}$$"
