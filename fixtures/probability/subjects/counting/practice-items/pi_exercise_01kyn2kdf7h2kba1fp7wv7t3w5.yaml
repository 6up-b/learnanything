tags: []
hints:
  - 'First compute the complementary event: all $k$ birthdays are distinct. Group
    ordered birthday assignments according to the underlying set of $k$ days.'
  - In the decomposition of $e_k$, separate products that use both of the first 
    two variables, exactly one of them, or neither.
  - Pairwise averaging leaves $p_1+p_2$ unchanged. Compare only the product 
    $p_1p_2$ with the product of the two averaged coordinates.
  - After showing that averaging any unequal pair cannot increase the match 
    probability, ask what a minimizing probability vector can look like if every
    pair of its coordinates must be equal.
