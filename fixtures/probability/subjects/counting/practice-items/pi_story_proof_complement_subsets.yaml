teach_back_source:
prompt: Give a story proof of C(n,k)=C(n,n-k) using a committee and the people 
  left outside it. Specify the common underlying choices and explain why the 
  correspondence works in both directions.
expected_answer: From n labeled people, choosing a k-person committee uniquely 
  determines the n-k people left outside it. Conversely, choosing the n-k people
  outside uniquely determines the k-person committee as their complement. This 
  reversible correspondence pairs every k-subset with exactly one (n-k)-subset, 
  so the counts are equal.
