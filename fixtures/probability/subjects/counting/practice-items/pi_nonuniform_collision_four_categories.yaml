teach_back_source:
prompt: Four independent birthdays fall into four seasonal categories with 
  probabilities 0.4, 0.3, 0.2, and 0.1. Compute the probability that at least 
  two of the four birthdays share a category. Show the distinct-category 
  calculation first and then take its complement.
expected_answer: All four categories must occur for there to be no match. Each 
  ordering of the four categories has probability (0.4)(0.3)(0.2)(0.1), and 
  there are 4!=24 orderings. Thus P(no match)=24(0.4)(0.3)(0.2)(0.1)=0.0576, so 
  P(at least one match)=1-0.0576=0.9424.
