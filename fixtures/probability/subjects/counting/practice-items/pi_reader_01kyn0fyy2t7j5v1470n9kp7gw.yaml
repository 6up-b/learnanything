teach_back_source:
prompt: Why does choosing which \(n-k\) people are excluded from a committee 
  count the same possibilities as choosing the \(k\) people who are included?
expected_answer: Each choice of the \(k\) committee members uniquely determines 
  the \(n-k\) people left out, and each choice of those left out uniquely 
  determines the committee. Thus the two methods count the same committees, 
  showing that \(\binom{n}{k}=\binom{n}{n-k}\).
