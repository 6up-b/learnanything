teach_back_source:
prompt: In a repeating 60-minute elevator cycle, an upward elevator would be the
  next arrival during exactly 2 minutes of the cycle. During the other 58 
  minutes, a downward elevator would be next. If an observer arrives uniformly 
  at random during the cycle, find the probability that the next elevator is 
  upward and explain why counting one upward and one downward stop would give 
  the wrong answer.
expected_answer: The probability is 2/60 = 1/30. Random-time sampling weights 
  each outcome by the duration of the interval during which it would be next. 
  Counting one stop in each direction ignores the unequal 2-minute and 58-minute
  exposure intervals.
