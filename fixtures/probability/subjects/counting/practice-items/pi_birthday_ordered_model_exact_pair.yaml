teach_back_source:
prompt: 'In a simplified birthday model, each of three labeled people independently
  has a birthday on one of four days, with all four days equally likely. Build a counting-based
  model for the event that exactly two people share a birthday and the third has a
  different birthday. Write: (1) the elementary outcome format and total number of
  equally likely outcomes, (2) a count of the favorable outcomes with each factor
  explained, and (3) the resulting probability.'
expected_answer: Use ordered triples (d1,d2,d3) in {1,2,3,4}^3, because the 
  people are labeled and these 4^3=64 elementary outcomes are equally likely. 
  For an outcome with exactly one matching pair, choose the repeated day in 4 
  ways, choose the different day in 3 ways, and choose which one of the three 
  people has the different day in 3 ways. Thus there are 4·3·3=36 favorable 
  ordered outcomes, so the probability is 36/64=9/16.
