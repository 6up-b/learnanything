teach_back_source:
prompt: Give a story proof of binom(n,k)+binom(n,k-1)=binom(n+1,k). Name one 
  collection being counted, identify the distinguishing feature used to form the
  two cases, and explain why every object is counted exactly once.
expected_answer: Count k-person committees from n+1 people with one person 
  distinguished. If the distinguished person is absent, choose all k members 
  from the other n, giving binom(n,k). If present, choose the remaining k-1 
  members from the other n, giving binom(n,k-1). These cases are disjoint and 
  exhaustive, so their sum is binom(n+1,k).
