      quote: "For a proof using the axioms of probability, we can write $A \\cup B$
        as the union of the disjoint events A and $B \\cap A^c$. Then by the second
        axiom,\n$$P(A \\cup B) = P(A \\cup (B \\cap A^c)) = P(A) + P(B \\cap A^c).$$\n\
        So it suffices to show that $P(B \\cap A^c) = P(B) - P(A \\cap B)$. Since
        $A \\cap B$ and $B \\cap A^c$ are disjoint and their union is B, another application
        of the second axiom gives us\n$$P(A \\cap B) + P(B \\cap A^c) = P(B).$$\n\n\
        So $$P(B \\cap A^c) = P(B) - P(A \\cap B)$$, as desired.\nThe third property
        is a special case of inclusion-exclusion, a formula for finding the probability
        of a union of events when the events are not necessarily disjoint. We showed
        above that for two events A and B,\n$$P(A \\cup B) = P(A) + P(B) - P(A \\\
        cap B).$$\nFor three events, inclusion-exclusion says\n$$P(A \\cup B \\cup
        C) = P(A) + P(B) + P(C)$$$$-P(A \\cap B) - P(A \\cap C) - P(B \\cap C)$$$$+
        P(A \\cap B \\cap C).$$\nFor intuition, consider a triple Venn diagram like
        the one below."
