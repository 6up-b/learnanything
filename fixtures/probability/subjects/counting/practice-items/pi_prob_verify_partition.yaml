prompt: Events A and A^c partition a sample space S. A proposed probability 
  assignment gives P(A)=0.35 and P(A^c)=0.65. Using the definition of a 
  probability function, verify the range condition for these two events and 
  verify normalization by writing the disjoint-additivity calculation for S.
expected_answer: Both 0.35 and 0.65 lie in [0,1]. Since A∩A^c=∅ and A∪A^c=S, 
  disjoint additivity gives P(S)=P(A)+P(A^c)=0.35+0.65=1, as normalization 
  requires.
