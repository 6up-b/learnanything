teach_back_source:
prompt: "Give a story proof that\n\n$$\\sum_{k=0}^{n} \\binom{n}{k}^2 = \\binom{2n}{n},$$\n\
  \nfor all positive integers n."
expected_answer: "Consider a group of $2n$ people divided into two labeled groups,
  each containing $n$ people. Count the number of ways to choose a committee of $n$
  people.\n\nDirectly, we may choose any $n$ of the $2n$ people, so the number of
  committees is\n$$\\binom{2n}{n}.$$\n\nAlternatively, classify each committee according
  to the number $k$ of its members chosen from the first group. If exactly $k$ members
  come from the first group, they can be chosen in $\\binom{n}{k}$ ways. The remaining
  $n-k$ members must come from the second group, and they can be chosen in\n$$\\binom{n}{n-k}=\\\
  binom{n}{k}$$\nways. Thus the number of committees in this class is $\\binom{n}{k}^2$.\n\
  \nEvery committee has exactly one value of $k$, from $0$ through $n$, so these classes
  are disjoint and exhaustive. Summing their sizes gives\n$$\\sum_{k=0}^{n}\\binom{n}{k}^2.$$\n\
  Both expressions count the same collection of $n$-person committees, so\n$$\\sum_{k=0}^{n}\\\
  binom{n}{k}^2=\\binom{2n}{n}.$$"
difficulty: 0.45
difficulty_source: llm_estimate
tags: []
hints:
  - Look for a collection that can be chosen directly from $2n$ objects and also
    classified by an integer $k$.
  - Divide the $2n$ objects into two labeled groups of $n$, then choose a total 
    of $n$ objects.
  - If $k$ objects are chosen from the first group, determine how many must be 
    chosen from the second group and multiply the two counts.
