teach_back_source:
prompt: Two labeled draws are made independently with replacement from {A,B,C}, 
  each label having probability 1/3 on each draw. The order is then erased, 
  leaving one of AA, BB, CC, AB, AC, or BC. Construct a probability table for 
  these six recorded outcomes. For each probability, justify it by counting the 
  equally likely ordered pairs that produce the recorded outcome, and verify 
  that the table sums to 1.
expected_answer: The equally likely elementary outcomes are the nine ordered 
  pairs in {A,B,C}^2. AA, BB, and CC each have one ordered representative, so 
  each has probability 1/9. AB has representatives AB and BA, and similarly AC 
  and BC each have two representatives, so each distinct-label record has 
  probability 2/9. The total is 3(1/9)+3(2/9)=1. Thus the six unordered records 
  are not equally likely.
