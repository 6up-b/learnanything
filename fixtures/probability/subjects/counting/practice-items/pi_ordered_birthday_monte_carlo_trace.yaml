teach_back_source:
prompt: 'A simplified model gives each of three labeled people an independent, uniformly
  random birthday in {1,2,3,4}. Design pseudocode for a Monte Carlo estimate of the
  probability that all three birthdays are different. Your response must explain why
  one trial samples an ordered triple rather than an unordered birthday list, state
  the success test and estimator, and then apply that test to this fixed eight-trial
  trace: (1,2,3), (1,1,2), (4,2,1), (3,3,3), (2,4,3), (4,1,4), (2,3,1), (1,2,1). Report
  the trace estimate.'
expected_answer: 'One trial independently samples b1, b2, and b3 uniformly from {1,2,3,4},
  preserving which labeled person receives each value. It records success when b1,
  b2, and b3 are pairwise distinct. Repeat for N trials, keep a success counter, and
  return successes/N. Ordered triples are used because they are the equally likely
  elementary outcomes; unordered birthday lists have unequal numbers of ordered representatives.
  In the supplied trace, trials 1, 3, 5, and 7 succeed, so the estimate is 4/8=0.5.
  Example pseudocode: successes=0; repeat N times: sample b1,b2,b3 independently;
  if size(set(b1,b2,b3))=3 then successes+=1; return successes/N.'
