teach_back_source:
prompt: How many ways can 10 identical tokens be distributed among 4 labeled 
  boxes if boxes may be empty? Translate the problem into an equation and a 
  stars-and-bars string before giving the count. Explain why 4^10 answers a 
  different question.
expected_answer: The configurations correspond to nonnegative solutions of 
  x1+x2+x3+x4=10. Encode 10 stars and 3 bars, so the count is 
  binom(13,10)=binom(13,3)=286. The value 4^10 counts assignments of 10 
  distinguishable or sequentially selected tokens, retaining token-level order 
  or identity rather than only box totals.
