teach_back_source:
prompt: A group of 30 dice are thrown. What is the probability that 5 of each of
  the values 1, 2, 3, 4, 5, 6 appear?
expected_answer: "Treat the 30 dice as distinguishable, so an outcome is an ordered
  sequence of 30 values. Each die has 6 possible values, independently and with equal
  probability, giving\n\n\\[\n6^{30}\n\\]\n\nequally likely outcomes.\n\nTo count
  the favorable outcomes, choose which 5 dice show 1, then which 5 of the remaining
  dice show 2, and continue for all six values:\n\n\\[\n\\binom{30}{5}\\binom{25}{5}\\\
  binom{20}{5}\\binom{15}{5}\\binom{10}{5}\\binom{5}{5}\n=\\frac{30!}{(5!)^6}.\n\\\
  ]\n\nTherefore, the required probability is\n\n\\[\n\\boxed{\\frac{30!}{(5!)^6 6^{30}}}.\n\
  \\]"
difficulty: 0.35
difficulty_source: llm_estimate
tags: []
hints:
  - Model an outcome by recording the value shown by each of the 30 
    distinguishable dice.
  - First count all ordered sequences of 30 die values. Then count the sequences
    in which every face has a prescribed set of five positions.
  - Count the favorable position assignments by choosing five positions for one 
    face, five of the remaining positions for the next face, and continuing 
    through all six faces.
