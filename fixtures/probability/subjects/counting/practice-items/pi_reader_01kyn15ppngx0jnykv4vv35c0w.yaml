teach_back_source:
prompt: Why does inclusion–exclusion simplify so much in the matching-card game,
  and what does the winning probability approach as the number of cards grows?
expected_answer: Symmetry makes all intersections involving the same number of 
  matching events have equal probabilities, so each inclusion–exclusion level 
  becomes a binomial coefficient times one representative probability. This 
  reduces the result to an alternating factorial sum, which approaches 
  $1-1/e\approx 0.63$ as the number of cards grows.
