teach_back_source:
prompt: Five identical tokens are distributed among three labeled boxes, and 
  boxes may be empty. Determine whether stars-and-bars applies. Then compute the
  number of distributions and justify the parameters in your count.
expected_answer: Stars-and-bars applies because the tokens are interchangeable, 
  the boxes are labeled, and empty boxes are allowed. The distributions 
  correspond to nonnegative solutions of x1+x2+x3=5, so the count is 
  C(5+3-1,3-1)=C(7,2)=21.
