teach_back_source:
prompt: 'Use a fair-coin Monte Carlo model to estimate P(Heads). Write pseudocode
  that initializes an event counter, processes independent trials, updates the counter
  when Heads occurs, and returns an estimate. Then trace your procedure on this generated
  stream: H, T, H, H, T, H, T, T, H, H, T, H. Report the event count and estimate.'
expected_answer: 'Pseudocode: set hits=0; for each of N independent fair-coin trials,
  generate H or T with probability 1/2 each and increment hits when the result is
  H; return hits/N. In the supplied stream there are 7 Heads among 12 trials, so the
  estimate is 7/12≈0.583.'
