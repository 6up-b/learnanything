teach_back_source:
prompt: Draw three times with replacement and equal probabilities from {a,b,c}. 
  After order is discarded, compare the probabilities of the unordered samples 
  {a,a,a}, {a,a,b}, and {a,b,c}. Explain why the unordered samples are not 
  equally likely.
expected_answer: There are 3^3=27 equally likely ordered sequences. The three 
  unordered samples have respectively 1, 3, and 6 realizing sequences, so their 
  probabilities are 1/27, 3/27=1/9, and 6/27=2/9. Discarding order merges 
  different numbers of ordered sequences into different multiplicity outcomes.
