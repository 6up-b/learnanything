teach_back_source:
prompt: A population has four birthday categories with probabilities (0.1, 0.2, 
  0.3, 0.4). For a group of 6 independently sampled people, estimate by 
  10,000-run Monte Carlo simulation the probability that at least three people 
  share a category. Write R-style code or precise pseudocode. Your response must
  also state what one complete simulated outcome is, how the event is detected 
  in one run, and how the final estimate is formed.
expected_answer: "One complete outcome is an ordered six-tuple of category labels,
  with each coordinate independently drawn from {1,2,3,4} using probabilities (0.1,0.2,0.3,0.4).
  R-style code:\n\np <- c(0.1,0.2,0.3,0.4)\nB <- 10000\nhit <- replicate(B, {\n  b
  <- sample(1:4, 6, replace=TRUE, prob=p)\n  max(tabulate(b, nbins=4)) >= 3\n})\n\
  mean(hit)\n\nWithin each run, tabulate gives the four category counts, and max(counts)
  >= 3 detects whether some category appears at least three times. Each value in hit
  is an event indicator, so mean(hit), equivalently sum(hit)/B, estimates the desired
  probability."
