      quote: "sample(4, 3, replace=TRUE, prob=c(0.1,0.2,0.3,0.4))\nsamples three numbers
        between 1 and 4, with replacement, and with probabilities given by (0.1, 0.2,
        0.3, 0.4). If the sampling is without replacement, then at each stage the
        probability of any not-yet-chosen number is proportional to its original probability.\n\
        Generating many random samples allows us to perform a simulation for a probability
        problem. The replicate command, which is explained below, is a convenient
        way to do this.\nMatching problem simulation\nLet's show by simulation that
        the probability of a matching card in Example 1.6.4 is approximately 1 − 1/e
        when the deck is sufficiently large. Using R, we can perform the experiment
        a bunch of times and see how many times we encounter at least one matching
        card:\nn <- 100\nr <- replicate(10^4,sum(sample(n)==(1:n)))\nsum(r>=1)/10^4\n\
        In the first line, we choose how many cards are in the deck (here, 100 cards).
        In the second line, let's work from the inside out:\nsample(n)==(1:n) is a
        vector of length n, the ith element of which equals 1 if the ith card matches
        its position in the deck and 0 otherwise. That's because for two numbers a
        and b, the expression a==b is TRUE if a = b and FALSE otherwise, and TRUE
        is encoded as 1 and FALSE is encoded as 0. sum adds up the elements of the
        vector, giving us the number of matching cards in this run of the experiment.
        replicate does this 10 4 times. We store the results in r, a vector of length
        10 4 containing the numbers of matched cards from each run of the experiment.\n\
        In the last line, we add up the number of times where there was at least one
        matching card, and we divide by the number of simulations.\nTo explain what
        the code is doing within the code rather than in separate documentation, we
        can add comments using the # symbol to mark the start of a comment. Comments
        are ignored by R but can make the code much easier to understand for the reader
        (who could be you—even if you will be the only one using your code, it is
        often hard to remember what everything means and how the code is supposed
        to work when looking at it a month after writing it). Short comments can be
        on the\nsame line as the corresponding code; longer comments should be on
        separate lines. For example, a commented version of the above simulation is:\n\
        n <- 100 # number of cards\nr <- replicate(10^4,sum(sample(n)==(1:n))) # shuffle;
        count matches\nsum(r>=1)/10^4 # proportion with a match\nWhat did you get
        when you ran the code? We got 0.63, which is quite close to 1 − 1/e.\nBirthday
        problem calculation and simulation\nThe following code uses prod (which gives
        the product of a vector) to calculate the probability of at least one birthday
        match in a group of 23 people:\nk <- 23\n1-prod((365-k+1):365)/365^k\nBetter
        yet, R has built-in functions, pbirthday and qbirthday, for the birthday problem!
        pbirthday(k) returns the probability of at least one match if the room has
        k people. qbirthday(p) returns the number of people needed in order to have
        probability p of at least one match. For example, pbirthday(23) is 0.507 and
        qbirthday(0.5) is 23.\nWe can also find the probability of having at least
        one triple birthday match, i.e., three people with the same birthday; all
        we have to do is add coincident=3 to say we're looking for triple matches.
        For example, pbirthday(23,coincident=3) returns 0.014, so 23 people give us
        only a 1.4% chance of a triple birthday match. qbirthday(0.5,coincident=3)
        returns 88, so we'd need 88 people to have at least a 50% chance of at least
        one triple birthday match.\nTo simulate the birthday problem, we can use\n\
        b <- sample(1:365,23,replace=TRUE)\ntabulate(b)\nto generate random birthdays
        for 23 people and then tabulate the counts of how many people were born on
        each day (the command table(b) creates a prettier table, but is slower). We
        can run 10 4 repetitions as follows:\nr <- replicate(10^4, max(tabulate(sample(1:365,23,replace=TRUE))))\n\
        sum(r>=2)/10^4\nIf the probabilities of various days are not all equal, the
        calculation becomes much more difficult, but the simulation can easily be
        extended since sample allows us to specify the probability of each day (by
        default sample assigns equal probabilities, so in the above the probability
        is 1/365 for each day)."
