teach_back_source:
prompt: Three independent birthdays use category probabilities p1,...,pn. Derive
  the probability that all three birthdays differ in terms of e3(p1,...,pn). 
  Then explain how replacing two unequal probabilities x and y by their average 
  affects the no-match probability and hence the collision probability.
expected_answer: For each unordered triple of distinct categories, there are 3! 
  orders, so P(all distinct)=3!e3(p1,...,pn). In the expansion of e3, terms 
  using neither x nor y are unchanged; terms using exactly one depend only on 
  x+y and are unchanged; terms using both contain xy, which weakly increases to 
  ((x+y)/2)^2 by AM–GM. Thus the no-match probability does not decrease, so the 
  collision probability does not increase. Repeating equalization reaches the 
  uniform vector, which minimizes collision probability.
