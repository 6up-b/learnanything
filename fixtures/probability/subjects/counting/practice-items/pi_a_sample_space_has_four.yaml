prompt: 'A sample space has four distinct outcomes: S = {a, b, c, d}. How many different
  events are possible? Explain the count in terms of the choice made for each outcome,
  and include the two extreme events in your explanation.'
expected_answer: There are 2^4 = 16 events. For each of the four outcomes there 
  are two independent choices—include it in the subset or exclude it. The count 
  includes the empty event and the full event S.
