teach_back_source:
prompt: Let A, B, and C be events. Write an expression for exactly one of A, B, 
  and C occurring. Then use De Morgan's law to rewrite the event that none of A,
  B, and C occurs.
expected_answer: 'Exactly one occurs: (A ∩ B^c ∩ C^c) ∪ (A^c ∩ B ∩ C^c) ∪ (A^c ∩ B^c
  ∩ C). None occurs: (A ∪ B ∪ C)^c = A^c ∩ B^c ∩ C^c.'
