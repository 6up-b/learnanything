teach_back_source:
prompt: Design language-neutral pseudocode for a Monte Carlo estimate of the 
  probability that two independent fair six-sector spinners, labeled A and B, 
  sum to 11. Specify how one trial is generated, the event indicator, the 
  accumulator, and the returned estimate.
expected_answer: 'Set hits=0. Repeat N times: independently draw A and B uniformly
  from {1,…,6}; if A+B=11, add 1 to hits. Return hits/N. Labeling the spinners preserves
  the distinct favorable outcomes (5,6) and (6,5), and independent uniform draws reproduce
  the 36 equally likely ordered outcomes.'
