teach_back_source:
prompt: A learner counts unordered pairs chosen with replacement from 8 types by
  computing 8^2/2. Explain why this division is invalid. Then state the correct 
  count and justify it.
expected_answer: Distinct pairs have two ordered representations, but repeated 
  pairs have only one, so the overcounting factor is not uniformly 2. The 
  correct multiset count is binom(8+2-1,2)=binom(9,2)=36; equivalently, count 8 
  repeated pairs and binom(8,2)=28 distinct pairs.
