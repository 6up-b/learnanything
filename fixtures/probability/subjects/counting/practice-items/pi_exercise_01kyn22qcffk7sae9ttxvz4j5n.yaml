teach_back_source:
prompt: A fair die is rolled n times. What is the probability that at least 1 of
  the 6 values never appears?
expected_answer: "Let \\(A_i\\) be the event that value \\(i\\) never appears, for
  \\(i=1,\\ldots,6\\). The desired event is \\(A_1\\cup\\cdots\\cup A_6\\).\n\nFor
  any particular set of \\(k\\) values, the probability that all \\(k\\) values are
  absent is\n\\[\n\\left(\\frac{6-k}{6}\\right)^n,\n\\]\nsince every roll must be
  one of the remaining \\(6-k\\) values. There are \\(\\binom{6}{k}\\) ways to choose
  the absent values. Thus, by inclusion-exclusion,\n\\[\n\\boxed{\\Pr(A_1\\cup\\cdots\\
  cup A_6)=\\sum_{k=1}^{6}(-1)^{k+1}\\binom{6}{k}\\left(\\frac{6-k}{6}\\right)^n.}\n\
  \\]\nEquivalently,\n\\[\n\\boxed{1-\\frac{1}{6^n}\\sum_{k=0}^{6}(-1)^k\\binom{6}{k}(6-k)^n.}\n\
  \\]\nThe formulas also correctly give probability \\(1\\) when \\(n<6\\), because
  fewer than six rolls cannot display all six values."
difficulty: 0.45
difficulty_source: llm_estimate
tags: []
hints:
  - For each face value, define an event that this value is absent from all n 
    rolls.
  - The requested event is a union of six overlapping events, so account for 
    their intersections with inclusion-exclusion.
  - If a particular set of k face values is forbidden, each roll has 6-k allowed
    outcomes. Then count how many such sets of k values there are.
