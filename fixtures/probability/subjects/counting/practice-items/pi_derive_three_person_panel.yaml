teach_back_source:
prompt: Seven labeled researchers are available for a three-person panel with no
  roles. Begin by counting ordered selections, determine the exact number of 
  ordered representations of each panel, and derive the number of panels.
expected_answer: There are 7·6·5=210 ordered selections without replacement. 
  Each unordered three-person panel has 3!=6 orderings, uniformly. Dividing 
  gives 210/6=35, which is C(7,3).
