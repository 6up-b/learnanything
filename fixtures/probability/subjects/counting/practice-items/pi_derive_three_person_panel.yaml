      locator: span:ext_01KYMSJJNJQ0W9QHZ9ZMFD88NY/s100
      quote: "FIGURE 1.4\nTree diagram for choosing an ice cream cone. Regardless
        of whether the type of cone or the flavor is chosen first, there are $2 \\
        cdot 3 = 3 \\cdot 2 = 6$ possibilities.\nBy the multiplication rule, there
        are 2 · 3 = 6 possibilities. This is a very simple example, but is worth thinking
        through in detail as a foundation for thinking about and visualizing more
        complicated examples. Soon we will encounter examples where drawing the tree
        in a legible size would take up more space than exists in the known universe,
        yet where conceptually we can still think in terms of the ice cream example.
        Some things to note:\n1. It doesn't matter whether you choose the type of
        cone first (\"I'd like a waffle cone with chocolate ice cream\") or the flavor
        first (\"I'd like chocolate ice cream on a waffle cone\"). Either way, there
        are 2 · 3 = 3 · 2 = 6 possibilities. 2. It doesn't matter whether the same
        flavors are available on a cake cone as on a waffle cone. What matters is
        that there are exactly 3 flavor choices for each cone choice. If for some
        strange reason it were forbidden to have chocolate ice cream on a waffle cone,
        with no substitute flavor available (aside from vanilla and strawberry), there
        would be 3 + 2 = 5 possibilities and the multiplication rule wouldn't apply.
        In larger examples, such complications could make counting the number of possibilities
        vastly more difficult.\nNow suppose you buy two ice cream cones on a certain
        day, one in the afternoon and the other in the evening. Write, for example,
        (cakeC, waffleV) to mean a cake cone with chocolate in the afternoon, followed
        by a waffle cone with vanilla in the evening. By the multiplication rule,
        there are 6 2 = 36 possibilities in your delicious compound experiment.\n\
        But what if you're only interested in what kinds of ice cream cones you had
        that day, not the order in which you had them, so you don't want to distinguish,
        for example, between (cakeC, waffleV) and (waffleV, cakeC)? Are there now
        36/2 = 18 possibilities? No, since possibilities like (cakeC, cakeC) were
        already only listed once each. There are 6 · 5 = 30 ordered possibilities
        (x, y) with x 6= y, which turn into 15 possibilities if we treat (x, y) as
        equivalent to (y, x), plus 6 possibilities of the form (x, x), giving a total
        of 21 possibilities. Note that if the 36 original ordered pairs (x, y) are
        equally likely, then the 21 possibilities here are not equally likely.\nExample
        1.4.6 (Subsets). A set with n elements has 2 n subsets, including the empty
        set ∅ and the set itself. This follows from the multiplication rule since
        for each element, we can choose whether to include it or exclude it. For example,
        the set {1, 2, 3} has the 8 subsets ∅, {1}, {2}, {3}, {1, 2}, {1, 3}, {2,
        3}, {1, 2, 3}. This result explains why in Example 1.2.3 there are 2 52 events
        that can be defined.\nWe can use the multiplication rule to arrive at formulas
        for sampling with and without replacement. Many experiments in probability
        and statistics can be interpreted in one of these two contexts, so it is appealing
        that both formulas follow directly from the same basic counting principle.\n\
        Theorem 1.4.7 (Sampling with replacement). Consider n objects and making k
        choices from them, one at a time with replacement (i.e., choosing a certain
        object does not preclude it from being chosen again). Then there are n k possible
        outcomes\n(where order matters, in the sense that, e.g., choosing object 3
        and then object 7 is counted as a different outcome than choosing object 7
        and then object 3.)\nFor example, imagine a jar with n balls, labeled from
        1 to n. We sample balls one at a time with replacement, meaning that each
        time a ball is chosen, it is returned to the jar. Each sampled ball is a sub-experiment
        with n possible outcomes, and there are k sub-experiments. Thus, by the multiplication
        rule there are $n^k$ ways to obtain a sample of size k."
