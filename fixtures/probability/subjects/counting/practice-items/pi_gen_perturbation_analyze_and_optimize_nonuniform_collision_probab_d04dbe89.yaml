teach_back_source:
prompt: "In a model of nonuniform birthday collisions, four independent people are
  assigned to four birth regions. Compare the collision probability under the probability
  vectors\n\n\\[\np=(0.45,0.15,0.25,0.15) \\quad\\text{and}\\quad q=(0.35,0.25,0.25,0.15).\n\
  \\]\n\nA collision means that at least two people occupy the same region. Determine
  which vector gives the larger collision probability and justify the comparison using
  the elementary-symmetric-polynomial expression for distinct outcomes. This is a
  partial transfer between two coordinates, not a replacement by their exact average."
expected_answer: "For four people and four regions, the no-collision probability is
  \\(4!e_4=24p_1p_2p_3p_4\\). Thus\n\\[\nP_p(\\text{no collision})=24(0.45)(0.15)(0.25)(0.15)=0.06075,\n\
  \\]\nwhile\n\\[\nP_q(\\text{no collision})=24(0.35)(0.25)(0.25)(0.15)=0.07875.\n\
  \\]\nTherefore \\(P_p(\\text{collision})=0.93925\\) and \\(P_q(\\text{collision})=0.92125\\
  ), so \\(p\\) gives the larger collision probability. The transfer raises the product
  of the changed coordinates while preserving their sum, increasing the distinct-outcome
  probability."
