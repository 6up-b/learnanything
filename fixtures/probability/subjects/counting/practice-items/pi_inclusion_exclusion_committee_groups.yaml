teach_back_source:
prompt: A club has two seniors, two juniors, and two sophomores. How many 
  three-person committees contain at least one member from every class year? 
  Define a bad event for each missing class year and carry out 
  inclusion-exclusion from the set of all three-person committees.
expected_answer: There are C(6,3)=20 committees. For each class year, the event 
  that it is missing has C(4,3)=4 committees. A committee of size three cannot 
  be formed after two class years are both excluded because only two people 
  remain, so every pairwise and triple intersection has size 0. Therefore the 
  valid count is 20-3·4=8.
