      quote: "The owner of this certificate can redeem it for $1000 if A occurs. No
        value if A does not occur, except as required by federal, state, or local
        law. No expiration date.\nLikewise, Arby is willing to sell such a certificate
        at the same price. Indeed, Arby is willing to buy or sell any number of certificates
        at this price, as Arby considers it the \"fair\" price.\nArby stubbornly refuses
        to accept the axioms of probability. In particular, suppose that there are
        two disjoint events A and B with\n$$P_{\\text{Arby}}(A \\cup B) \\neq P_{\\
        text{Arby}}(A) + P_{\\text{Arby}}(B).$$\nShow how to make Arby go bankrupt,
        by giving a list of transactions Arby is willing to make that will guarantee
        that Arby will lose money (you can assume it will be known whether A occurred
        and whether B occurred the day after any certificates are bought/sold).\n\
        Inclusion-exclusion\n49. A fair die is rolled n times. What is the probability
        that at least 1 of the 6 values never appears? 50. s A card player is dealt
        a 13-card hand from a well-shuffled, standard deck of cards. What is the probability
        that the hand is void in at least one suit (\"void in a suit\" means having
        no cards of that suit)? 51. s For a group of 7 people, find the probability
        that all 4 seasons (winter, spring, summer, fall) occur at least once each
        among their birthdays, assuming that all seasons are equally likely. 52. A
        certain class has 20 students, and meets on Mondays and Wednesdays in a classroom
        with exactly 20 seats. In a certain week, everyone in the class attends both
        days. On both days, the students choose their seats completely randomly (with
        one student per seat). Find the probability that no one sits in the same seat
        on both days of that week. 53. Fred needs to choose a password for a certain
        website. Assume that he will choose an 8-character password, and that the
        legal characters are the lowercase letters a, b, c, . . . , z, the uppercase
        letters A, B, C, . . . , Z, and the numbers 0, 1, . . . , 9. (a) How many
        possibilities are there if he is required to have at least one lowercase letter
        in his password? (b) How many possibilities are there if he is required to
        have at least one lowercase letter and at least one uppercase letter in his
        password? (c) How many possibilities are there if he is required to have at
        least one lowercase letter, at least one uppercase letter, and at least one
        number in his password?\n54. s Alice attends a small college in which each
        class meets only once a week. She is deciding between 30 non-overlapping classes.
        There are 6 classes to choose from for each day of the week, Monday through
        Friday. Trusting in the benevolence of randomness, Alice decides to register
        for 7 randomly selected classes out of the 30, with all choices equally likely.
        What is the probability that she will have classes every day, Monday through
        Friday? (This problem can be done either directly using the naive definition
        of probability, or using inclusion-exclusion.) 55. A club consists of 10 seniors,
        12 juniors, and 15 sophomores. An organizing committee of size 5 is chosen
        randomly (with all subsets of size 5 equally likely). (a) Find the probability
        that there are exactly 3 sophomores in the committee. (b) Find the probability
        that the committee has at least one representative from each of the senior,
        junior, and sophomore classes.\nMixed practice\n56. For each part, decide
        whether the blank should be filled in with =, , and give a clear explanation.
        In (a) and (b), order doesn't matter.\n(a) (number of ways to choose 5 people
        out of 10) (number of ways to choose 6 people out of 10) (b) (number of ways
        to break 10 people into 2 teams of 5) (number of ways to break 10 people into
        a team of 6 and a team of 4) (c) (probability that all 3 people in a group
        of 3 were born on January 1) (probability that in a group of 3 people, 1 was
        born on each of January 1, 2, and 3)\nMartin and Gale play an exciting game
        of \"toss the coin\", where they toss a fair coin until the pattern HH occurs
        (two consecutive Heads) or the pattern T H occurs (Tails followed immediately
        by Heads). Martin wins the game if and only if HH occurs before T H occurs."
