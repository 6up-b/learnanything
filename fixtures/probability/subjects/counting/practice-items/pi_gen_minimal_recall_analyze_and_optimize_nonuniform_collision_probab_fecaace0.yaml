teach_back_source:
prompt: In the urn-label version of “Analyze and Optimize Nonuniform Collision 
  Probability,” two label probabilities are replaced by their common average 
  while their sum stays fixed. From memory, what happens to the probability of 
  at least one repeated label?
expected_answer: The repeat probability cannot increase; it decreases when the 
  two probabilities are unequal and the relevant distinct-label terms are 
  nonzero. Averaging increases their product while preserving their sum, which 
  increases the elementary-symmetric no-repeat probability.
