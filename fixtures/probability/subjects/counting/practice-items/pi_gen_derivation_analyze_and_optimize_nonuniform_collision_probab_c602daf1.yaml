teach_back_source:
prompt: In studying “Analyze and Optimize Nonuniform Collision Probability,” 
  suppose each of k independent birthdays falls into one of n labeled date 
  groups with probabilities q₁,…,qₙ, where 2 ≤ k ≤ n. First name the strategy 
  you will use. Then derive the no-match and at-least-one-match probabilities 
  using an elementary symmetric polynomial. Finally, choose two group 
  probabilities a and b, replace both by (a+b)/2 while leaving the others fixed,
  and derive how this replacement changes each probability. Show the 
  intermediate decomposition that isolates a, b, and the remaining n−2 
  probabilities, and state when the comparison is strict.
expected_answer: "Strategy: compute the complement by summing over sets of k distinct
  groups, then analyze pairwise averaging. For each unordered k-set, its probability
  over all k! assignments is k! times the product of its probabilities, so\n\nP(no
  match)=k!e_k(q₁,…,qₙ),\nP(at least one match)=1−k!e_k(q₁,…,qₙ).\n\nWriting z for
  the other n−2 probabilities,\ne_k(a,b,z)=ab e_{k−2}(z)+(a+b)e_{k−1}(z)+e_k(z).\n\
  After replacing a,b by m=(a+b)/2, only the first term changes. Since\nm²−ab=(a−b)²/4≥0,\n\
  e_k(m,m,z)−e_k(a,b,z)=((a−b)²/4)e_{k−2}(z)≥0.\nThus averaging cannot decrease the
  no-match probability and cannot increase the collision probability. The comparison
  is strict when a≠b and e_{k−2}(z)>0."
