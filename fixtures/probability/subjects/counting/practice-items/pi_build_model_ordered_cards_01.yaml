teach_back_source:
prompt: Five distinct cards labeled A, B, C, D, and E are thoroughly shuffled. 
  Record the first card and then the second card, preserving order. Build a 
  counting-based model for the event E that both recorded cards belong to 
  {A,B,C}. Write structured steps that (1) define an elementary outcome, (2) 
  justify why the elementary outcomes are equally likely, (3) count the sample 
  space and E, and (4) compute P(E).
expected_answer: An elementary outcome is an ordered pair (x,y) of distinct card
  labels. A thorough shuffle makes every complete deck order equally likely, and
  each ordered pair occurs as the first two cards in the same number, 3!, of 
  complete orders, so the 5×4=20 pairs are equally likely. For E, choose the 
  first card from {A,B,C} in 3 ways and the second as a different member in 2 
  ways, giving |E|=6. Therefore P(E)=6/20=3/10.
