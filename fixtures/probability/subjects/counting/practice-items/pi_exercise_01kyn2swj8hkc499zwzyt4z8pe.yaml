variant_contract:
teach_back_source:
prompt: "Show that for all positive integers $n$ and $k$ with $n$ ≥ $k$ ,\n\n$$\\\
  binom{n}{k} + \\binom{n}{k-1} = \\binom{n+1}{k},$$\n\ndoing this in two ways: (a)
  algebraically and (b) with a story, giving an interpretation for why both sides
  count the same thing.\n\nHint for the story proof: Imagine an organization consisting
  of $n + 1$ people, with one of them pre-designated as the president of the organization."
expected_answer: "Algebraically,\n\n$$\n\\begin{aligned}\n\\binom{n}{k}+\\binom{n}{k-1}\n\
  &=\\frac{n!}{k!(n-k)!}+\\frac{n!}{(k-1)!(n-k+1)!}\\\\\n&=\\frac{n!(n-k+1)}{k!(n-k+1)!}+\\\
  frac{n!k}{k!(n-k+1)!}\\\\\n&=\\frac{n!((n-k+1)+k)}{k!(n-k+1)!}\\\\\n&=\\frac{(n+1)!}{k!(n+1-k)!}\\\
  \\\n&=\\binom{n+1}{k}.\n\\end{aligned}\n$$\n\nFor a story proof, consider an organization
  of $n+1$ people, one of whom is the president. Count the possible committees of
  exactly $k$ people.\n\nDirectly, there are $\\binom{n+1}{k}$ such committees. Alternatively,
  divide the committees into two disjoint cases. If the president is not on the committee,
  all $k$ members are chosen from the other $n$ people, giving $\\binom{n}{k}$ committees.
  If the president is on the committee, the remaining $k-1$ members are chosen from
  the other $n$ people, giving $\\binom{n}{k-1}$ committees.\n\nEvery $k$-person committee
  belongs to exactly one of these two cases, so\n\n$$\\binom{n}{k}+\\binom{n}{k-1}=\\\
  binom{n+1}{k}.$$"
difficulty: 0.42
difficulty_source: llm_estimate
tags: []
hints:
  - Treat the algebraic and story arguments as two separate proofs of the same 
    identity.
  - For the algebraic proof, expand both terms on the left using factorials and 
    rewrite them with a common denominator.
  - For the story proof, count all k-person committees from the organization, 
    separating them according to whether the president is a member.
  - In the president-included case, only the other k−1 committee members remain 
    to be chosen; in the excluded case, all k members come from the other n 
    people.
