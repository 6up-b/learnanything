teach_back_source:
prompt: 'For each situation, select a counting method and justify the distinction:
  (a) distribute 10 identical tokens among 4 labeled boxes with every box receiving
  at least one; (b) distribute 10 individually numbered tokens among 4 labeled boxes
  with every box receiving at least one. Compute (a), and give a correct exact expression
  for (b).'
expected_answer: 'For (a), set yi=xi-1, so y1+...+y4=6 with yi≥0; stars and bars gives
  binom(9,3)=84. For (b), stars and bars is invalid because the tokens are distinguishable.
  Count onto functions by inclusion–exclusion: 4^10-4·3^10+6·2^10-4.'
