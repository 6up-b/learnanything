teach_back_source:
prompt: For a concrete case of “Analyze and Optimize Nonuniform Collision 
  Probability,” three independent birthdays are assigned to four calendar bins. 
  Compare the distributions p=(1/2, 1/4, 1/8, 1/8) and r=(3/8, 3/8, 1/8, 1/8). 
  Before doing any arithmetic, name the derivation strategy you will use. Then 
  derive the probability of at least one shared bin under each distribution from
  the distinct-bin cases, showing the elementary-symmetric-polynomial step and 
  all intermediate numerical work. Conclude which distribution has the smaller 
  collision probability and explain what structural change between p and r 
  drives the comparison.
expected_answer: "Strategy: calculate the probability of three distinct bins and take
  its complement. Each unordered triple of bins has 3! orderings, so P(no match)=6e₃.\n\
  \nFor p,\ne₃(p)=2(1/2·1/4·1/8)+(1/2·1/8·1/8)+(1/4·1/8·1/8)\n=2/128+1/128+1/256=11/256.\n\
  Hence P(no match|p)=66/256=33/128 and P(collision|p)=95/128.\n\nFor r,\ne₃(r)=2(3/8·3/8·1/8)+2(3/8·1/8·1/8)\n\
  =18/512+6/512=3/64.\nHence P(no match|r)=18/64=9/32 and P(collision|r)=23/32=92/128.\n\
  \nTherefore r has the smaller collision probability. It is obtained by averaging
  the unequal first two probabilities while preserving their sum, which increases
  e₃ and therefore increases the probability of distinct bins."
