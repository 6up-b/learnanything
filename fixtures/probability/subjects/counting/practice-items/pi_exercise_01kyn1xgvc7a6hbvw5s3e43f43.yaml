hints:
  - Consider first the complementary event in which every person’s phone number 
    is stored in a different location.
  - Count complete assignments while keeping the people distinct and in a fixed 
    order.
  - For a collision-free assignment, determine how many locations remain 
    available for each successive person, then divide by the total number of 
    assignments.
  - Subtract the collision-free probability from 1, and separately consider what
    must happen when there are more people than locations.
