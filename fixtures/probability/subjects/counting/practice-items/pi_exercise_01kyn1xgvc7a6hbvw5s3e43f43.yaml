variant_contract:
teach_back_source:
prompt: A hash table is a commonly used data structure in computer science, 
  allowing for fast information retrieval. For example, suppose we want to store
  some people's phone numbers. Assume that no two of the people have the same 
  name. For each name x, a hash function h is used, letting h(x) be the location
  that will be used to store x's phone number. After such a table has been 
  computed, to look up x's phone number one just recomputes h(x) and then looks 
  up what is stored in that location. The hash function h is deterministic, 
  since we don't want to get different results every time we compute h(x). But h
  is often chosen to be pseudorandom . For this problem, assume that true 
  randomness is used. Let there be k people, with each person's phone number 
  stored in a random location (with equal probabilities for each location, 
  independently of where the other people's numbers are stored), represented by 
  an integer between 1 and n. Find the probability that at least one location 
  has more than one phone number stored there.
expected_answer: "Let \\(C\\) be the event that at least one location receives more
  than one phone number. It is easier to count the complementary event \\(C^c\\),
  in which all \\(k\\) people are assigned to distinct locations.\n\nEach person independently
  has \\(n\\) possible locations, so there are \\(n^k\\) equally likely ordered assignments
  in total. If \\(k\\le n\\), an assignment with no collision has \\(n\\) choices
  for the first person, \\(n-1\\) for the second, and so on, giving\n\\[\nn(n-1)\\\
  cdots(n-k+1)=\\frac{n!}{(n-k)!}\n\\]\ncollision-free assignments. Therefore,\n\\\
  [\nP(C)=1-P(C^c)=1-\\frac{n(n-1)\\cdots(n-k+1)}{n^k}\n=1-\\frac{n!}{(n-k)!n^k},\\
  qquad k\\le n.\n\\]\nEquivalently, this is\n\\[\n1-\\prod_{j=0}^{k-1}\\left(1-\\\
  frac{j}{n}\\right).\n\\]\nIf \\(k>n\\), the pigeonhole principle guarantees that
  at least two people are assigned to the same location, so \\(P(C)=1\\)."
