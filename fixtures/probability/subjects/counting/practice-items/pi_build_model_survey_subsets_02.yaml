teach_back_source:
prompt: A survey draws two different people from {A,B,C,D,E} in sequence, 
  uniformly among the people not yet drawn, but the recorded sample is the 
  unordered two-person set. Build the probability model for the recorded 
  samples. Show how ordered draw records aggregate into recorded outcomes, 
  establish whether the recorded outcomes are equally likely, and compute the 
  probability that A is included.
expected_answer: 'There are 5×4=20 equally likely ordered draw records. Each unordered
  recorded sample {x,y} is represented by exactly two ordered records, (x,y) and (y,x).
  Because this multiplicity is the same for every pair, counting each aggregate outcome
  once gives 20/2=10 equally likely recorded samples. Four contain A: {A,B}, {A,C},
  {A,D}, and {A,E}. Thus P(A is included)=4/10=2/5.'
