teach_back_source:
prompt: 'From 10 people, form a 4-person committee and designate one committee member
  as captain. Write and evaluate two counts: first choose the committee and then its
  captain; then choose the captain and the remaining members. For every binomial coefficient,
  state exactly which subset it counts.'
expected_answer: 'Choosing the committee first gives C(10,4)·4=210·4=840: C(10,4)
  counts the 4-person subset, and 4 chooses its captain. Choosing the captain first
  gives 10·C(9,3)=10·84=840: 10 chooses the captain, and C(9,3) counts the 3-person
  subset of noncaptains selected from the remaining nine.'
