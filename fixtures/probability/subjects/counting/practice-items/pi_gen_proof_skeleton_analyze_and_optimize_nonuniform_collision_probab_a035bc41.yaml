teach_back_source:
prompt: A conference records nonuniform birthday probabilities 
  \(p_1,\ldots,p_n\), and \(k\) attendees are sampled independently. Two day 
  probabilities, \(p_a=x\) and \(p_b=y\), are replaced by their common average 
  while every other probability remains fixed. For the analysis of nonuniform 
  birthday collision probability, give an ordered proof skeleton that determines
  how this replacement changes the probability of at least one shared birthday. 
  Include the claim, the event handled first, its 
  elementary-symmetric-polynomial expression, the decomposition that isolates 
  \(x\) and \(y\), the inequality used, and the final implication. State when 
  the comparison is strict.
expected_answer: "1. Let \\(N\\) be the event that all \\(k\\) birthdays are distinct;
  then \\(P(N\\mid p)=k!e_k(p)\\), so \\(P(\\text{collision}\\mid p)=1-k!e_k(p)\\\
  ).\n2. With \\(z\\) denoting the other probabilities,\n\\[\ne_k(x,y,z)=xy\\,e_{k-2}(z)+(x+y)e_{k-1}(z)+e_k(z).\n\
  \\]\n3. Averaging preserves \\(x+y\\), while AM-GM gives \\(((x+y)/2)^2\\ge xy\\
  ). All coefficients are nonnegative, hence averaging cannot decrease \\(e_k\\).\n\
  4. Therefore averaging cannot decrease \\(P(N)\\) and cannot increase the collision
  probability.\n5. The comparison is strict when \\(x\\ne y\\) and \\(e_{k-2}(z)>0\\
  ); otherwise equality can occur."
