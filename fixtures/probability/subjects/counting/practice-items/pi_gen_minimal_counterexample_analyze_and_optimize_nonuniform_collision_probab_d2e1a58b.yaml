teach_back_source:
prompt: The elementary-symmetric-polynomial analysis in “Analyze and Optimize 
  Nonuniform Collision Probability” uses a category-probability vector to 
  determine the no-match probability. Give a minimal birthday model in which 
  every person has the same stated marginal category probabilities but that 
  vector does not determine the correct no-match probability. Specify the joint 
  behavior and compare the actual result with the value obtained from the 
  elementary-symmetric expression.
expected_answer: 'Two people and two categories are enough. Let each person have marginal
  probabilities `(1/2, 1/2)`, but make their birthdays perfectly correlated: they
  choose category 1 together with probability `1/2` and category 2 together with probability
  `1/2`. The actual no-match probability is `0`, whereas the independent formula gives
  `2!e_2(1/2,1/2)=1/2`. The formula fails because common marginals do not imply independence.'
