teach_back_source:
prompt: 'Prove C(n,k)=C(n,n-k) without factorial algebra by using length-n binary
  strings. Your proof must: (1) define the collection represented by strings with
  exactly k ones, (2) describe a reversible transformation of each such string, (3)
  interpret the transformed collection with a binomial coefficient, and (4) explain
  why reversibility establishes the identity.'
expected_answer: Let the collection be all length-n binary strings with exactly 
  k ones. Choosing the k positions containing ones shows that this collection 
  has size C(n,k). Replace every 0 by 1 and every 1 by 0. The resulting string 
  has exactly n-k ones, so the transformed collection has size C(n,n-k). 
  Complementing twice returns the original string, making this transformation a 
  bijection. Therefore the two binomial coefficients count collections in 
  one-to-one correspondence and are equal.
