teach_back_source:
prompt: Design pseudocode or R-style code to estimate the probability that a 
  random permutation of 100 labeled cards has at least one positional match. 
  Explain what one run returns, how the estimate is formed, and why a result 
  near 0.63 is plausible rather than guaranteed.
expected_answer: 'For each run, generate a uniform permutation p of 1:100, compare
  p elementwise with 1:100, and record I=sum(p==1:100)>=1. Repeat many times and average
  I. For example: hits <- replicate(10000, sum(sample(100)==1:100)>=1); mean(hits).
  One run returns a Boolean event indicator; the mean estimates the event probability.
  Values near 1-1/e≈0.632 are plausible, but the exact output varies because it is
  a finite random simulation.'
