teach_back_source:
prompt: 'Two labeled fair four-sector wheels each show 1, 2, 3, or 4. An analyst replaces
  ordered results by unordered pairs and then assigns equal probability to the ten
  unordered pairs. Audit this model: show the multiplicities of diagonal and off-diagonal
  aggregates, repair the probability model, and find the probability that the wheels
  match.'
expected_answer: 'There are 16 equally likely labeled ordered outcomes. Each diagonal
  aggregate {i,i} has one ordered realization, while each off-diagonal aggregate {i,j}
  has two: (i,j) and (j,i). Thus the ten aggregates are not equally likely. Keeping
  the 16 ordered outcomes, or weighting aggregates by multiplicity, gives four matching
  outcomes and probability 4/16=1/4.'
