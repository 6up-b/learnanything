teach_back_source:
prompt: Two independent fair spinners are labeled A and B, and each shows 1, 2, 
  or 3. Build a counting-based probability model for the event that their 
  numbers differ by exactly 1. Write the elementary outcomes, identify the 
  favorable outcomes, and compute the probability.
expected_answer: Use the nine equally likely ordered outcomes (A,B) in 
  {1,2,3}×{1,2,3}. The favorable outcomes are (1,2), (2,1), (2,3), and (3,2), so
  the probability is 4/9.
