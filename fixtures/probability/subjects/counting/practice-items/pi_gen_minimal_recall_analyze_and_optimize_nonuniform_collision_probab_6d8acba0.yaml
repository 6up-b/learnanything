teach_back_source:
prompt: From memory, in “Analyze and Optimize Nonuniform Collision Probability,”
  what formula gives the probability that at least one match occurs among $k$ 
  independent outcomes with category probabilities $p_1,\ldots,p_n$?
expected_answer: $P(\text{at least one match})=1-k!\,e_k(p_1,\ldots,p_n)$, 
  because $k!e_k(p_1,\ldots,p_n)$ is the total probability that all $k$ outcomes
  occupy distinct categories.
