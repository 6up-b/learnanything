  - id: facet_to_translate_a_verbal_compound_event_identify_th
    title:
    aliases:
      - verbal-to-symbolic event translation
    description:
    tags: []
    concept_id: concept_event_operations
    kind: procedure_contract
    claim: To translate a verbal compound event, identify the basic events, map 
      at-least-one conditions to unions, simultaneous conditions to 
      intersections, and nonoccurrence to complements, then check the resulting 
      subset against the verbal condition.
    preconditions:
      - The sample space and basic events are defined.
      - A verbal event description is supplied.
    postconditions:
      - An equivalent set expression is produced and checked.
    applicability:
      - Repeated trials and other experiments with named basic events.
    positive_examples:
      - At least two consecutive Heads in ten flips is the union of the 
        adjacent-pair intersections.
    negative_examples:
      - Omitting one of the possible qualifying cases from an exactly-one 
        expression.
    non_goals:
      - Computing a probability after the event is represented.
    error_signatures:
      - A qualifying case is omitted.
      - An outcome that violates the verbal condition is included.
    instructional_repairs:
      - Test representative outcomes that satisfy and violate each clause of the
        description.
    status: reviewed
    version: 1
    semantic_fingerprint: sf_5bee9e29a02e9226
