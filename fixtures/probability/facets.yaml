  - id: facet_for_a_finite_family_of_events_compute_the_union_
    title:
    aliases:
      - finite inclusion-exclusion
    description:
    tags: []
    concept_id: concept_inclusion_exclusion
    kind: procedure_contract
    claim: For a finite family of events, compute the union probability by 
      adding single-event probabilities, subtracting pairwise intersections, 
      adding triple intersections, and continuing with alternating signs through
      the full intersection.
    preconditions:
      - A finite collection of events is specified.
      - The required intersection probabilities can be determined.
    postconditions:
      - Every outcome in the union is counted exactly once.
    applicability:
      - Finite unions of possibly overlapping events.
    positive_examples:
      - Position-matching events in a uniformly shuffled deck.
    negative_examples:
      - Stopping after subtracting pairwise intersections for three events.
      - Using direct additivity for overlapping events.
    non_goals:
      - Claiming inclusion-exclusion is always the most efficient first method.
    error_signatures:
      - Omits an intersection size.
      - Uses the wrong alternating sign.
      - Treats overlapping component events as disjoint.
    instructional_repairs:
      - Track how many times each region has been counted.
      - Group equal intersection terms by size when symmetry permits.
    status: reviewed
    version: 1
    semantic_fingerprint: sf_b6cce72ed16b28ef
