  - id: facet_a_combinatorial_story_proof_establishes_an_ident
    title:
    aliases:
      - proof by interpretation
    description:
    tags: []
    concept_id: concept_combinatorial_story_proofs
    kind: procedure_contract
    claim: A combinatorial story proof establishes an identity by identifying 
      one finite collection, counting that same collection in the manner 
      represented by each side, and verifying that both counts use the intended 
      multiplicity.
    preconditions:
      - Both expressions admit interpretations as counts of the same collection.
    postconditions:
      - Equality follows from the two valid counts of one collection.
    applicability:
      - Binomial identities and alternative formulas for one combinatorial 
        family.
    positive_examples:
      - Choosing a committee directly or by the number chosen from one group.
      - Choosing included members or the complementary excluded members.
    negative_examples:
      - Two narratives that count different collections.
      - A case split whose cases overlap or omit possibilities.
    non_goals:
      - Merely expanding factorials without a shared counting interpretation.
    error_signatures:
      - Does not name the common collection.
      - Uses overlapping or incomplete cases.
    instructional_repairs:
      - State the counted objects before giving either expression.
      - Explain why the case index is exhaustive and unique.
    status: reviewed
    version: 1
