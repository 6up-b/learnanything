  - id: facet_for_k_ordered_choices_from_n_distinguishable_obj
    title:
    aliases:
      - sampling with and without replacement
    description:
    tags: []
    concept_id: concept_multiplication_rule_and_ordered_sampling
    kind: procedure_contract
    claim: For k ordered choices from n distinguishable objects, sampling with 
      replacement gives n^k outcomes; sampling without replacement gives 
      n(n-1)⋯(n-k+1) for k≤n and zero outcomes for k>n.
    preconditions:
      - Order matters.
      - Objects are distinguishable.
      - The replacement policy is known.
    postconditions:
      - The ordered sample count reflects whether selected objects remain 
        available.
    applicability:
      - Ordered sequences and assignments.
    positive_examples:
      - Birthday assignments modeled as ordered draws with replacement.
      - A podium selected without replacement.
    negative_examples:
      - Unordered committees.
      - Multisets classified only by multiplicity.
    non_goals:
      - Unordered sampling.
    error_signatures:
      - Uses n^k when repetition is forbidden.
      - Uses a falling product for an unordered selection without correcting 
        order.
    instructional_repairs:
      - State whether order matters and whether replacement occurs before 
        selecting a formula.
    status: reviewed
