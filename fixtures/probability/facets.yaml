  - id: facet_if_each_complete_outcome_is_specified_by_success
    title:
    aliases:
      - product rule
    description:
    tags: []
    concept_id: concept_multiplication_rule_and_ordered_sampling
    kind: procedure_contract
    claim: If each complete outcome is specified by successive choices and every
      partial outcome at a stage has the same number of continuations, multiply 
      the stage counts; when continuation counts vary, refine into cases and add
      branch totals instead.
    preconditions:
      - Each complete outcome corresponds to one path through the stages.
      - The multiplied continuation count is uniform across the relevant 
        branches.
    postconditions:
      - Every complete outcome is counted exactly once.
    applicability:
      - Compound experiments with uniform branching.
      - Ordered role assignments and Cartesian-product choices.
    positive_examples:
      - Choosing a row and column on a grid.
      - Assigning first, second, and third places without replacement.
    negative_examples:
      - A tree whose number of second-stage choices depends on the first-stage 
        choice.
    non_goals:
      - Direct multiplication across nonuniform branches.
    error_signatures:
      - Uses one continuation factor despite differing branch sizes.
    instructional_repairs:
      - Draw or describe the branches.
      - Split into cases with uniform stage counts, multiply within cases, and 
        add.
    status: reviewed
    version: 1
