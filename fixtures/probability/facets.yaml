  - id: facet_to_estimate_an_event_probability_by_monte_carlo_
    title:
    aliases:
      - simulation by replication
    description:
    tags: []
    concept_id: concept_monte_carlo_probability_simulation
    kind: procedure_contract
    claim: To estimate an event probability by Monte Carlo simulation, generate 
      many independent outcomes from the intended probability model, evaluate an
      event indicator for each run, and report the proportion of runs in which 
      the event occurs.
    preconditions:
      - The simulation generator matches the intended probability model.
      - An observable event indicator is defined.
      - A number of replications is selected.
    postconditions:
      - An empirical probability estimate is obtained.
    applicability:
      - Checking an analytic result or exploring a model computationally.
    positive_examples:
      - Generate random permutations, test for at least one positional match, 
        and average the indicators.
      - Sample birthdays with replacement before checking for duplicates.
    negative_examples:
      - Sampling birthdays without replacement.
      - Treating one stochastic output as guaranteed.
    non_goals:
      - Replacing analytic justification with a single simulation result.
    error_signatures:
      - Simulation sampling settings do not match the model.
      - Reports a run-dependent estimate as an exact probability.
    instructional_repairs:
      - Check labels, weights, and replacement settings against the mathematical
        experiment.
      - Compare the empirical estimate with an analytic benchmark and 
        acknowledge sampling variation.
