  - id: facet_to_construct_a_story_proof_specify_one_collectio
    title:
    aliases:
      - common-object proof contract
    description:
    tags: []
    concept_id: concept_combinatorial_story_proofs
    kind: procedure_contract
    claim: To construct a story proof, specify one collection of combinatorial 
      objects, count it in the manner represented by each side of the identity, 
      and justify that both descriptions count every object exactly once.
    preconditions:
      - Both expressions admit compatible interpretations as counts of the same 
        collection.
    postconditions:
      - The identity follows because its two sides count the same collection.
    applicability:
      - Binomial-coefficient and set-partition identities for which algebraic 
        terms correspond to exhaustive, nonoverlapping cases.
    positive_examples:
      - Distinguish whether a specified person is selected to obtain the two 
        cases in Pascal's identity.
    negative_examples:
      - Merely transform one expression algebraically when a story proof is 
        requested.
    non_goals:
      - The procedure does not require every valid algebraic identity to have a 
        unique story interpretation.
    error_signatures:
      - The proposed cases overlap or omit some objects.
      - The argument gives two unrelated collections without a bijection or 
        common counted collection.
    instructional_repairs:
      - Name the counted object before interpreting individual terms.
      - Identify the distinguishing feature that makes the cases exhaustive and 
        disjoint.
