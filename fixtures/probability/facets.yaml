  - id: facet_when_m_interchangeable_objects_are_distributed_a
    title:
    aliases:
      - interchangeable-object distribution contract
    description:
    tags: []
    concept_id: concept_stars_and_bars
    kind: procedure_contract
    claim: When m interchangeable objects are distributed among r labeled 
      recipients and only recipient totals matter, encode the outcome as 
      nonnegative integers summing to m; if every recipient must receive at 
      least one, subtract one from each recipient total before applying 
      combinations-with-repetition counting.
    preconditions:
      - Objects are interchangeable.
      - Recipients or categories are distinguishable.
      - Only the number received by each recipient matters.
    postconditions:
      - The distribution problem is converted bijectively to an 
        integer-composition problem.
    applicability:
      - Allocating fungible objects among labeled recipients with nonnegative or
        positive lower bounds.
    positive_examples:
      - Count nonnegative solutions to x1+...+xr=m.
      - For positive allocations, set yi=xi-1 and count nonnegative solutions 
        summing to m-r.
    negative_examples:
      - Assign individually distinct chocolate bars using only recipient totals.
    non_goals:
      - The procedure does not count assignments when the identities of 
        individual objects affect the outcome.
    error_signatures:
      - The method is applied to distinguishable objects.
      - A positive lower bound is imposed without shifting the variables.
      - Recipients are treated as unlabeled.
    instructional_repairs:
      - Ask whether exchanging two objects assigned to the same or different 
        recipients creates a new outcome.
      - Write the sum constraint and lower bounds before choosing a formula.
