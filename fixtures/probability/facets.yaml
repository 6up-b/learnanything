  - id: facet_an_ordered_sequence_of_repeated_binary_trials_ca
    title:
    aliases:
      - binary-sequence sample space
    description:
    tags: []
    concept_id: concept_finite_outcome_counting
    kind: interpretation
    claim: An ordered sequence of repeated binary trials can be represented as a
      fixed-length string or coordinate sequence, with one coordinate for each 
      trial.
    preconditions:
      - The number and order of trials are fixed.
      - Each trial has two represented outcomes.
    postconditions:
      - Each complete ordered outcome has one fixed-length representation.
    applicability:
      - Repeated coin flips and other binary trials.
    positive_examples:
      - A three-flip outcome is represented by one of the length-three H/T 
        strings.
    negative_examples:
      - Representing HHT and HTH as the same outcome when trial order matters.
    non_goals:
      - Claiming that the represented outcomes are equally likely.
    error_signatures:
      - Order-distinct outcomes are merged.
      - Strings have the wrong length.
    instructional_repairs:
      - Create one coordinate per trial and preserve the order of the observed 
        results.
    status: reviewed
    version: 1
