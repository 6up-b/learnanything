  - id: facet_for_a_finite_sample_space_s_whose_elementary_out
    title:
    aliases:
      - naive probability applicability check
    description:
    tags: []
    concept_id: concept_outcome_modeling_for_counting_probability
    kind: procedure_contract
    claim: For a finite sample space S whose elementary outcomes are equally 
      likely, P(A)=|A|/|S|; the ratio is not justified until the outcome 
      representation and equal-likelihood assumption have been checked.
    preconditions:
      - The sample space is finite.
      - The counted elementary outcomes are equally likely.
      - A is an event in the sample space.
    postconditions:
      - The event probability is obtained from favorable and total outcome 
        counts.
    applicability:
      - Finite equally likely probability models.
    positive_examples:
      - Labeled ordered pairs from two fair dice.
      - Orders of a well-shuffled standard deck.
    negative_examples:
      - Unordered multiplicity patterns induced by equally likely ordered draws.
      - Binary verbal alternatives with no symmetry justification.
    non_goals:
      - Probability models with unequal outcome weights or infinite sample 
        spaces.
    error_signatures:
      - Uses a count ratio without justifying equal likelihood.
      - Collapses labeled outcomes into aggregates having unequal numbers of 
        realizations.
    instructional_repairs:
      - Specify elementary outcomes before counting.
      - Justify equal likelihood through the model, symmetry, or sampling 
        design.
