  - id: facet_equal_long_run_counts_of_two_event_types_do_not_
    title:
    aliases:
      - equal-count versus first-arrival distinction
    description:
    tags: []
    concept_id: concept_random_time_sampling_and_first_arrival_bias
    kind: interpretation
    claim: Equal long-run counts of two event types do not imply equal 
      probabilities of observing those types next when a randomly timed observer
      samples only the first subsequent event.
    preconditions:
      - Long-run event counts and random-time first-arrival observations are 
        produced by different sampling protocols.
      - The time intervals associated with the possible next events may have 
        unequal lengths.
    postconditions:
      - Count-based and first-arrival distributions are distinguished.
      - An apparent directional bias is not automatically interpreted as an 
        underlying imbalance in directional counts.
    applicability:
      - The elevator paradox.
      - Any process in which observers arrive at random times and record only 
        the next event.
    positive_examples:
      - An elevator can stop equally often while traveling upward and downward, 
        yet be downward next during most of the cycle at a floor near the 
        bottom.
    negative_examples:
      - Inferring an inherent directional preference solely from the directions 
        reported by randomly arriving observers.
    non_goals:
      - This claim does not deny that operational factors can create genuine 
        directional imbalances.
      - This claim does not state that every first-arrival process is biased.
    error_signatures:
      - Conflates a long-run census of all events with a sample of next events.
      - Treats an observer-location effect as proof of an inherent directional 
        preference.
    instructional_repairs:
      - State the sampling protocol before interpreting the observed 
        distribution.
      - Compare the time windows leading to each next-event outcome.
    status: reviewed
    version: 1
    semantic_fingerprint: sf_87bfd07f4415dd70
