  - id: facet_in_the_uniform_n_card_matching_problem_intersect
    title:
    aliases:
      - de Montmort matching calculation
    description:
    tags: []
    concept_id: concept_inclusion_exclusion
    kind: interpretation
    claim: In the uniform n-card matching problem, intersections of r specified 
      matching events have probability (n-r)!/n!, so symmetry groups the 
      inclusion-exclusion terms into 1-1/2!+1/3!-⋯+(-1)^(n+1)/n!, which 
      approaches 1-1/e.
    preconditions:
      - Cards and positions are distinctly labeled.
      - All n! permutations are equally likely.
      - A_i denotes a match at position i.
    postconditions:
      - The at-least-one-match probability is expressed as a finite alternating 
        factorial sum.
      - Its large-n limit is identified as 1-1/e.
    applicability:
      - The symmetric random-permutation matching model.
    positive_examples:
      - Grouping all r-way fixed-position intersections together.
    negative_examples:
      - Assuming arbitrary event families have equal intersection probabilities.
      - Treating the limiting value as exact for every finite n.
    non_goals:
      - A general claim that every large probability model approaches 1-1/e.
    error_signatures:
      - Simply sums P(A_i).
      - Uses symmetry without checking equal-sized intersections.
      - Equates the finite sum with its limit.
    instructional_repairs:
      - Count permutations after fixing r specified positions.
      - Distinguish the finite alternating sum from its limiting series.
    status: reviewed
    version: 1
    semantic_fingerprint: sf_c66ad6a6266833ed
