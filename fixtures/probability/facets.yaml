  - id: facet_for_events_in_a_common_sample_space_a_union_b_me
    title:
    aliases:
      - union, intersection, and complement semantics
    description:
    tags: []
    concept_id: concept_event_operations
    kind: interpretation
    claim: For events in a common sample space, A union B means at least one 
      occurs, A intersection B means both occur, and the complement of A means A
      does not occur.
    preconditions:
      - A and B are events in a common sample space.
    postconditions:
      - Verbal occurrence conditions can be interpreted as set operations.
    applicability:
      - Constructing compound events.
    positive_examples:
      - At least one of A and B occurs is A union B.
      - Both A and B occur is A intersection B.
    negative_examples:
      - Using an intersection for an at-least-one condition.
    non_goals:
      - Assigning probabilities to the resulting events.
    error_signatures:
      - Union is used for an all-events condition.
      - Intersection is used for an at-least-one condition.
    instructional_repairs:
      - Restate the expression in ordinary language and check its membership 
        condition outcome by outcome.
    status: reviewed
