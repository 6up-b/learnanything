  - id: facet_when_an_observer_arrives_at_a_random_time_in_a_r
    title:
    aliases:
      - time-weighted next-arrival probability
    description:
    tags: []
    concept_id: concept_random_time_sampling_and_first_arrival_bias
    kind: proposition
    claim: When an observer arrives at a random time in a repeating process, the
      probability that a given event type is observed next is determined by the 
      proportion of the cycle during which that type would be the next event, 
      not merely by how often that event type occurs.
    preconditions:
      - The process has a repeating or otherwise well-defined time pattern.
      - The observer's arrival time is stochastic over the observation period.
      - Each possible arrival time determines which event will be observed next.
    postconditions:
      - First-arrival probabilities can be computed by comparing favorable time 
        exposure with total time exposure.
    applicability:
      - Periodic elevator schedules.
      - Other next-arrival settings with unequal intervals between event types.
    positive_examples:
      - If an upward elevator would be next during 2 minutes of a 60-minute 
        cycle, its next-arrival probability is 2/60.
    negative_examples:
      - Counting one upward and one downward stop per cycle and concluding that 
        each direction has next-arrival probability 1/2.
    non_goals:
      - This claim does not assert that event counts are irrelevant when their 
        associated time exposures are equal.
      - This claim does not model arbitrary nonstationary elevator traffic.
    error_signatures:
      - Uses directional arrival counts as the denominator instead of cycle 
        time.
      - Assumes equal counts imply equal random-time first-arrival 
        probabilities.
    instructional_repairs:
      - Partition the observation cycle into intervals according to which event 
        would occur next.
      - Divide the total length of favorable intervals by the cycle duration.
    status: reviewed
    version: 1
