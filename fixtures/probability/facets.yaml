  - id: facet_stars_and_bars_is_applicable_only_when_objects_a
    title:
    aliases:
      - fungible-versus-distinguishable test
    description:
    tags: []
    concept_id: concept_stars_and_bars
    kind: applicability_condition
    claim: Stars and bars is applicable only when objects are fungible and an 
      outcome is determined by recipient totals; when objects are 
      distinguishable, assignments must instead account for each object's 
      recipient choice, with inclusion–exclusion added if all recipients must be
      nonempty.
    preconditions:
      - A distribution problem has been modeled precisely enough to determine 
        whether object identities matter.
    postconditions:
      - The counting method matches the distinguishability structure of the 
        outcomes.
    applicability:
      - Method selection for distribution problems that differ only in whether 
        objects are interchangeable or individually identifiable.
    positive_examples:
      - Use nonnegative compositions for identical bars and recipient-choice 
        functions for distinct bars.
    negative_examples:
      - Treat distinct bars as identical because they have the same physical 
        type.
    non_goals:
      - This distinction does not by itself evaluate a full inclusion–exclusion 
        sum for a surjection count.
    error_signatures:
      - Two assignments differing by an exchange of distinct objects are 
        collapsed into one.
      - A stars-and-bars formula is used without stating fungibility.
    instructional_repairs:
      - Test whether labeling the objects would change which outcomes the 
        problem regards as different.
    status: reviewed
    version: 1
