facets:
  - id: facet_de_morgan_s_laws_rewrite_complements_of_compound
    title:
    aliases:
      - De Morgan laws for events
    description:
    tags: []
    concept_id: concept_event_operations
    kind: proposition
    claim: "De Morgan's laws rewrite complements of compound events by complementing
      each component and exchanging union with intersection: (A union B)^c = A^c intersection
      B^c and (A intersection B)^c = A^c union B^c."
    preconditions:
      - The component events share a sample space.
    postconditions:
      - A complemented union or intersection has an equivalent expression using 
        complemented components.
    applicability:
      - Rewriting and checking compound event expressions.
    positive_examples:
      - None of A or B occurs is A^c intersection B^c.
    negative_examples:
      - Rewriting (A union B)^c as A^c union B^c.
    non_goals:
      - Assuming independence of the events.
    error_signatures:
      - Each component is complemented but the operation is not exchanged.
    instructional_repairs:
      - Swap union and intersection while complementing every component.
    status: reviewed
    version: 1
    semantic_fingerprint: sf_f4924f6256ba28c7
