  - id: facet_for_independent_birthdays_with_category_probabil
    title:
    aliases:
      - birthday-probability smoothing
    description:
    tags: []
    concept_id: concept_nonuniform_birthday_collisions
    kind: procedure_contract
    claim: For independent birthdays with category probabilities p1,...,pn, the 
      probability that k birthdays are all distinct is k! e_k(p1,...,pn); 
      pairwise replacement of two probabilities by their average leaves their 
      sum fixed and, by AM–GM, does not decrease this no-match probability, so 
      repeated equalization shows that the uniform probability vector minimizes 
      collision probability.
    preconditions:
      - The category probabilities are nonnegative and sum to one.
      - Birthday draws are independent.
      - The elementary symmetric polynomial expression for distinct outcomes is 
        available.
    postconditions:
      - A comparison of collision probabilities is reduced to how pairwise 
        averaging changes the elementary symmetric polynomial.
      - The uniform vector is identified as a collision-probability minimizer.
    applicability:
      - Analyzing collision probabilities under nonuniform categorical 
        distributions.
      - Proving an extremal result by pairwise smoothing.
    positive_examples:
      - Expand e_k according to whether a selected product contains neither, 
        exactly one, or both of the two probabilities being averaged.
    negative_examples:
      - Assume that nonuniform outcomes are equally likely or compare only one 
        particular collision pattern.
    non_goals:
      - The procedure does not assert that draws are independent when the 
        sampling model says otherwise.
    error_signatures:
      - Averaging changes the total probability.
      - The factor k! for orderings of k distinct categories is omitted.
      - The direction between no-match probability and collision probability is 
        reversed.
    instructional_repairs:
      - Separate the no-match calculation from its complementary collision 
        probability.
      - Group terms of e_k by their use of the two probabilities being 
        equalized.
    status: reviewed
    version: 1
