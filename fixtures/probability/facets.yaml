  - id: facet_pascal_s_identity_follows_by_counting_k_element_
    title:
    aliases:
      - Pascal recurrence story
    description:
    tags: []
    concept_id: concept_combinatorial_story_proofs
    kind: proposition
    claim: "Pascal's identity follows by counting k-element selections from n+1 objects
      according to whether a distinguished object is absent or present: the two disjoint
      case counts are binom(n,k) and binom(n,k-1)."
    preconditions:
      - n and k are positive integers with n at least k.
    postconditions:
      - The two case counts sum to binom(n+1,k).
    applicability:
      - Recognizing how a two-term binomial identity can encode a case 
        partition.
    positive_examples:
      - Partition committees according to whether a designated person belongs to
        the committee.
    negative_examples:
      - Add two counts whose underlying cases can both hold for one selection.
    non_goals:
      - This facet does not assert that every binomial identity is an instance 
        of Pascal's identity.
    error_signatures:
      - The selected group has inconsistent size across the two cases.
      - The distinguished-object cases are not interpreted on the same 
        population of n+1 objects.
    instructional_repairs:
      - State the size of the full population and the selected subset before 
        splitting into cases.
