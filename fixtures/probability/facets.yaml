  - id: facet_for_a_union_of_overlapping_events_add_the_single
    title:
    aliases:
      - PIE procedure
    description:
    tags: []
    concept_id: concept_inclusion_exclusion
    kind: procedure_contract
    claim: For a union of overlapping events, add the single-event counts, 
      subtract pairwise-intersection counts, and continue through higher 
      intersections with alternating signs; divide by the sample-space size when
      a probability is required.
    preconditions:
      - The relevant event intersections can be counted.
      - The probability normalization is valid for the chosen sample space.
    postconditions:
      - Outcomes in the union have net multiplicity one in the alternating sum.
    applicability:
      - Counting outcomes that violate at least one of several constraints.
      - Computing the probability that at least one category is absent.
    positive_examples:
      - Define one bad event for each missing required category and count their 
        intersections.
    negative_examples:
      - Add the individual bad-event probabilities when several bad events can 
        occur together.
    non_goals:
      - Use a simpler complement or direct count when it already isolates the 
        desired outcomes without overlapping cases.
    error_signatures:
      - Only pairwise corrections are made despite possible triple 
        intersections.
      - Intersection signs do not alternate.
      - Counts from incompatible sample spaces are combined.
    instructional_repairs:
      - Label each bad event and construct an intersection table before forming 
        the alternating sum.
      - Check the contribution of an outcome lying in r bad events.
    status: reviewed
    version: 1
    semantic_fingerprint: sf_733557232cd2a0d8
