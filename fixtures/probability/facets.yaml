  - id: facet_a_probability_function_assigns_events_values_in_
    title:
    aliases:
      - axioms of probability
    description:
    tags: []
    concept_id: concept_probability_axioms_and_derived_rules
    kind: definition
    claim: A probability function assigns events values in [0,1], satisfies 
      P(∅)=0 and P(S)=1, and is countably additive over mutually disjoint 
      events.
    preconditions:
      - A sample space and events are specified.
    postconditions:
      - Finite, countably infinite, and continuous models can be treated without
        assuming equal outcome weights.
    applicability:
      - General probability spaces.
    positive_examples:
      - Unequal masses whose total is one.
      - Disjoint event decompositions.
    negative_examples:
      - Directly adding probabilities of overlapping events.
    non_goals:
      - Requiring all elementary outcomes to be equally likely.
    error_signatures:
      - Applies disjoint additivity to overlapping events.
      - Carries the equal-mass assumption into the axiomatic definition.
    instructional_repairs:
      - Decompose overlapping unions into disjoint pieces or use 
        inclusion-exclusion.
      - Separate the probability axioms from the special naive counting model.
