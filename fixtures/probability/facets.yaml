  - id: facet_the_binomial_coefficient_binom_n_k_counts_size_k
    title:
    aliases:
      - n choose k
    description:
    tags: []
    concept_id: concept_uniform_overcounting_and_binomial_coefficients
    kind: definition
    claim: The binomial coefficient binom(n,k) counts size-k subsets of an 
      n-element set; for 0≤k≤n it equals n(n-1)⋯(n-k+1)/k!=n!/((n-k)!k!), and 
      for k>n it is zero.
    preconditions:
      - n and k are nonnegative integers.
    postconditions:
      - An unordered selection without replacement can be counted.
    applicability:
      - Choosing committees, positions, or subsets without regard to order.
    positive_examples:
      - Choosing k people from n for a committee.
    negative_examples:
      - Ordered lineups.
      - Substituting k>n into a factorial of a negative integer.
    non_goals:
      - Selections with repetition.
    error_signatures:
      - Uses n^k or a falling product without removing order.
      - Attempts to evaluate (n-k)! when k>n.
    instructional_repairs:
      - Interpret the expression as a subset count.
      - Use zero directly when k>n.
    status: reviewed
    version: 1
    semantic_fingerprint: sf_c01f5daa04b22b7f
