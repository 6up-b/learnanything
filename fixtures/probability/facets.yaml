  - id: facet_because_every_event_is_a_subset_of_the_sample_sp
    title:
    aliases:
      - power-set counting
    description:
    tags: []
    concept_id: concept_finite_outcome_counting
    kind: proposition
    claim: Because every event is a subset of the sample space, a finite sample 
      space with n distinct outcomes has 2^n possible events.
    preconditions:
      - The sample space has n distinct outcomes.
      - Every subset is admitted as an event.
    postconditions:
      - The total number of possible events is 2^n.
    applicability:
      - Finite sample spaces.
    positive_examples:
      - A four-outcome sample space has 16 possible events.
      - A 52-card sample space has 2^52 possible events.
    negative_examples:
      - Counting only singleton events and omitting compound events.
    non_goals:
      - Counting outcomes in an infinite sample space.
    error_signatures:
      - The empty event or the full sample space is omitted.
      - The number of events is reported as n instead of 2^n.
    instructional_repairs:
      - 'For each outcome, count the two independent subset choices: included or excluded.'
    status: reviewed
    version: 1
