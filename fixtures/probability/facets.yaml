  - id: facet_from_the_probability_axioms_p_a_c_1_p_a_a_b_impl
    title:
    aliases:
      - complement, monotonicity, and addition rules
    description:
    tags: []
    concept_id: concept_probability_axioms_and_derived_rules
    kind: proposition
    claim: From the probability axioms, P(A^c)=1-P(A), A⊆B implies P(A)≤P(B), 
      and P(A∪B)=P(A)+P(B)-P(A∩B).
    preconditions:
      - A and B are events in a probability space.
    postconditions:
      - Complements, containment, and two-event unions can be evaluated 
        consistently.
    applicability:
      - General probability models.
    positive_examples:
      - Computing an at-least-one event by subtracting a no-occurrence 
        probability.
      - Correcting a two-event sum for overlap.
    negative_examples:
      - Using P(A)+P(B) for overlapping events without subtracting the 
        intersection.
    non_goals:
      - Treating an event and its numerical probability as the same kind of 
        object.
    error_signatures:
      - Adds overlapping-event probabilities directly.
      - Concludes strict monotonicity when the remainder can have probability 
        zero.
    instructional_repairs:
      - Use disjoint decompositions before applying additivity.
      - Track events as sets and probabilities as numbers.
    status: reviewed
    version: 1
    semantic_fingerprint: sf_fe0504e28eb06b55
