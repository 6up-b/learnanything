  - id: facet_the_sample_space_s_of_an_experiment_is_the_set_o
    title:
    aliases:
      - set of all possible outcomes
    description:
    tags: []
    concept_id: concept_sample_space
    kind: definition
    claim: The sample space S of an experiment is the set of all possible 
      outcomes of the experiment.
    preconditions:
      - An experiment and its possible outcomes are specified.
    postconditions:
      - Every possible actual outcome is represented in S.
    applicability:
      - Set-based probability models.
    positive_examples:
      - For ten ordered coin flips, use the set of all length-10 H/T strings.
    negative_examples:
      - A card-draw sample space that omits a card the experiment can produce.
    non_goals:
      - Assigning numerical probabilities to outcomes.
    error_signatures:
      - A possible observed result is not an element of the proposed sample 
        space.
    instructional_repairs:
      - Revise the outcome description so every possible result is included 
        exactly once.
    status: reviewed
    version: 1
