  - id: facet_unordered_selection_of_k_objects_with_replacemen
    title:
    aliases:
      - unordered sampling with replacement
    description:
    tags: []
    concept_id: concept_stars_and_bars
    kind: procedure_contract
    claim: Unordered selection of k objects with replacement from n 
      distinguishable types is equivalent to a nonnegative integer solution of 
      x1+⋯+xn=k and is counted by binom(n+k-1,k) using k stars and n-1 bars.
    preconditions:
      - Repetition is allowed.
      - Order is ignored.
      - Only each type's multiplicity matters.
    postconditions:
      - Each multiplicity vector corresponds to exactly one stars-and-bars 
        string and is counted once.
    applicability:
      - Occupancy vectors and weak compositions.
    positive_examples:
      - Distributing indistinguishable particles among distinguishable boxes.
    negative_examples:
      - Ordered independent draws.
      - Models requiring each box to be nonempty without first transforming the 
        constraints.
    non_goals:
      - Claiming that the resulting multiplicity outcomes are equally likely 
        under ordinary ordered sampling.
    error_signatures:
      - Uses n^k when only multiplicities matter.
      - Uses the multiset count as a probability denominator without an 
        equal-likelihood argument.
    instructional_repairs:
      - Translate selections into a multiplicity equation.
      - Keep the count of configurations distinct from their probabilities.
