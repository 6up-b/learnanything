  - id: facet_a_bootstrap_sample_of_size_n_from_n_distinct_sou
    title:
    aliases:
      - multinomial weighting of unordered bootstrap samples
    description:
    tags: []
    concept_id: concept_bootstrap_sampling
    kind: interpretation
    claim: A bootstrap sample of size n from n distinct source values is an 
      ordered length-n sequence generated by independent uniform draws with 
      replacement; after order is discarded, multiplicity vectors are generally 
      not equally likely because a vector with counts c1,...,cn is realized by 
      n!/(c1!...cn!) ordered sequences.
    preconditions:
      - The source contains n distinct values.
      - Sampling is uniform with replacement.
      - The generated sample is ordered before any order-forgetting 
        transformation.
    postconditions:
      - Ordered samples are equally likely, while unordered multiplicity 
        outcomes receive probabilities proportional to their multinomial 
        multiplicities.
    applicability:
      - Comparing ordered and unordered bootstrap sample spaces.
      - Computing probabilities of sample compositions.
    positive_examples:
      - For source values (3,1), the ordered samples (3,1) and (1,3) both map to
        the same mixed unordered sample, while (3,3) has only one ordering.
    negative_examples:
      - Assign equal probability to every unordered multiplicity vector.
    non_goals:
      - The claim does not apply unchanged to nonuniform source probabilities.
    error_signatures:
      - An unordered sample is assigned probability one divided by the number of
        multiplicity vectors.
      - Permutations realizing the same multiplicities are ignored.
    instructional_repairs:
      - Temporarily restore order, count the sequences realizing each 
        multiplicity vector, and then aggregate their probabilities.
    status: reviewed
    version: 1
    semantic_fingerprint: sf_454eb073a37b2fbd
