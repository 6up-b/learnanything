  - id: facet_counting_each_aggregate_outcome_once_establishes
    title:
    aliases:
      - counting does not establish equal likelihood
    description:
    tags: []
    concept_id: concept_equal_counts_imply_equal_probabilities
    kind: interpretation
    claim: Counting each aggregate outcome once establishes how many aggregates 
      exist, not that the aggregates have equal probability; equal likelihood 
      must be established from the elementary outcome model.
    preconditions:
      - A probability is being formed from combinatorial counts.
    postconditions:
      - Counting multiplicity and probability weight are checked separately.
    applicability:
      - Ordered outcomes collapsed into unordered or otherwise aggregated 
        outcomes.
    positive_examples:
      - Use labeled ordered die pairs as equally likely elementary outcomes.
    negative_examples:
      - Treat unordered birthday lists or die sums as equally likely merely 
        because each is listed once.
    non_goals:
      - Denying that counting can compute probabilities when equal likelihood is
        justified.
    error_signatures:
      - Uses the number of aggregate configurations as a naive-probability 
        denominator.
      - Infers equal probability from one-to-one enumeration alone.
    instructional_repairs:
      - Map each aggregate to its underlying equally likely elementary outcomes.
      - Retain the ordered sample space when aggregate multiplicities differ.
