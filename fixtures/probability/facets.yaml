  - id: facet_an_event_a_is_a_subset_of_the_sample_space_s_and
    title:
    aliases:
      - subset event
    description:
    tags: []
    concept_id: concept_event
    kind: definition
    claim: An event A is a subset of the sample space S, and it occurs exactly 
      when the actual outcome belongs to A.
    preconditions:
      - A sample space and an actual outcome are specified.
    postconditions:
      - The event can be represented and tested using set membership.
    applicability:
      - Events in a set-based probability model.
    positive_examples:
      - The event that the first coin flip is Heads is the subset of sequences 
        whose first coordinate is H.
    negative_examples:
      - Treating an event as necessarily a single outcome.
    non_goals:
      - Computing the event's probability.
    error_signatures:
      - An event contains objects that are not outcomes in the sample space.
    instructional_repairs:
      - Write the event explicitly as a subset of the chosen sample space.
    status: reviewed
    version: 1
