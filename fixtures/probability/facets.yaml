  - id: facet_if_an_auxiliary_counting_method_represents_every
    title:
    aliases:
      - adjusting for overcounting
    description:
    tags: []
    concept_id: concept_uniform_overcounting_and_binomial_coefficients
    kind: procedure_contract
    claim: If an auxiliary counting method represents every desired outcome 
      exactly c times for the same positive c, divide the auxiliary count by c; 
      division by a single factor is invalid when multiplicities differ.
    preconditions:
      - Every desired outcome has the same representation multiplicity c.
    postconditions:
      - Each desired outcome contributes once to the corrected count.
    applicability:
      - Removing irrelevant order with a uniform multiplicity.
    positive_examples:
      - Dividing ordered size-k selections of distinct objects by k!.
    negative_examples:
      - Dividing ordered pairs with repetition by 2, since repeated and distinct
        pairs have different multiplicities.
    non_goals:
      - Nonuniform orbit or representation sizes.
    error_signatures:
      - Divides by a guessed symmetry factor without checking every outcome's 
        multiplicity.
    instructional_repairs:
      - Compare the representation count of repeated-item and distinct-item 
        outcomes.
      - Partition into uniform cases or choose a one-to-one representation.
