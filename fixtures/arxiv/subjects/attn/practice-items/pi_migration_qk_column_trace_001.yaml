variant_contract:
teach_back_source:
prompt: For x1=[1,1], x2=[1,-1], WQ=I, WK=diag(2,1), and query position 1, form 
  q1 and both keys, compute the two key-query dot products, divide them by 
  sqrt(2), and softmax the resulting column. Show every intermediate vector and 
  score.
expected_answer: q1=WQx1=[1,1]. k1=WKx1=[2,1] and k2=WKx2=[2,-1]. The dot scores
  are k1·q1=3 and k2·q1=1. Dividing by sqrt(2) gives approximately 
  [2.121,0.707]. Softmax of that column is approximately [0.804,0.196], which is
  normalized only after projection, dot products, and scaling.
