teach_back_source:
prompt: A production policy must choose between ordinary temperature sampling 
  and deterministic greedy decoding. State when softmax normalization is still 
  required, analyze the T→0 limit, and explain why the limiting distribution 
  should not be confused with taking an argmax before forming probabilities.
expected_answer: "A complete response establishes each required point:\n- softmax_normalization:
  Softmax converts a vector of logits into a nonnegative probability distribution
  that sums to one.\n- zero_argmax_limit: As positive softmax temperature approaches
  zero, probability concentrates on the maximum-logit token."
