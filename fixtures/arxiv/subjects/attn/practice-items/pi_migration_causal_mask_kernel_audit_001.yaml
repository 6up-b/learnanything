teach_back_source:
prompt: 'A GPU kernel receives an attention-score row before softmax. Its author proposes
  zeroing future entries after softmax. Audit the proposal: state where the mask belongs,
  what value represents a forbidden logit, what probability it becomes, and why the
  permitted entries must still normalize.'
expected_answer: "A complete response establishes each required point:\n- future_blocked:
  In causal attention, later tokens must not influence representations at earlier
  positions.\n- negative_infinity_to_zero: A logit of negative infinity contributes
  zero probability after softmax.\n- normalization_preserved: Applying a causal mask
  before softmax renormalizes probability over only the allowed positions.\n- pre_softmax_logits:
  Causal masking is applied to attention logits before softmax."
