variant_contract:
teach_back_source:
prompt: 'Use column-vector convention. Let x1=[1,0]^T and x2=[0,1]^T, with W_Q=W_K=I_2
  and d_k=2. For the target token x1: (1) form q1 and keys k1,k2; (2) compute q1^T
  k1 and q1^T k2; (3) divide both scores by sqrt(d_k); and (4) apply softmax to that
  two-entry score column. Show every intermediate vector and give the final attention
  weights to three decimals.'
expected_answer: q1=W_Q x1=[1,0]^T, k1=W_K x1=[1,0]^T, and k2=W_K x2=[0,1]^T. 
  The raw score column is [1,0]^T. After scaling it is [1/sqrt(2),0]^T, 
  approximately [0.7071,0]^T. Column-wise softmax gives 
  [exp(1/sqrt(2))/(exp(1/sqrt(2))+1), 1/(exp(1/sqrt(2))+1)]^T, approximately 
  [0.670,0.330]^T.
