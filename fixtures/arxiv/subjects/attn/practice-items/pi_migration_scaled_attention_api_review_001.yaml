trace_contract:
variant_contract:
teach_back_source:
prompt: 'An API names Q, K, and V but its documentation says values determine compatibility
  and keys are averaged into the output. Rewrite the documentation as a precise dataflow:
  assign each tensor its role, explain score construction and scaling, normalization,
  and the final value mixture in an unambiguous order.'
expected_answer: "A complete response establishes each required point:\n- clarity:
  A technically coherent attention explanation distinguishes how query-key comparisons
  form weights from how values supply output content.\n- compatibility_weights: Query-key
  compatibility scores determine the normalized attention weights.\n- correct_order:
  Scaled dot-product attention computes query-key dot products, scales the scores,
  applies softmax, and then forms a weighted sum of values in that order.\n- dot_products:
  Scaled dot-product attention scores each key by taking its dot product with the
  query.\n- qkv_roles: Queries express what a position seeks, keys are compared with
  queries to form weights, and values carry the content mixed into the output.\n-
  scaling: Scaled dot-product attention divides query-key dot products by the square
  root of the key dimension.\n- softmax: Scaled dot-product attention applies softmax
  to scaled compatibility scores to obtain attention weights.\n- value_weighting:
  An attention output multiplies each value vector by its corresponding attention
  weight.\n- weighted_sum: An attention output is the weighted sum of value vectors
  using normalized attention weights."
