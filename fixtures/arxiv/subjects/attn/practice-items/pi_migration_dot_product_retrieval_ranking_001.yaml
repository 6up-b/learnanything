teach_back_source:
prompt: A retrieval system ranks candidates using query-vector dot products. 
  Explain how the score is computed, compare the roles of q·a and q·b, and 
  interpret a score of zero without claiming that either vector must itself be 
  the zero vector.
expected_answer: "A complete response establishes each required point:\n- dot_product_ab:
  The dot product a·b is computed by multiplying corresponding components of a and
  b and summing the products.\n- dot_product_ac: The dot product a·c is computed by
  multiplying corresponding components of a and c and summing the products.\n- multiply_sum_method:
  A vector dot product multiplies corresponding components and sums the resulting
  products.\n- zero_interpretation: A zero dot product indicates no positive or negative
  directional alignment in the vector-alignment interpretation."
