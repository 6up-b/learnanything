teach_back_source:
prompt: 'A message-passing explanation says the attention pattern contains the information
  copied into the token and that value vectors merely choose routing probabilities.
  Correct the explanation: identify routing weights, content vectors, the per-target
  weighted column, and the residual destination.'
expected_answer: "A complete response establishes each required point:\n- add_to_embedding:
  An attention head's weighted value update is added to the token's original embedding
  through a residual update.\n- pattern_as_weights: An attention pattern is a set
  of normalized relevance weights over source token positions.\n- values_as_content:
  Value vectors carry the content or update directions that attention mixes into an
  output.\n- weighted_sum_column: For a target token, the attention output column
  is the weighted sum of source value vectors."
