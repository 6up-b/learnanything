teach_back_source:
prompt: Compare two inputs containing identical token embeddings in different 
  orders. Explain what an attention-only stack can and cannot distinguish before
  a positional signal is added, how the signal enters, how relative offsets can 
  be represented, and the learned-versus-sinusoidal tradeoff for longer inputs.
expected_answer: "A complete response establishes each required point:\n- added_to_embeddings:
  A Transformer adds positional encodings to token embeddings before the attention
  stack.\n- extrapolation: Fixed sinusoidal positional encodings were chosen in part
  because their structure may extrapolate to sequence lengths not seen during training.\n\
  - learned_comparison: In the original Transformer experiments, learned positional
  embeddings performed similarly to sinusoidal encodings.\n- no_recurrence_convolution:
  Because a Transformer has neither recurrence nor convolution, self-attention alone
  does not encode token order.\n- order_information: Positional encodings inject sequence-order
  information into token representations.\n- relative_positions: Sinusoidal positional
  encodings may make relative-position relationships easier for attention to learn."
