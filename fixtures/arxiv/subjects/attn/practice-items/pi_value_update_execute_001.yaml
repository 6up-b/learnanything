variant_contract:
teach_back_source:
prompt: For a target token, the attention-pattern column is alpha=[0.25,0.75]^T.
  The source value vectors are v1=[2,0]^T and v2=[0,4]^T, and the target's 
  original embedding is x=[1,1]^T. State which quantities supply weights and 
  which supply content, compute the weighted update Delta x, then apply the 
  residual addition to obtain the updated embedding. Show the coefficient-vector
  products and both vector sums.
expected_answer: alpha supplies the scalar weights, while v1 and v2 supply the 
  content/update directions. Delta 
  x=0.25v1+0.75v2=0.25[2,0]^T+0.75[0,4]^T=[0.5,0]^T+[0,3]^T=[0.5,3]^T. The 
  residual update is x'=x+Delta x=[1,1]^T+[0.5,3]^T=[1.5,4]^T.
