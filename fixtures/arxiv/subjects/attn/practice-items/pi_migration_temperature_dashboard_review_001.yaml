trace_contract:
variant_contract:
teach_back_source:
prompt: A dashboard labels pre-softmax output-head values as probabilities and 
  claims increasing temperature makes the largest value more certain. Correct 
  the full pipeline from unembedding through logits, temperature and softmax, 
  including probability constraints, effects on lower logits and variability, 
  and the zero-temperature limit.
expected_answer: "A complete response establishes each required point:\n- higher_temperature_uniformity:
  Increasing softmax temperature flattens the next-token probability distribution.\n\
  - logits_raw_scores: Logits are raw, unnormalized scores assigned to candidate next
  tokens.\n- lower_temperature_peakedness: Decreasing softmax temperature concentrates
  probability on higher-logit tokens.\n- lower_values_weight: At lower temperature,
  lower-logit tokens receive less relative probability mass; at higher temperature
  they receive more.\n- probability_constraints: Unlike logits, probabilities are
  nonnegative and sum to one across candidate tokens.\n- sampling_variability: Lower
  temperature makes sampling more predictable, while higher temperature increases
  variation.\n- softmax_normalization: Softmax converts a vector of logits into a
  nonnegative probability distribution that sums to one.\n- unembedding_connection:
  The final representation is multiplied by the unembedding matrix to produce vocabulary
  logits.\n- zero_argmax_limit: As positive softmax temperature approaches zero, probability
  concentrates on the maximum-logit token."
