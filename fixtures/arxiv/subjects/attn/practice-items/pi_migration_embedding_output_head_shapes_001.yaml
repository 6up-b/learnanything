teach_back_source:
prompt: A model-interface document says the token embedding maps hidden states 
  to vocabulary probabilities and the output matrix maps token IDs to hidden 
  vectors. Correct the document using matrix directions, explain what is 
  learned, and identify the output quantity immediately before softmax.
expected_answer: "A complete response establishes each required point:\n- embedding_direction:
  The embedding matrix maps a vocabulary token to a vector in the model's representation
  space.\n- embedding_weights: The columns or rows used by the embedding lookup are
  learned model weights.\n- logits_before_softmax: The unembedding output consists
  of raw logits before softmax normalization.\n- unembedding_direction: The unembedding
  matrix maps a model-space vector to one score for each vocabulary token."
