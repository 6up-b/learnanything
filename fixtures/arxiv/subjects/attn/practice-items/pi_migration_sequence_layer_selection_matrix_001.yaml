teach_back_source:
prompt: Build a decision matrix comparing self-attention, recurrence, and 
  convolution for parallelism, path length between distant tokens, and 
  sequence-length cost. Use it to reject the claim that one layer type dominates
  under every constraint.
expected_answer: "A complete response establishes each required point:\n- balanced_comparison:
  Self-attention has tradeoffs and does not dominate recurrent and convolutional layers
  under every computational condition.\n- complexity_tradeoff: The relative cost of
  self-attention and convolution depends on sequence length, representation width,
  and the convolution design.\n- convolution_path: A convolutional sequence model
  generally needs multiple layers or dilation to connect distant positions.\n- long_range_dependency_link:
  Shorter computational paths between distant positions can make long-range dependencies
  easier to learn.\n- recurrent_sequential: A recurrent sequence model processes token
  positions sequentially rather than all positions in parallel.\n- self_attention_parallel:
  Self-attention can compute representations for all sequence positions with a constant
  number of sequential operations.\n- self_attention_path: Self-attention provides
  a short computational path between any two sequence positions.\n- three_criteria:
  Sequence-layer comparisons consider computational complexity, parallelizability,
  and path length between dependencies."
