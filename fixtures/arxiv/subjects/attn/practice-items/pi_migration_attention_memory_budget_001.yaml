trace_contract:
variant_contract:
teach_back_source:
prompt: A deployment estimate doubles context length but assumes the 
  attention-score grid only doubles. Correct the estimate while tracing how Q 
  and K become normalized attention columns. Explain the order of projections, 
  dot products, scaling and softmax, then connect the square score grid to the 
  long-context bottleneck.
expected_answer: "A complete response establishes each required point:\n- bottleneck_implication:
  Quadratic attention-score growth can make memory and computation bottlenecks for
  long contexts.\n- column_softmax_last: After query-key projection, dot products,
  and scaling, softmax normalizes each attention-score column into weights.\n- dot_products_second:
  After forming query and key projections, an attention head computes their pairwise
  dot products.\n- doubling_quadruples: Doubling context length quadruples the number
  of pairwise self-attention scores.\n- qk_first: An attention head forms query and
  key projections before computing compatibility scores.\n- quadratic_scaling: The
  number of pairwise self-attention scores grows quadratically with context length.\n\
  - scale_before_softmax: Scaled dot-product attention divides query-key scores by
  the key-dimension scale before applying softmax."
