trace_contract:
variant_contract:
teach_back_source:
prompt: Review an encoder-decoder system diagram from raw text to next-token 
  probabilities. Correct the order and interfaces, name the encoder and decoder 
  sublayers, distinguish masked self-attention from encoder-decoder attention, 
  and explain residual, normalization, feed-forward, stacking, output projection
  and softmax roles while preserving dimensions.
expected_answer: "A complete response establishes each required point:\n- attention_role:
  Within a Transformer block, attention exchanges information across token positions.\n\
  - decoder_ffn: Each Transformer decoder layer includes a position-wise feed-forward
  sublayer.\n- decoder_masked_self_attention: Each Transformer decoder layer includes
  masked self-attention over the target sequence.\n- dimension_consistency: A residual
  connection requires its sublayer input and output to share the same model dimension.\n\
  - embedding_order: Transformer data flow embeds tokens before repeated attention
  and feed-forward processing.\n- encoder_decoder_attention: A Transformer decoder
  layer attends to encoder outputs through encoder-decoder cross-attention.\n- encoder_sublayers:
  A Transformer encoder layer contains multi-head self-attention and a position-wise
  feed-forward network.\n- feed_forward_role: A Transformer's feed-forward sublayer
  applies the same learned transformation independently at each token position.\n\
  - layer_norm: In the original Transformer architecture, layer normalization follows
  each residual addition around a sublayer.\n- residual_connections: Transformer sublayers
  use residual connections that add the sublayer input to its output.\n- softmax_role:
  At a Transformer's output, softmax converts unembedding logits into token probabilities.\n\
  - stacked_layers: A Transformer repeats encoder and decoder layer structures in
  stacks.\n- tokenization_order: Transformer processing tokenizes input text before
  mapping token IDs to embeddings.\n- unembedding_role: Unembedding projects contextual
  token representations into raw vocabulary scores."
