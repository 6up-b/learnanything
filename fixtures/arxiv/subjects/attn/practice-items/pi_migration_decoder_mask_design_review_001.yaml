teach_back_source:
prompt: 'An encoder-decoder training run reports suspiciously perfect next-token accuracy.
  The decoder saw the unshifted target sequence and no triangular mask. Diagnose the
  leakage: describe which positions are legal, how the mask changes scores, why targets
  are offset, and why this causal restriction is decoder-specific.'
expected_answer: "A complete response establishes each required point:\n- allowed_positions:
  At decoder position t, causal self-attention may attend only to positions at or
  before t.\n- autoregressive_property: Autoregressive prediction preserves generation
  order by preventing a position from using future target tokens.\n- future_leakage:
  Allowing a decoder position to attend to later target tokens leaks future-answer
  information.\n- masking_mechanism: Causal masking makes future-position logits effectively
  negative infinity before softmax so their attention weights become zero.\n- offset_embeddings:
  During decoder training, shifted target embeddings align each input prefix with
  the next-token prediction target.\n- specific_to_decoder: Causal target-position
  masking applies to autoregressive decoder self-attention, not ordinary bidirectional
  encoder self-attention."
