teach_back_source:
prompt: You must choose a positional scheme for an attention-only service 
  trained on length 512 but expected to see longer sequences. Compare learned 
  and sinusoidal encodings using the original empirical result, explain why 
  attention alone lacks order, and justify which property matters for the 
  deployment choice.
expected_answer: "A complete response establishes each required point:\n- extrapolation:
  Fixed sinusoidal positional encodings were chosen in part because their structure
  may extrapolate to sequence lengths not seen during training.\n- learned_comparison:
  In the original Transformer experiments, learned positional embeddings performed
  similarly to sinusoidal encodings.\n- no_recurrence_convolution: Because a Transformer
  has neither recurrence nor convolution, self-attention alone does not encode token
  order."
