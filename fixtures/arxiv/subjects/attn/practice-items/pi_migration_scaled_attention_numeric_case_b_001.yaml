teach_back_source:
prompt: For q=[1,1], keys k1=[2,0], k2=[0,0], and dk=2, compute the 
  compatibility scores, scale them, and softmax them. Present the operations in 
  executable order and give the two weights numerically to three decimals.
expected_answer: The dot products are q·k1=2 and q·k2=0. Scale by 
  sqrt(dk)=sqrt(2) to obtain [1.414,0]. Softmax gives approximately 
  [0.804,0.196]. The executable order is dot products, scaling, then softmax.
