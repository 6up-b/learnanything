teach_back_source:
prompt: An activation report shows several attention maps for the same layer. 
  Explain why the maps can differ, what relationships and update subspaces they 
  may capture in parallel, and how the separate head results become one layer 
  result.
expected_answer: "A complete response establishes each required point:\n- combined_result:
  Multi-head attention combines the per-head updates into one result for each token
  position.\n- different_relationships: Different attention heads can learn different
  contextual relationships between token positions.\n- distinct_maps: Each attention
  head has its own learned query, key, and value projection maps.\n- parallel_updates:
  Multiple attention heads run in parallel and each proposes a token update."
