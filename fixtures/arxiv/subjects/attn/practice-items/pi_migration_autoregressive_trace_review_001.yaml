teach_back_source:
prompt: 'A streaming text service emits one token and then predicts again. Review
  its trace as a state-transition system: identify what is sampled, what is appended
  to state, and what repeats. Explain why predicting repeatedly from the unchanged
  prefix is not autoregressive generation.'
expected_answer: "A complete response establishes each required point:\n- append_step:
  Autoregressive generation appends the selected next token to the existing sequence
  before the next prediction.\n- iteration_loop: Autoregressive generation repeats
  prediction, token selection, and append steps on the updated sequence.\n- sampling_step:
  Autoregressive generation selects or samples one token from the predicted next-token
  distribution."
