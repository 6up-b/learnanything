variant_contract:
teach_back_source:
prompt: A target column has attention weights [0.6,0.1,0.3] and value vectors 
  [1,0], [0,2], and [-1,1]. Identify weights versus content, compute the 
  weighted update column, and add it to the target embedding [2,-1]. Show the 
  vector arithmetic.
expected_answer: The attention-pattern entries are weights and the value vectors
  are content. The update column is 
  0.6[1,0]+0.1[0,2]+0.3[-1,1]=[0.6,0]+[0,0.2]+[-0.3,0.3]=[0.3,0.5]. Residual 
  addition gives [2,-1]+[0.3,0.5]=[2.3,-0.5].
