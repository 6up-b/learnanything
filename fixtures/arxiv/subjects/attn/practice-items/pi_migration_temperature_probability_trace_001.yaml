variant_contract:
teach_back_source:
prompt: For logits [2,0,-1], compare the next-token distribution at T=0.5 and 
  T=2. Show the scaled logits and normalized probabilities, identify how 
  lower-scored tokens change weight, and describe sampling variability and the 
  T→0 limit.
expected_answer: The raw logits are [2,0,-1]. At T=0.5 the scaled logits are 
  [4,0,-2] and softmax is approximately [0.980,0.018,0.002]. At T=2 the scaled 
  logits are [1,0,-0.5] and softmax is approximately [0.629,0.231,0.140]. Higher
  temperature gives lower-scored tokens more weight and raises sampling 
  variability; as positive T approaches zero, mass concentrates on the maximum 
  logit.
