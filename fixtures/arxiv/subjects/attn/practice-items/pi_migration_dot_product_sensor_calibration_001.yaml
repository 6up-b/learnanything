variant_contract:
teach_back_source:
prompt: A sensor emits a=[2,-1]. Two reference directions are b=[3,4] and 
  c=[-1,5]. Compute a·b and a·c by showing component products and sums, then 
  rank the two references by the resulting alignment score.
expected_answer: Compute a·b=(2)(3)+(-1)(4)=6-4=2. Compute 
  a·c=(2)(-1)+(-1)(5)=-2-5=-7. Therefore b has the larger dot-product alignment 
  score with a (2 > -7).
