    - id: criterion_teach_transfer
      points: 1.0
      description: "Transfers the same reasoning to a model evaluated on reordered
        inputs and sequence positions beyond its training range: identifies the need
        for an explicit order signal, distinguishes the observed similarity between
        learned and sinusoidal encodings from their design differences, and explains
        why fixed sinusoids may be preferable for unseen lengths.\n\nTransfer scenario:
        Consider an attention-only model trained on sequences of at most 128 tokens
        and then tested on a 256-token sequence whose tokens can also appear in a
        different order. Explain how you would reason about the missing order information
        and about choosing between learned positional embeddings and fixed sinusoidal
        encodings for this test."
