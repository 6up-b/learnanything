prompt: 'Teach back the reasoning used in the source problem about two Transformer
  inputs containing the same token embeddings in different orders: explain what the
  attention-only computation can and cannot determine, compare the two positional-encoding
  approaches evaluated in the original paper, and explain the design consideration
  for sequences longer than those used in training.'
expected_answer: 'A complete explanation should connect the architecture to the missing
  information: without recurrence, convolution, or an added positional signal, self-attention
  has no intrinsic representation of token order. It should then accurately report
  that learned positional embeddings and fixed sinusoidal encodings performed similarly
  in the original experiments. Finally, it should distinguish experimental performance
  from the motivation for choosing sinusoids: their fixed, structured pattern was
  expected to offer a better possibility of extrapolating to sequence lengths beyond
  those observed during training.'
