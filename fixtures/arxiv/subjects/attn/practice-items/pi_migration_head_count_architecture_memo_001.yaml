teach_back_source:
prompt: A team proposes replacing eight attention heads with one wider head 
  because both can run dot products in parallel. Write a design memo explaining 
  what representational capacity is lost, what positions/subspaces have to do 
  with it, and why head count still has a compute/quality tradeoff.
expected_answer: "A complete response establishes each required point:\n- averaging_limitation:
  A single attention head can blur distinct relationships because one attention distribution
  must average competing patterns.\n- cost_reasoning: Using reduced per-head dimensions
  keeps multi-head attention's total computational cost comparable to a single full-dimensional
  head.\n- not_just_parallelism: The purpose of multiple attention heads is representational
  diversity, not merely hardware parallelism.\n- positions: Different attention heads
  can attend to different token positions.\n- subspaces: Different attention heads
  project representations into different learned subspaces."
