trace_contract:
variant_contract:
teach_back_source:
prompt: A serving team caches one vector per vocabulary token and reuses it as 
  the final representation in every sentence and throughout arbitrarily long 
  chats. Write an incident review explaining which representation can be cached,
  how Transformer layers contextualize it, why the same token can end 
  differently across contexts, and what a fixed context window loses.
expected_answer: "A complete response establishes each required point:\n- attention_refines:
  Attention refines a token representation by incorporating information from surrounding
  token representations.\n- context_free_start: A token's initial embedding represents
  the token identity before surrounding context is incorporated.\n- context_incorporation:
  Transformer blocks incorporate information from surrounding and distant tokens into
  each token representation.\n- contextual_meaning: A later-layer token vector expresses
  a richer context-specific meaning than its initial lookup embedding.\n- different_contexts:
  The same token can require different representations when its surrounding context
  selects different meanings.\n- embedding_lookup: A token's initial vector is obtained
  by looking up its learned entry in the embedding matrix.\n- fixed_context_window:
  Context size is the fixed maximum number of token positions the model processes
  together for a prediction.\n- long_conversation_loss: Text outside the model's context
  window cannot directly inform the next prediction, so earlier parts of a long conversation
  can be lost.\n- lookup_context_free: The initial lookup embedding for a token is
  the same before phrase-specific context is incorporated.\n- prediction_dependency:
  A next-token prediction can depend directly only on text represented inside the
  active context window.\n- text_limit: The context-window limit bounds how much prior
  text can be incorporated into one prediction.\n- transformer_updates: Attention
  and feed-forward blocks repeatedly transform each token vector through the network."
