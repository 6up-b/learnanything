schema_version: 1
error_types:
  - id: recall_failure
    title: Recall failure
    description: The learner could not retrieve the answer from memory, for 
      example an "I don't know" attempt. This is a retrieval lapse rather than a
      conceptual misunderstanding.
    related_concepts: []
    severity_default: 0.4
    is_misconception: false
    tags:
      - recall
    created_at: '2026-05-28T20:20:47Z'
    updated_at: '2026-05-28T20:20:47Z'
  - id: scaffold_failure
    title: Scaffold failure
    description: The learner could not reconstruct the answer after hints or 
      other support.
    related_concepts: []
    severity_default: 0.65
    is_misconception: false
    tags:
      - recall
      - scaffold
    created_at: '2026-05-28T20:20:47Z'
    updated_at: '2026-05-28T20:20:47Z'
  - id: arithmetic_slip
    title: Arithmetic slip
    description: The learner used the right concept but made a local numeric or 
      algebraic error.
    related_concepts: []
    severity_default: 0.15
    is_misconception: false
    tags:
      - calculation
    created_at: '2026-05-28T20:20:47Z'
    updated_at: '2026-05-28T20:20:47Z'
  - id: assessment_ambiguity
    title: Assessment ambiguity
    description: 'The item or rubric is ambiguous/defective, so the failure is an
      item/grader issue, not a learner error. Avoid when: The item is sound and the
      learner is genuinely wrong; use the fitting learner mechanism.'
    related_concepts: []
    severity_default: 0.2
    is_misconception: false
    tags:
      - canonical_mechanism
      - causal_basis
    created_at: '2026-07-28T03:55:28Z'
    updated_at: '2026-07-28T03:55:28Z'
  - id: conceptual_schema_error
    title: Conceptual schema error
    description: 'The answer reveals a wrong definition, relationship, interpretation,
      or mental model of the idea. Avoid when: The concept is right but execution
      or method choice is wrong; use procedure/selection/local_slip.'
    related_concepts: []
    severity_default: 0.7
    is_misconception: true
    tags:
      - canonical_mechanism
      - causal_basis
      - legacy_alias:conceptual_error
      - legacy_alias:conceptual_slip
    created_at: '2026-07-28T03:55:29Z'
    updated_at: '2026-07-28T03:55:29Z'
  - id: condition_assumption_error
    title: Condition or assumption error
    description: 'The learner omits, adds, or violates a required precondition/assumption/domain
      restriction. Avoid when: The setup is right but the concept itself is wrong;
      use conceptual_schema_error.'
    related_concepts: []
    severity_default: 0.6
    is_misconception: true
    tags:
      - canonical_mechanism
      - causal_basis
      - legacy_alias:assumption_error
    created_at: '2026-07-28T03:55:30Z'
    updated_at: '2026-07-28T03:55:30Z'
  - id: local_slip
    title: Local slip
    description: 'Setup and method are correct but a local arithmetic/algebra/sign/index/completeness
      step is wrong. Avoid when: The slip follows from choosing the wrong method;
      use selection_planning_error.'
    related_concepts: []
    severity_default: 0.15
    is_misconception: false
    tags:
      - canonical_mechanism
      - causal_basis
      - legacy_alias:arithmetic_slip
      - legacy_alias:incomplete_answer
    created_at: '2026-07-28T03:55:31Z'
    updated_at: '2026-07-28T03:55:31Z'
  - id: procedure_execution_error
    title: Procedure execution error
    description: 'The learner runs a procedure/algorithm but mis-executes a step,
      case split, or condition within it. Avoid when: The wrong procedure/theorem
      was chosen in the first place; use selection_planning_error.'
    related_concepts: []
    severity_default: 0.65
    is_misconception: true
    tags:
      - canonical_mechanism
      - causal_basis
      - legacy_alias:procedure_error
      - legacy_alias:procedure_misapplication
    created_at: '2026-07-28T03:55:32Z'
    updated_at: '2026-07-28T03:55:32Z'
  - id: representation_notation_error
    title: Representation or notation error
    description: 'The error is in notation, representation, units, or translating
      between forms, not the underlying idea. Avoid when: The notation reflects a
      genuinely wrong model; use conceptual_schema_error.'
    related_concepts: []
    severity_default: 0.5
    is_misconception: true
    tags:
      - canonical_mechanism
      - causal_basis
      - legacy_alias:notation_error
    created_at: '2026-07-28T03:55:33Z'
    updated_at: '2026-07-28T03:55:33Z'
  - id: retrieval_failure
    title: Retrieval failure
    description: 'The learner cannot retrieve the requested fact, formula, step, or
      facet (including after hints). Avoid when: The answer gives a wrong model or
      rule; use conceptual_schema_error or selection_planning_error.'
    related_concepts: []
    severity_default: 0.4
    is_misconception: false
    tags:
      - canonical_mechanism
      - causal_basis
      - legacy_alias:recall_failure
      - legacy_alias:scaffold_failure
    created_at: '2026-07-28T03:55:34Z'
    updated_at: '2026-07-28T03:55:34Z'
  - id: selection_planning_error
    title: Selection or planning error
    description: 'The learner selects the wrong rule/theorem/method or plans an approach
      that cannot reach the goal. Avoid when: The right method is chosen but a step
      is mis-run; use procedure_execution_error.'
    related_concepts: []
    severity_default: 0.65
    is_misconception: true
    tags:
      - canonical_mechanism
      - causal_basis
      - legacy_alias:theorem_selection_error
    created_at: '2026-07-28T03:55:35Z'
    updated_at: '2026-07-28T03:55:35Z'
  - id: transfer_context_error
    title: Transfer or context error
    description: 'The learner knows the idea in a familiar surface but fails to apply
      it in a shifted or novel context. Avoid when: The learner never had the idea;
      use retrieval_failure or conceptual_schema_error.'
    related_concepts: []
    severity_default: 0.6
    is_misconception: true
    tags:
      - canonical_mechanism
      - causal_basis
      - legacy_alias:transfer_failure
    created_at: '2026-07-28T03:55:36Z'
    updated_at: '2026-07-28T03:55:36Z'
