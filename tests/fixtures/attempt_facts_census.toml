# The attempt-facts census: every reader that decides whether an attempt was assisted, cold, primed, eligible or
# independent, the predicate it applies, the module that owns that predicate, and whether it reaches it through
# learnloop.attempts.fact_predicates. Checked by tests/test_attempt_facts_census.py: each caller exists and reads
# what the row says, an "adapted" caller names its predicate, every predicate it names is a function of
# fact_predicates, and every function that names one of the predicate authorities (the sets and functions in
# tests/test_attempt_facts_census.py's AUTHORITIES) is a row, so a new reader of one cannot arrive unnamed.
#
# Bounded on purpose: a function is a row when it names a predicate authority, or when it applies an inline
# assistance/coldness expression over hints_used / primed / attempt_type found by the search the record
# (docs/reviews/ep0-attempt-facts.md) gives. Rendering an attempt's stored flags, scoring weights that read a hint
# count, and the submit path's folds that write hints_used and primed are not predicates over the facts.
#
# status:
#   adapted       the caller asks its question through the named predicate (`predicate`), with the values it read
#   delegated     the owner keeps the kernel; the named predicate calls this function
#   named         follows a delegated or adapted row (it calls the owner's function, unchanged)
#   not_adapted   applies its own expression; `predicate` is the equal named predicate where one exists (else
#                 empty), and `why` says why it was not moved
#
# purpose: assisted | cold | primed | eligible | independent | research_cold | help_timing | category | fsrs_cap
# ledger: the discrepancy ledger's row in the record where this reader's answer differs from another's (D-n).

