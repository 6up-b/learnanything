# The evidence-cutoff census (evidence packets EP0t): every read-model caller that cuts learner evidence by time,
# the cutoff preset it follows (learnloop.db.evidence_cutoff), and the evidence it reads. Checked by
# tests/test_evidence_cutoff_census.py: each caller exists and makes the call named, each "adapted" reader names the
# cutoff module, each proof test exists, and every function that asks the availability predicate or builds a
# closure is a row here.
#
# Bounded on purpose: a clock for scheduling or expiry (a due date, a lease, a retention sweep) is not an evidence
# cutoff, and a parameter named now/before/as_of is not one by its name; reads that keep occurrence time for outcomes,
# FSRS, mastery and reports are tests/test_ro1_availability_reads.py's OCCURRENCE_TIME_READS.
#
# status:
#   adapted      the reader states its preset through the cutoff type (its comparison is the preset's kernel)
#   named        the reader follows the preset through a census row above it (a caller of an adapted reader)
#   no_preset    no preset reproduces it without a changed result; not adapted (the reason is in `differs`)
#   not_a_cutoff named because it looks like one: what it is instead is in `evidence`

